services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sisg
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisg -d sisg_test"]
      interval: 2s
      timeout: 3s
      retries: 30
