# Producción (Coolify / cualquier servidor con Docker): base de datos + API + interfaz.
# Los secretos NO están aquí: se definen como variables de entorno (ver .env.example y DESPLIEGUE.md).
# El almacén de datos (carpeta dw/, otro MySQL) es una herramienta de análisis local y no forma parte de este despliegue.
# El desarrollo local usa backend/docker-compose.yml.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?defina DB_PASS}
      MYSQL_DATABASE: ${DB_NAME:-sisg}
      MYSQL_USER: ${DB_USER:?defina DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS}
    volumes:
      - sisg_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin "ports": la base solo es accesible desde la red interna del compose.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?defina DB_USER}
      DB_PASS: ${DB_PASS:?defina DB_PASS}
      DB_NAME: ${DB_NAME:-sisg}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -hex 32)}
      MFA_KEY: ${MFA_KEY:?defina MFA_KEY (openssl rand -base64 32)}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL (https://app.sudominio.com)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Crea el esquema al arrancar. Déjelo en true en el primer despliegue y tras cambiar el esquema; ver DESPLIEGUE.md.
      DB_SYNC: ${DB_SYNC:-false}
      # Opcionales: crean el superadministrador la primera vez que arranca (después pueden quitarse).
      SUPERADMIN_CORREO: ${SUPERADMIN_CORREO:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      # Detrás del proxy de Coolify: toma la IP real del cliente (bloqueo por intentos y límite de peticiones).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "3000"

  frontend:
    build:
      context: ./nuevo-diseño
      args:
        VITE_API_URL: ${API_URL:?defina API_URL (https://api.sudominio.com)}
    restart: unless-stopped
    environment:
      # Opcional: solo para la función «Mensajes con IA» de campañas.
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  sisg_mysqldata:
