<style>
:root{--g:#0f766e;--g2:#e8f5f3;--o:#d97706;--ink:#14302d}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b1f1d;color:var(--ink)}
#stage{height:100%;display:flex;flex-direction:column}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px}
.slide{width:min(100%,calc((100vh - 24px) * 16 / 9));aspect-ratio:16/9;background:#fff;border-radius:14px;padding:3.2% 4.5%;overflow:hidden;position:relative;font-size:clamp(11px,1.65vw,26px);line-height:1.35}
.slide h1{margin:0 0 .4em;font-size:1.9em;color:var(--g)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.box{background:var(--g2);border-radius:10px;padding:.6em .8em;border-left:5px solid var(--g)}
.box.o{background:#fff3e0;border-color:var(--o)}.box.r{background:#fdecec;border-color:#dc2626}.box.b{background:#e8efff;border-color:#2563eb}.box.p{background:#f1eaff;border-color:#7c3aed}
.flow{display:flex;align-items:stretch;gap:.4em}.flow .box{flex:1;text-align:center}.flow .ar{align-self:center;font-size:1.4em;color:#889}
table{border-collapse:collapse;width:100%;font-size:.78em}td,th{border:1px solid #cfdcd9;padding:.25em .5em;text-align:left}th{background:var(--g2)}
code{background:#eef3f2;padding:0 .3em;border-radius:4px;font-size:.88em}
pre{background:#10201e;color:#d7f5ef;border-radius:8px;padding:.6em .8em;font-size:.72em;margin:.4em 0;overflow:hidden}
.big{font-size:1.25em;font-weight:700;color:var(--g)}.mut{color:#667;font-size:.85em}
.star{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;text-align:center;font-size:.8em}
.f{background:var(--o);color:#fff;border-radius:8px;padding:.5em;font-weight:700}.d{background:var(--g2);border:2px solid var(--g);border-radius:8px;padding:.4em}.dc{background:#d6f0ea;border:3px solid var(--g);border-radius:8px;padding:.4em;font-weight:700}
.num{position:absolute;right:2%;bottom:2%;font-size:.6em;color:#99a}

#bar button{background:#16403b;color:#cfe;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
#q{background:#0f2b28;color:#e6fffb;border:1px solid #2a6a62;border-radius:6px;padding:5px 9px;width:230px;font-size:13px}

#res div{padding:8px 12px;border-bottom:1px solid #e3eeec;cursor:pointer}#res div:hover,#res div.on{background:#e8f5f3}#res b{color:#0f766e}#res small{display:block;color:#667;margin-top:2px}
#prog{flex:1;height:5px;background:#16403b;border-radius:3px}#prog i{display:block;height:100%;background:#2dd4bf;border-radius:3px}

</style></head><body>

<div id="bar"><button onclick="go(-1)">◀</button><button onclick="go(1)">▶</button><div id="prog"><i></i></div><span id="cnt"></span><input id="q" placeholder="Buscar en la presentación  ( / )" autocomplete="off"><div id="res"></div><button onclick="tn()">Guion (N)</button><button onclick="document.documentElement.requestFullscreen()">Pantalla completa (F)</button></div></div>
<script>
// Cada diapositiva: [html, guion]
const S=[
[`<div style="margin-top:5%"><h1 style="font-size:2.4em">SISG · Módulo del Grupo 4</h1><div class="big">Plan de gestión del proyecto</div><p>Sistema Integral de Salud de Guatemala · centros de diagnóstico y organismos no lucrativos</p><p><b>Administración de Proyectos Tecnológicos</b> (3CE0101) · Ing. Rafael G. Barrios Parra<br>Universidad San Pablo de Guatemala</p><p><b>Grupo 4:</b> Javier Augusto Estrada Gordillo · Jonathan Eduardo Jolón García · Jonathan Javier Soberanis Castillo</p><p class="mut">Documentos con corte al 24 de octubre de 2026 · cifras técnicas actualizadas al 14 de noviembre de 2026</p></div>`,
`Buenos días. Somos el Grupo 4 y presentamos el plan de gestión de SISG, el módulo para centros de diagnóstico y organismos no lucrativos del Sistema Integral de Salud de Guatemala. Esta presentación es la del curso de Administración de Proyectos Tecnológicos: no explica cómo está hecha la base de datos, eso lo presentamos en Bases de Datos II, sino cómo planificamos, medimos y controlamos el proyecto. Los documentos tienen corte al veinticuatro de octubre y las cifras técnicas las actualizamos en noviembre; en cada diapositiva aclaramos cuando un dato es de una fecha o de la otra.`],

[`<h2>Agenda</h2><div class="cols"><div class="box"><b>Iniciación y alcance</b><ol><li>Contexto y justificación</li><li>Objetivos y criterios de éxito</li><li>Alcance, entregables y exclusiones</li><li>Supuestos, restricciones y roles</li><li>Enfoque híbrido y backlog</li></ol><b>Planificación</b><ol start="6"><li>EDT y paquetes de trabajo</li><li>Cronograma: PDM, ruta crítica, PERT, Gantt</li><li>Costos y valor ganado</li></ol></div><div class="box o"><b>Interesados y comunicación</b><ol start="9"><li>Registro y matriz poder-interés</li><li>Plan de comunicaciones y reporte de estado</li></ol><b>Riesgos y calidad</b><ol start="11"><li>Gestión de riesgos</li><li>Plan de calidad y evidencia</li><li>Prueba de usabilidad</li></ol><b>Cierre</b><ol start="14"><li>Lecciones aprendidas</li><li>Declaración de uso de IA</li><li>Pendientes, referencias y preguntas</li></ol></div></div>`,
`La presentación sigue el orden del ciclo de vida del proyecto. Empezamos por la iniciación: el acta, los objetivos y el alcance. Seguimos con la planificación: la estructura de desglose del trabajo, el cronograma con su ruta crítica y los costos con valor ganado. Después los interesados y la comunicación, los riesgos y la calidad, con la evidencia que ya tenemos, y cerramos con lecciones aprendidas, la declaración de uso de inteligencia artificial y lo que queda pendiente. Cada tabla es la misma que está en el documento escrito en formato IEEE.`],

[`<h2>Contexto y justificación</h2><div class="cols"><div><p><b>El proyecto:</b> SISG – Módulo del Grupo 4. Registra pacientes, estudios diagnósticos y campañas de salud de dos tipos de actores, y deja los datos listos para analizarse en un almacén con modelo estrella.</p><p><b>Un solo proyecto, dos cursos:</b> Administración de Proyectos Tecnológicos (este plan) y Bases de Datos II (ER, estrella, ETL, consultas; Inga. Claudia Alegre).</p></div><div class="box"><b>Caso de negocio</b><ul style="font-size:.84em"><li>Los centros y organismos <b>alimentan y consumen</b> datos, pero trabajan con Excel y bases aisladas.</li><li>Sin un modelo común, ministerios, aseguradoras y universidades <b>no pueden comparar</b> estudios ni campañas.</li><li>La <b>OPS</b> propone partir de una <b>línea base</b>, una <b>arquitectura objetivo</b> y <b>transiciones</b>, con interoperabilidad y seguridad como principios.</li></ul></div></div><p style="font-size:.8em"><b>Propósito:</b> entregar ese modelo común y demostrar, con datos de prueba, que los indicadores se calculan <b>sin perder filas ni montos</b> (reconciliación en cero).</p>`,
`El proyecto registra pacientes, estudios y campañas de dos tipos de actores y deja los datos listos para el análisis. Es un solo proyecto que se entrega en dos cursos. La justificación del negocio es que estos actores alimentan y consumen datos, pero hoy trabajan con archivos de Excel y bases aisladas, y sin un modelo común nadie puede comparar estudios ni campañas. El documento de la OPS plantea partir de una línea base, definir una arquitectura objetivo y planear transiciones, con la interoperabilidad y la seguridad como principios. Nuestro propósito es entregar ese modelo común y demostrar que los indicadores cuadran sin perder filas ni montos.`],

[`<h2>Objetivos SMART y su estado</h2><table style="font-size:.6em"><tr><th>#</th><th>Objetivo (específico, medible, con fecha)</th><th>Estado</th></tr><tr><td>O1</td><td>ER de las fuentes en 3FN con llaves, restricciones e índices, <b>entregado el 25 oct.</b></td><td><b>Cumplido</b> (paquete 2.1 al 100 %)</td></tr><tr><td>O2</td><td>Modelo estrella de 2 hechos y 3 dimensiones conformadas, sin datos personales, <b>presentado el 30 oct.</b></td><td>Diseño completo y documentado (<code>DISENO_ESTRELLA.md</code>)</td></tr><tr><td>O3</td><td>ETL con datos reales de la app y reconciliación con diferencia 0 <b>antes del 5 nov.</b></td><td><b>Cumplido</b>: puente app → almacén y reconciliación en 0</td></tr><tr><td>O4</td><td>Al menos 8 preguntas de análisis con consultas <b>antes del 10 nov.</b></td><td><b>Cumplido</b>: 8 consultas con sus vistas</td></tr><tr><td>O5</td><td>Documentos de gestión completos y validados con el grupo <b>al 2 nov.</b></td><td>Redactados; <b>la validación del grupo sigue pendiente</b></td></tr><tr><td>O6</td><td>Exponer el <b>20–21 nov.</b> y entregar BD II <b>antes del 28 nov., 8:00</b></td><td>En curso</td></tr></table><p class="mut" style="font-size:.66em">Cada objetivo tiene medida y fecha (criterios SMART). Trazabilidad: ER → O1 · estrella → O2 · ETL y reconciliación → O3 · consultas → O4 · documentos → O5 · exposición e informe de cierre → O6.</p>`,
`Los objetivos son SMART: cada uno es específico, medible y tiene fecha. El primero, el ER de las fuentes, está cumplido. El segundo es el diseño del modelo estrella; está completo y documentado. El tercero, el ETL con datos reales de la aplicación con reconciliación en cero, está cumplido a través de un puente que carga la base de la app en el almacén. El cuarto, ocho consultas, también. El quinto, los documentos de gestión, están redactados, pero falta que el grupo los valide, y lo decimos con claridad. El sexto es la exposición y la entrega, que están en curso. Cada entregable se rastrea a un objetivo.`],

[`<h2>Criterios de éxito</h2><table style="font-size:.6em"><tr><th>#</th><th>Criterio</th><th>Resultado</th></tr><tr><td>1</td><td>La reconciliación fuente–DW da <b>diferencia 0</b> en filas y montos después de cada carga</td><td><b>Cumple</b>: 0 en estudios, campañas y resumen (verificado en noviembre)</td></tr><tr><td>2</td><td>Las pruebas e2e de la aplicación pasan al <b>100 %</b></td><td><b>Cumple</b>: eran 49 al 24 oct.; hoy son <b>103</b></td></tr><tr><td>3</td><td>El almacén contiene <b>0 columnas</b> con nombre, DPI o teléfono</td><td><b>Cumple</b>: 0 columnas</td></tr><tr><td>4</td><td>Toda entrega incluye carátula, <b>formato IEEE</b> y el apéndice de <b>declaración de uso de IA</b></td><td><b>Cumple</b>: Word IEEE y apéndice listos; nivel de modificación declarado (≈ 70 % revisado a mano)</td></tr><tr><td>5</td><td>El plazo de BD II se cumple con al menos <b>2 días de holgura</b></td><td>2 días de holgura y ≈ 74 % de probabilidad (24 oct.)</td></tr><tr><td>6</td><td>Al menos <b>80 %</b> de las personas registran un paciente sin ayuda</td><td><b>Pendiente de medir</b> (guía de la prueba lista)</td></tr></table>`,
`Estos son los criterios de éxito del acta y su resultado. Cuatro se cumplen y se verifican con evidencia técnica: la reconciliación en cero, las pruebas automáticas al cien por ciento, que ahora son ciento tres, y cero columnas con datos personales. Los otros dos están en proceso: el plazo, con dos días de holgura; y la usabilidad, que todavía no medimos con personas. Preferimos decir qué está pendiente a darlo por cumplido.`],

[`<h2>Alcance: qué incluye y qué no</h2><div class="cols"><div class="box"><b>Incluye</b><ul style="font-size:.76em"><li>Aplicación web: autenticación con <b>MFA obligatorio</b>, roles, gestión de usuarios</li><li>Módulos de pacientes, estudios y campañas; <b>carga masiva por CSV</b>; auditoría (incluye exportaciones)</li><li>Esquema fuente <code>sisg_fuente</code></li><li>Almacén <code>sisg_dw</code> con ETL y consultas</li><li>Documentos de gestión, exposición e informe de cierre</li></ul></div><div class="box r"><b>Excluye</b><ul style="font-size:.76em"><li>Integración real con los otros grupos y con el Gestor de plataforma (Grupo 8)</li><li>Puesta en producción y HTTPS real</li><li>Recuperación de contraseña por correo</li><li>Carga incremental del ETL (se usa recarga completa)</li><li>Carga de archivos <code>.xlsx</code> (se acepta CSV)</li><li>Tableros de BI externos (Power BI, Tableau)</li><li>Aplicaciones móviles nativas</li></ul></div></div><p class="mut" style="font-size:.68em">Distinguimos <b>alcance del producto</b> (el qué: app, esquema, almacén, ETL, consultas) y <b>alcance del proyecto</b> (el cómo y cuánto trabajo: documentación, desarrollo y pruebas, exposición).</p>`,
`El alcance distingue dos cosas: el del producto, que es el qué, y el del proyecto, que es el cómo y cuánto trabajo. El producto incluye la aplicación con autenticación de dos pasos obligatoria, roles, pacientes, estudios y campañas, carga masiva por CSV y auditoría, más el esquema fuente, el almacén, el ETL y las consultas. Las exclusiones son igual de importantes para evitar crecimiento descontrolado: no integramos realmente con los otros grupos, no ponemos el sistema en producción con HTTPS, no hay recuperación de contraseña, el ETL no es incremental, aceptamos CSV y no Excel, y no hay tableros externos ni aplicaciones móviles nativas.`],

[`<h2>Entregables y criterios de aceptación</h2><table style="font-size:.6em"><tr><th>Entregable</th><th>Criterio de aceptación</th><th>Objetivo</th></tr><tr><td>ER de las fuentes</td><td>Todas las relaciones con llave foránea; sin texto libre donde corresponde un catálogo</td><td>O1</td></tr><tr><td>Modelo estrella</td><td>Grano declarado por hecho; dimensiones conformadas compartidas; sin datos personales</td><td>O2</td></tr><tr><td>ETL</td><td><code>CALL sp_etl_completo()</code> termina con resultado <code>OK</code>; reconciliación en 0</td><td>O3</td></tr><tr><td>Consultas</td><td>Cada consulta responde una pregunta de negocio y se ejecuta sin errores</td><td>O4</td></tr><tr><td>Aplicación</td><td>Pruebas e2e en verde; se cumplen aislamiento entre entidades y restricción por tipo de entidad</td><td>—</td></tr><tr><td>Documentos de gestión</td><td>Completos según el sílabo; formato IEEE; declaración de uso de IA</td><td>O5</td></tr><tr><td>Exposición e informe de cierre</td><td>Exposición en la semana 19; informe con lecciones aprendidas</td><td>O6</td></tr></table>`,
`Cada entregable tiene un criterio de aceptación verificable, para que no dependa de opiniones. El ER debe tener todas las relaciones con llave foránea y catálogos en lugar de texto libre. El modelo estrella debe declarar el grano de cada hecho y no contener datos personales. El ETL se acepta cuando el procedimiento principal termina con resultado OK y la reconciliación da cero. Las consultas deben responder preguntas de negocio sin errores. La aplicación, con pruebas en verde y las reglas de aislamiento cumplidas. Y los documentos, completos, en formato IEEE y con la declaración de IA.`],

[`<h2>Supuestos, restricciones y roles</h2><div class="cols"><div><div class="box"><b>Supuestos</b><ul style="font-size:.74em"><li>El grupo dispone de Docker y de un equipo para ejecutar las bases</li><li>Los datos de prueba son <b>sintéticos</b></li><li>Los otros grupos entregarán datos que el ETL pueda leer (Excel o MySQL)</li><li>Horas y % de avance del borrador se <b>validarán con el grupo</b></li></ul></div><div class="box r" style="margin-top:.4em"><b>Restricciones</b><ul style="font-size:.74em"><li>Plazo fijo: <b>28 de noviembre</b></li><li>Equipo de <b>3 personas</b></li><li>BD II enseña SQL Server; el grupo decidió <b>MySQL</b> (definitivo, 24 oct.)</li></ul></div></div><div><b>Director de proyecto y autoridad</b><ul style="font-size:.72em"><li>Aprobar cambios de alcance dentro del equipo y registrarlos</li><li>Reasignar paquetes de trabajo</li><li>Usar las reservas de contingencia y de gestión</li><li>Convocar la reunión semanal</li><li>Escalar a los docentes lo que excede al equipo (motor de BD, alcance de una entrega)</li></ul><table style="font-size:.6em"><tr><th>Rol</th><th>Responsabilidad</th></tr><tr><td>Líder</td><td>Planificación, seguimiento y comunicación con docentes</td></tr><tr><td>Resp. de datos</td><td>ER, estrella, ETL, consultas</td></tr><tr><td>Resp. de aplicación y calidad</td><td>App web, pruebas, documentación</td></tr></table><p class="mut" style="font-size:.62em">Asignación de personas a cada rol: <b>pendiente de confirmar por el grupo</b>.</p></div></div>`,
`Los supuestos son las condiciones que damos por ciertas: que tenemos Docker y un equipo, que los datos son sintéticos, que los otros grupos entregarán datos legibles, y que las horas y porcentajes del borrador las valida el grupo. Las restricciones son las que no controlamos: el plazo fijo del veintiocho de noviembre, el equipo de tres personas y que el curso de bases de datos enseña SQL Server mientras nosotros decidimos MySQL. El director del proyecto tiene autoridad para aprobar cambios de alcance dentro del equipo, reasignar paquetes y usar las reservas, y escala a los docentes lo que lo excede. Los tres roles están definidos; la asignación de cada persona a su rol está pendiente de confirmar por el grupo.`],

[`<h2>Hitos y cronograma preliminar</h2><table style="font-size:.66em"><tr><th>Fecha (2026)</th><th>Hito</th></tr><tr><td>25 oct.</td><td>ER de las fuentes (Bases de Datos II): <b>entregado</b></td></tr><tr><td>30 oct.</td><td>Presentación del diseño estrella (Bases de Datos II)</td></tr><tr><td>2 nov.</td><td>Documentos de gestión validados</td></tr><tr><td>5 nov.</td><td>ETL con datos reales de la aplicación</td></tr><tr><td>10 nov.</td><td>Consultas y análisis <code>EXPLAIN</code> finales</td></tr><tr><td>20–21 nov.</td><td>Exposición final (Administración de Proyectos, semana 19)</td></tr><tr><td>22–28 nov.</td><td>Examen final de Administración de Proyectos</td></tr><tr><td><b>28 nov., 8:00</b></td><td><b>Entrega del proyecto final de Bases de Datos II</b></td></tr></table><div class="box o" style="font-size:.72em;margin-top:.4em"><b>Dato clave:</b> el examen final de Administración de Proyectos coincide con la última semana de la entrega de Bases de Datos II. Por eso el riesgo R2 es el único <b>crítico</b>.</div>`,
`Estos son los hitos. El ER se entregó el veinticinco de octubre. Siguen la presentación del diseño estrella, la validación de los documentos de gestión, el ETL con datos reales y las consultas finales, que fueron cayendo en noviembre. La exposición es el veinte y veintiuno de noviembre, y el examen final de este curso es del veintidós al veintiocho, la misma semana de la entrega del proyecto de Bases de Datos II, el veintiocho a las ocho de la mañana. Esa coincidencia es la razón por la que el riesgo de cronograma es el único crítico.`],

[`<h2>Enfoque híbrido: qué es predictivo y qué es ágil</h2><div class="cols"><div class="box b"><b>Predictivo</b> (plan acordado, cambios por el líder)<ul style="font-size:.78em"><li>Entregables de Bases de Datos II: ER, estrella, ETL, consultas</li><li>Contenido y fecha <b>fijos</b></li><li>Hitos fin-a-inicio en la ruta crítica</li><li>Fase 0: requisitos, alcance y cronograma de hitos aprobados</li></ul></div><div class="box o"><b>Ágil</b> (evoluciona con un backlog)<ul style="font-size:.78em"><li>La aplicación web, por <b>sprints</b> con su Sprint Goal, incremento y Definition of Done</li><li>Backlog priorizado de <b>historias de usuario</b></li><li>Revisión del incremento y retrospectiva breve al cierre de cada sprint</li></ul></div></div><p style="font-size:.8em"><b>Regla de unión:</b> el modelo de datos verificado va antes que las consultas, y cada sprint construye sobre lo que el anterior dejó verificado. Entre sprints hay un hito: si uno se atrasa, se mueve el inicio del siguiente (no se solapan sin verificación).</p><p class="mut" style="font-size:.66em">Marco: Scrum Guide 2020 y la sesión del 24 de octubre.</p>`,
`Usamos un enfoque híbrido porque el proyecto tiene dos naturalezas. Lo de Bases de Datos II es predictivo: ER, estrella, ETL y consultas tienen contenido y fecha fijos y cualquier cambio pasa por el líder. La aplicación es ágil: evoluciona con un backlog de historias de usuario y se construye por sprints, cada uno con objetivo, incremento y criterio de terminado, con revisión y retrospectiva. Las dos partes se unen con una regla: el modelo de datos verificado va antes que las consultas, y cada sprint se apoya en lo verificado en el anterior. Entre sprints hay un hito de control.`],

[`<h2>Backlog: historias de usuario y estado</h2><table style="font-size:.54em"><tr><th>Id</th><th>Historia</th><th>Criterio de aceptación</th><th>Prio.</th><th>Estado</th></tr><tr><td>H1</td><td>Como <b>centro de diagnóstico</b>, registrar un estudio de un paciente para llevar su historial</td><td>El estudio queda ligado al paciente de mi entidad; otra entidad no lo ve</td><td>Alta</td><td>Implementada</td></tr><tr><td>H2</td><td>Como <b>organismo no lucrativo</b>, registrar una campaña con lugar y personas atendidas</td><td>La campaña aparece en mi lista y en el panel</td><td>Alta</td><td>Implementada</td></tr><tr><td>H3</td><td>Como <b>centro</b>, cargar estudios desde Excel para no digitarlos</td><td>El archivo se valida y los errores se reportan por fila</td><td>Media</td><td>Implementada con <b>CSV</b></td></tr><tr><td>H4</td><td>Como <b>analista</b>, consultar totales por mes, tipo y departamento</td><td>Los resultados coinciden con la fuente (diferencia 0)</td><td>Alta</td><td>Resuelta con el almacén</td></tr><tr><td>H5</td><td>Como <b>administrador</b>, ver quién modificó un estudio</td><td>La bitácora muestra usuario, fecha y cambio</td><td>Media</td><td>Implementada (sin guardar los valores)</td></tr><tr><td>H6</td><td>Como <b>usuario móvil</b>, usar el sistema desde el teléfono</td><td>Menú y tablas se adaptan al ancho de pantalla</td><td>Baja</td><td>Implementada (menú y encabezado)</td></tr></table><p class="mut" style="font-size:.64em">H3 acepta CSV, no <code>.xlsx</code> (Excel permite «Guardar como CSV»). H5 no guarda los valores modificados porque son datos de salud.</p>`,
`El backlog son las historias de usuario priorizadas. Las tres de prioridad alta, registrar estudios, registrar campañas y consultar totales, están resueltas. La carga masiva acepta CSV y no Excel directamente, una limitación declarada. La bitácora de auditoría muestra quién modificó un estudio y cuándo, pero deliberadamente no guarda los valores modificados porque son datos de salud. Y la historia móvil cubre el menú y el encabezado en celular, la de menor prioridad. Cada historia tiene su criterio de aceptación.`],

[`<h2>EDT: estructura de desglose del trabajo</h2><div style="text-align:center"><span class="box" style="display:inline-block;font-weight:700;padding:.3em 1.2em">0 · SISG – Módulo Grupo 4</span></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;margin-top:.5em;font-size:.58em"><div class="box"><b>1 Gestión del proyecto</b><br>1.1 Acta y alcance<br>1.2 EDT, cronograma y costos<br>1.3 Interesados y comunicaciones<br>1.4 Riesgos y calidad<br>1.5 Reportes de estado</div><div class="box b"><b>2 Datos (BD II)</b><br>2.1 ER de las fuentes<br>2.2 Modelo estrella<br>2.3 ETL<br>2.4 Consultas<br>2.5 Documento técnico</div><div class="box o"><b>3 Aplicación web</b><br>3.1 Backend y autenticación<br>3.2 Interfaz y rediseño<br>3.3 Carga masiva y bitácora<br>3.4 Seguridad y usuarios</div><div class="box p"><b>4 Calidad y pruebas</b><br>4.1 Pruebas e2e<br>4.2 Reconciliación fuente–DW<br>4.3 Revisión por pares</div><div class="box r"><b>5 Cierre</b><br>5.1 Informe de cierre<br>5.2 Exposición final<br>5.3 Entrega final BD II</div></div><p style="font-size:.74em;margin-top:.5em"><b>Regla del 100 %:</b> los paquetes del nivel 2 suman <b>todo</b> el alcance de su rama: no falta ni sobra trabajo. Total: 5 ramas y <b>20 paquetes de trabajo</b>.</p>`,
`La estructura de desglose del trabajo parte del proyecto y se divide en cinco ramas: gestión, datos, aplicación web, calidad y pruebas, y cierre, con veinte paquetes de trabajo en total. Aplicamos la regla del cien por ciento: los paquetes de cada rama suman todo el alcance de esa rama, sin faltar ni sobrar trabajo. La rama de datos corresponde a Bases de Datos II y la de aplicación es la que evoluciona de forma ágil.`],

[`<h2>Diccionario de paquetes de trabajo (1/2): gestión y datos</h2><table style="font-size:.6em"><tr><th>Código</th><th>Paquete</th><th>Horas</th><th>Fechas</th><th>Avance 24 oct.</th><th>Resp.</th></tr><tr><td>1.1</td><td>Acta de constitución y alcance</td><td>6</td><td>24–26 oct</td><td>50 %</td><td>Líder</td></tr><tr><td>1.2</td><td>EDT, cronograma y costos</td><td>6</td><td>24–27 oct</td><td>50 %</td><td>Líder</td></tr><tr><td>1.3</td><td>Interesados y comunicaciones</td><td>5</td><td>24–28 oct</td><td>50 %</td><td>Líder</td></tr><tr><td>1.4</td><td>Riesgos y calidad</td><td>6</td><td>24–30 oct</td><td>50 %</td><td>Calidad</td></tr><tr><td>1.5</td><td>Reportes de estado semanales</td><td>3</td><td>1–20 nov</td><td>0 %</td><td>Líder</td></tr><tr><td>2.1</td><td>ER de las fuentes</td><td>8</td><td>15–25 oct</td><td>100 %</td><td>Datos</td></tr><tr><td>2.2</td><td>Modelo estrella</td><td>8</td><td>24–30 oct</td><td>80 %</td><td>Datos</td></tr><tr><td>2.3</td><td>ETL</td><td>10</td><td>24 oct–10 nov</td><td>70 %</td><td>Datos</td></tr><tr><td>2.4</td><td>Consultas analíticas</td><td>6</td><td>24 oct–14 nov</td><td>60 %</td><td>Datos</td></tr><tr><td>2.5</td><td>Documento técnico BD II</td><td>8</td><td>9–27 nov</td><td>20 %</td><td>Datos</td></tr></table><p class="mut" style="font-size:.64em">Responsables propuestos por <b>rol</b> (Líder, Datos, Calidad, Todos); falta asignar personas. Horas y avance son estimaciones iniciales a validar.</p>`,
`Este es el diccionario de paquetes de trabajo, primera mitad. Cada paquete tiene código, horas estimadas, fechas, porcentaje de avance al veinticuatro de octubre y un responsable propuesto por rol. Los de gestión estaban al cincuenta por ciento, el ER de las fuentes al cien, el modelo estrella al ochenta, el ETL al setenta y las consultas al sesenta. Aclaramos que las horas y los avances son estimaciones iniciales y que los responsables son roles; falta asignar a cada persona.`],

[`<h2>Diccionario de paquetes de trabajo (2/2): aplicación, calidad y cierre</h2><table style="font-size:.6em"><tr><th>Código</th><th>Paquete</th><th>Horas</th><th>Fechas</th><th>Avance 24 oct.</th><th>Resp.</th></tr><tr><td>3.1</td><td>Backend y autenticación</td><td>25</td><td>5–23 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>3.2</td><td>Interfaz y rediseño</td><td>12</td><td>24 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>3.3</td><td>Carga masiva y bitácora</td><td>12</td><td>24 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>3.4</td><td>Seguridad y usuarios</td><td>12</td><td>24 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>4.1</td><td>Pruebas e2e</td><td>8</td><td>5–24 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>4.2</td><td>Reconciliación fuente–DW</td><td>3</td><td>24 oct</td><td>100 %</td><td>Calidad</td></tr><tr><td>4.3</td><td>Revisión por pares y verificación</td><td>6</td><td>9–20 nov</td><td>0 %</td><td>Calidad</td></tr><tr><td>5.1</td><td>Informe de cierre y lecciones</td><td>8</td><td>12–19 nov</td><td>0 %</td><td>Todos</td></tr><tr><td>5.2</td><td>Preparar y dar la exposición final</td><td>10</td><td>16–21 nov</td><td>0 %</td><td>Todos</td></tr><tr><td>5.3</td><td>Ajustes y entrega final BD II</td><td>6</td><td>23–28 nov</td><td>0 %</td><td>Datos</td></tr></table><p style="font-size:.7em"><b>Suma de las 20 filas = 168 horas</b> (BAC). El paquete 3.4 (12 h) se agregó el 24 de octubre como <b>cambio de alcance</b> (MFA, roles y auditoría) y se registró (riesgo R6).</p>`,
`La segunda mitad: la aplicación y la calidad ya estaban al cien por ciento al veinticuatro de octubre, y el cierre al cero. Las veinte filas suman ciento sesenta y ocho horas, el presupuesto. Un detalle de control de cambios: el paquete de seguridad y usuarios, doce horas, se agregó el veinticuatro de octubre cuando incorporamos MFA, roles y auditoría; se registró como cambio de alcance, que es justamente el riesgo seis.`],

[`<h2>Secuenciación: diagrama de precedencia (PDM)</h2><div style="font-size:.6em"><b>Cadena de Bases de Datos II (menor holgura)</b><div class="flow" style="margin:.3em 0"><div class="box b">B · Diseño estrella<br>5 d</div><div class="ar">→</div><div class="box b">C · ETL con datos reales<br>6 d</div><div class="ar">→</div><div class="box b">D · Consultas y EXPLAIN<br>5 d</div><div class="ar">→</div><div class="box b">E · Documento técnico<br>8 d</div><div class="ar">→</div><div class="box b">K · Revisión por pares<br>5 d <small>(−2 solape)</small></div><div class="ar">→</div><div class="box b">L · Ajustes y entrega<br>4 d</div></div><b>Cadena de Administración de Proyectos</b><div class="flow" style="margin:.3em 0"><div class="box">A · Validar acta, alcance y EDT<br>2 d</div><div class="ar">→</div><div class="box">F · Riesgos y calidad<br>6 d<br>G · Comunicaciones<br>4 d</div><div class="ar">→</div><div class="box">H · Informe de cierre<br>5 d</div><div class="ar">→</div><div class="box">I · Preparar exposición<br>4 d</div><div class="ar">→</div><div class="box r">J · Exposición final<br>2 d · <b>fecha fija</b></div></div></div><p style="font-size:.68em">Dependencias <b>fin-a-inicio</b>, salvo K, que empieza 2 días antes de terminar E (solape). Se agregan dos restricciones reales: la exposición solo puede darse el 20–21 nov. y la entrega vence el 28 nov. a las 8:00. Actividades <b>restantes</b> desde el lunes 26 de octubre.</p>`,
`Esta es la secuenciación por el método de diagramación por precedencia. Hay dos cadenas. La de Bases de Datos II va del diseño estrella al ETL con datos reales, las consultas, el documento técnico, la revisión por pares y los ajustes finales. La de Administración de Proyectos va de validar el acta a riesgos y comunicaciones, el informe de cierre, la preparación y la exposición. Las dependencias son fin a inicio, salvo la revisión por pares, que empieza dos días antes de terminar el documento. Y agregamos dos restricciones reales: la exposición solo puede darse el veinte o veintiuno de noviembre y la entrega vence el veintiocho a las ocho.`],

[`<h2>Actividades, predecesoras y holgura</h2><table style="font-size:.52em"><tr><th>ID</th><th>Actividad</th><th>Dur.</th><th>Pred.</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Holgura</th><th>Fechas</th></tr><tr><td>A</td><td>Validar acta, alcance y EDT</td><td>2</td><td>—</td><td>0</td><td>2</td><td>8</td><td>10</td><td>8</td><td>26–27 oct</td></tr><tr><td>B</td><td>Presentar el diseño estrella</td><td>5</td><td>—</td><td>0</td><td>5</td><td>2</td><td>7</td><td>2</td><td>26–30 oct</td></tr><tr><td>C</td><td>ETL con datos reales de la app</td><td>6</td><td>B</td><td>5</td><td>11</td><td>7</td><td>13</td><td>2</td><td>31 oct–5 nov</td></tr><tr><td>D</td><td>Consultas finales y EXPLAIN</td><td>5</td><td>C</td><td>11</td><td>16</td><td>13</td><td>18</td><td>2</td><td>6–10 nov</td></tr><tr><td>E</td><td>Documento técnico BD II</td><td>8</td><td>D</td><td>16</td><td>24</td><td>18</td><td>26</td><td>2</td><td>11–18 nov</td></tr><tr><td>F</td><td>Riesgos y calidad finalizados</td><td>6</td><td>A</td><td>2</td><td>8</td><td>10</td><td>16</td><td>8</td><td>28 oct–2 nov</td></tr><tr><td>G</td><td>Comunicaciones y reportes</td><td>4</td><td>A</td><td>2</td><td>6</td><td>12</td><td>16</td><td>10</td><td>28–31 oct</td></tr><tr><td>H</td><td>Informe de cierre y lecciones</td><td>5</td><td>F,G</td><td>8</td><td>13</td><td>16</td><td>21</td><td>8</td><td>3–7 nov</td></tr><tr><td>I</td><td>Preparar la exposición</td><td>4</td><td>H</td><td>13</td><td>17</td><td>21</td><td>25</td><td>8</td><td>8–11 nov</td></tr><tr><td>J</td><td>Exposición final</td><td>2</td><td>I</td><td>25</td><td>27</td><td>25</td><td>27</td><td><b>0</b></td><td>20–21 nov</td></tr><tr><td>K</td><td>Revisión por pares</td><td>5</td><td>E(−2)</td><td>22</td><td>27</td><td>24</td><td>29</td><td>2</td><td>17–21 nov</td></tr><tr><td>L</td><td>Ajustes y entrega final BD II</td><td>4</td><td>K</td><td>27</td><td>31</td><td>29</td><td>33</td><td>2</td><td>22–25 nov</td></tr></table><p class="mut" style="font-size:.6em">ES/EF = inicio/fin temprano · LS/LF = inicio/fin tardío, en días desde el 26 oct. Holgura = LS − ES.</p>`,
`Esta tabla muestra el cálculo de ida y vuelta: inicio y fin tempranos, inicio y fin tardíos, y la holgura de cada actividad, que es el inicio tardío menos el temprano. Las actividades de gestión tienen holguras grandes, de ocho a diez días. La cadena de Bases de Datos II tiene dos días de holgura en cada actividad. Y la exposición final tiene holgura cero porque su fecha la fija el calendario del curso.`],

[`<h2>Ruta crítica (CPM)</h2><div class="cols"><div class="box r"><b>Exposición final (J): holgura 0</b><p style="font-size:.84em">Su fecha está fija por el calendario del curso (20–21 nov.), por eso es crítica.</p></div><div class="box o"><b>Cadena de BD II: B → C → D → E → K → L</b><p style="font-size:.84em">Termina el <b>25 nov.</b> (fin de día). El límite es el <b>28 nov., 8:00</b>: <b>2 días de holgura</b>.</p></div></div><ul style="font-size:.84em"><li>Es la ruta con <b>menor holgura</b> de la entrega de Bases de Datos II.</li><li>Un atraso de <b>más de 2 días</b> en cualquiera de sus actividades incumple la entrega.</li><li>Las actividades de Administración de Proyectos (A, F, G, H, I) tienen <b>8 a 10 días</b> de holgura.</li></ul><div class="box" style="font-size:.78em"><b>Cómo se protege (respuesta al riesgo R2):</b> adelantar el ETL con datos reales (no esperar la presentación del 30 oct.), mantener el solape de K con E, y entregar el alcance mínimo si a 7 días del plazo se pierde toda la holgura.</div>`,
`La ruta crítica tiene dos partes. La exposición final, con holgura cero porque su fecha es fija. Y la cadena de Bases de Datos II, que termina el veinticinco de noviembre con dos días de holgura frente al límite del veintiocho a las ocho de la mañana: un atraso de más de dos días en cualquiera de sus actividades la incumple. Las actividades de gestión tienen mucha más holgura. Para protegerla, adelantamos el ETL con datos reales, mantenemos el solape de la revisión y, si a siete días del plazo se pierde toda la holgura, entregamos el alcance mínimo.`],

[`<h2>Estimación de tres valores (PERT)</h2><table style="font-size:.6em"><tr><th>ID</th><th>Actividad</th><th>O</th><th>M</th><th>P</th><th>Esperado</th><th>σ</th></tr><tr><td>B</td><td>Presentar el diseño estrella</td><td>3</td><td>5</td><td>6</td><td>4.8</td><td>0.5</td></tr><tr><td>C</td><td>ETL con datos reales</td><td>4</td><td>6</td><td>10</td><td>6.3</td><td>1.0</td></tr><tr><td>D</td><td>Consultas y EXPLAIN</td><td>3</td><td>5</td><td>8</td><td>5.2</td><td>0.83</td></tr><tr><td>E</td><td>Documento técnico</td><td>6</td><td>8</td><td>12</td><td>8.3</td><td>1.0</td></tr><tr><td>K</td><td>Revisión por pares</td><td>3</td><td>5</td><td>7</td><td>5.0</td><td>0.67</td></tr><tr><td>L</td><td>Ajustes y entrega</td><td>3</td><td>4</td><td>6</td><td>4.2</td><td>0.5</td></tr></table><div class="cols" style="font-size:.7em;margin-top:.4em"><div class="box"><b>Fórmulas:</b> esperado = (O + 4M + P) / 6 · σ = (P − O) / 6<br>Cadena = suma de esperados − 2 de solape = <b>31.8 días</b> · σ de la cadena = <b>1.91</b></div><div class="box o"><b>Probabilidad:</b> días disponibles = 33<br>z = (33 − 31.8) / 1.91 = <b>0.63</b> → <b>≈ 74 %</b> de cumplir.<br>Los O/M/P son estimaciones del borrador: el grupo debe validarlos.</div></div>`,
`Con el método PERT estimamos cada actividad con tres valores: optimista, más probable y pesimista. El esperado es el optimista más cuatro veces el probable más el pesimista, dividido entre seis, y la desviación es el pesimista menos el optimista, dividido entre seis. Sumando la cadena y restando los dos días de solape da treinta y uno punto ocho días, con una desviación de uno punto noventa y uno. Como hay treinta y tres días disponibles, z es cero punto sesenta y tres, que equivale a una probabilidad de cumplir de aproximadamente setenta y cuatro por ciento. Los valores son estimaciones que el grupo debe validar, y la forma de subir la probabilidad es adelantar el ETL.`],

`Este es el diagrama de Gantt de las actividades restantes, calculado con los mismos números de la tabla. En rojo está la cadena de menor holgura de Bases de Datos II y la exposición, que tiene fecha fija; en verde, las actividades de gestión, que tienen entre ocho y diez días de holgura. La línea del límite es el veintiocho de noviembre a las ocho de la mañana. Se ve cómo la cadena roja termina muy cerca del límite, y por eso es la que vigilamos.`],

[`<h2>Costos y reservas</h2><div class="cols"><div class="box"><b>Unidad: horas-persona</b><p style="font-size:.84em">No hay gasto monetario directo (<b>Q 0</b>): se usan Docker y software libre en equipos propios. El mismo método sirve con quetzales.</p><table style="font-size:.7em"><tr><th>Concepto</th><th>Horas</th></tr><tr><td><b>BAC</b> (presupuesto total)</td><td>168</td></tr><tr><td>Reserva de contingencia (13 %)</td><td>21.8</td></tr><tr><td>Reserva de gestión (5 %)</td><td>8.4</td></tr><tr><td><b>Presupuesto con reservas</b></td><td><b>198.2</b></td></tr></table></div><div class="box o" style="font-size:.78em"><b>¿Por qué 13 % y no 10 %?</b><p>Las respuestas a los riesgos identificados suman <b>19 h</b>. El 10 % sugerido en clase son 16.8 h y <b>no alcanza</b>; con 13 % (21.8 h) se cubren las 19 h con <b>2.8 h de margen</b>.</p><b>Dos reservas distintas</b><ul><li><b>Contingencia:</b> para riesgos <i>identificados</i></li><li><b>Gestión:</b> para imprevistos <i>no identificados</i>, bajo control del líder</li></ul>Se reajusta la contingencia cuando cambia la priorización de riesgos. Al cerrarse R1 se liberó su reserva de 4 h.</div></div>`,
`Como no hay presupuesto monetario, medimos el costo en horas-persona. El presupuesto total es de ciento sesenta y ocho horas. Tenemos dos reservas distintas. La de contingencia cubre los riesgos que identificamos; las respuestas a esos riesgos suman diecinueve horas, y el diez por ciento sugerido en clase, dieciséis punto ocho, no alcanzaba, así que la fijamos en trece por ciento, veintiuno punto ocho horas. La de gestión, de cinco por ciento, cubre imprevistos no identificados y la controla el líder. Con ambas, el presupuesto es de ciento noventa y ocho punto dos horas.`],

[`<h2>Valor ganado al 24 de octubre</h2><table style="font-size:.64em"><tr><th>Indicador</th><th>Valor</th><th>Cómo se obtuvo</th></tr><tr><td>BAC</td><td>168 h</td><td>Suma de las horas planificadas</td></tr><tr><td>PV (valor planificado)</td><td>86.6 h</td><td>Horas de cada paquete × fracción del plazo transcurrido</td></tr><tr><td>EV (valor ganado)</td><td>110.1 h</td><td>Horas de cada paquete × % de avance</td></tr><tr><td><b>SPI</b> = EV / PV</td><td><b>1.27</b></td><td>Mayor que 1: adelantados respecto del plan</td></tr><tr><td>Avance = EV / BAC</td><td><b>66 %</b></td><td></td></tr><tr><td>AC (costo real)</td><td><i>pendiente</i></td><td><b>El grupo debe registrar las horas realmente trabajadas</b></td></tr><tr><td>CPI = EV / AC</td><td>1.00 <i>(supuesto)</i></td><td>Se asume AC = EV; no es una medición</td></tr><tr><td>EAC = BAC / CPI</td><td>168 h <i>(supuesto)</i></td><td>Con CPI = 1.00 termina en el presupuesto</td></tr></table><div class="box r" style="font-size:.7em;margin-top:.4em"><b>Honestidad del dato:</b> el SPI &gt; 1 depende de los % de avance y de las horas, que son estimaciones. <b>No se reporta como resultado final</b> hasta validarlas con el grupo. Sin las horas reales no se puede calcular el CPI ni proyectar el costo final.</div>`,
`Estos son los indicadores de valor ganado con corte al veinticuatro de octubre. El valor planificado es ochenta y seis punto seis horas, el ganado ciento diez punto uno, y el índice de desempeño del cronograma es uno punto veintisiete: vamos adelantados. El avance es del sesenta y seis por ciento. Pero somos claros en lo que falta: el costo real, es decir las horas realmente trabajadas, no está registrado, así que no podemos calcular el índice de desempeño de costo ni la estimación al finalizar. Y el SPI depende de porcentajes de avance estimados, por lo que no lo reportamos como resultado final hasta validarlos con el grupo.`],

`El enfoque híbrido se organiza en una fase cero y cinco sprints, cada uno con su objetivo, los paquetes que cubre y un criterio de terminado verificable. El estado que se ve es el del veinticuatro de octubre: la fase cero con el ER entregado y los documentos por validar, el sprint uno hecho, los sprints dos y tres en curso, y los dos últimos por iniciar. Desde entonces los criterios de terminado de los sprints tres y cuatro se cumplieron en lo técnico: reconciliación en cero con datos de la aplicación, ocho consultas y ciento tres pruebas en verde.`],
