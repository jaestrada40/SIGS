[`<h2>Matriz poder / interés y estrategia</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:.4em;font-size:.62em"><div class="box r"><b>Mantener satisfecho</b> <span class="mut">(alto poder · bajo interés)</span><br>— ninguno</div><div class="box o"><b>Gestionar atentamente</b> <span class="mut">(alto poder · alto interés)</span><br>01 Docentes · 02 Equipo · 03 Gestor de plataforma (G8) · 04 Ministerio e INE · 05 Hospitales<br><i>Reportes de estado y entregas por Classroom; reunión semanal de 15 min; acordar formatos y seguridad; mostrar estrella y reconciliación; entregar esquema y plantillas.</i></div><div class="box p"><b>Monitorear</b> <span class="mut">(bajo poder · bajo interés)</span><br>09 Aseguradoras · 10 Org. internacionales · 11 Universidades · 12 Pacientes<br><i>Solo consultas agregadas o anonimizadas; a los pacientes no se les contacta: se protegen (sin datos personales en el DW).</i></div><div class="box b"><b>Mantener informado</b> <span class="mut">(bajo poder · alto interés)</span><br>06 Seguro social · 07 Centros · 08 Organismos<br><i>Avances y diseño final; plantilla CSV, mensajes de error por fila y capacitación breve; mostrar el panel.</i></div></div><p style="font-size:.66em;margin-top:.4em"><b>Eje vertical:</b> poder (arriba = alto). <b>Eje horizontal:</b> interés (derecha = alto). Regla: alto = 4 o 5.</p>`,
`La matriz agrupa a los interesados en cuatro cuadrantes. Los de alto poder y alto interés, docentes, equipo, gestor de plataforma, Ministerio y hospitales, se gestionan atentamente con reportes de estado, reuniones y acuerdos de formato. Los usuarios, centros y organismos, y el seguro social, tienen mucho interés pero poder medio; los mantenemos informados con plantillas y capacitación breve. Aseguradoras, organismos internacionales, universidades y pacientes se monitorean: solo reciben datos agregados o anonimizados, y a los pacientes no se les contacta, se les protege. No hay interesados de alto poder y bajo interés.`],

[`<h2>Plan de comunicaciones</h2><table style="font-size:.48em"><tr><th>A quién</th><th>Por qué</th><th>Qué</th><th>Cuándo</th><th>Cómo</th><th>Quién</th><th>Formato</th></tr><tr><td>Docentes</td><td>Entregables correctos y a tiempo</td><td>Entregables, reporte de estado, dudas de alcance</td><td>Según calendario; reporte cada 2 semanas</td><td>Classroom; correo institucional</td><td>Líder</td><td>Documento IEEE con apéndice de IA; reporte S13</td></tr><tr><td>Equipo</td><td>Carga repartida; bloqueos resueltos</td><td>Avance, horas reales, riesgos, decisiones</td><td>Semanal (15 min); bloqueos el mismo día</td><td>Reunión breve y chat</td><td>Líder</td><td>Reporte de estado y registro de horas</td></tr><tr><td>Gestor de plataforma (G8)</td><td>Seguridad y normas cumplidas</td><td>Formato de datos, control de acceso, bitácora</td><td>Quincenal</td><td>Reunión entre grupos</td><td>Resp. de datos</td><td>Contrato de datos (columnas, tipos, catálogos)</td></tr><tr><td>Grupos 1, 2 y 3</td><td>Cargar datos sin errores</td><td>Plantilla CSV y reglas de validación</td><td>Una vez y al cambiar el formato</td><td>Chat y Classroom</td><td>Resp. de datos</td><td>Plantilla CSV (descargable en la app)</td></tr><tr><td>Centros y organismos</td><td>Registrar rápido y sin errores</td><td>Uso de la app, errores de carga por fila</td><td>Al entregar y al cambiar</td><td>Aplicación y sesión breve</td><td>Resp. de aplicación</td><td>Guía de una página y plantilla CSV</td></tr><tr><td>Grupos 5, 6 y 7</td><td>Datos agregados y anónimos</td><td>Resultados de consultas analíticas</td><td>Al cierre</td><td>Documento técnico y consultas del DW</td><td>Resp. de datos</td><td>Tablas agregadas sin datos personales</td></tr><tr><td>Ministerio, INE y Estado (G2)</td><td>Indicadores confiables</td><td>Modelo estrella y reconciliación</td><td>Al cierre</td><td>Exposición final</td><td>Líder</td><td>Presentación y documento técnico</td></tr></table><div class="box r" style="font-size:.6em;margin-top:.3em"><b>Reglas:</b> ① datos de pacientes <b>no</b> por chat ni correo (solo sintéticos o anonimizados) · ② un problema bloqueante se avisa el <b>mismo día</b> · ③ todo documento a los docentes lleva el <b>apéndice de IA</b> (omitirlo: máximo 60 %).</div>`,
`El plan de comunicaciones responde a quién, por qué, qué, cuándo, cómo, quién lo hace y en qué formato. A los docentes, entregas por Classroom y reporte de estado cada dos semanas. Al equipo, reunión semanal de quince minutos y los bloqueos el mismo día. Al gestor de plataforma, un contrato de datos cada quince días. A los grupos fuente, una plantilla CSV. Y a los consumidores, solo resultados agregados al cierre. Tres reglas: los datos de pacientes nunca se envían por chat o correo, un bloqueo se avisa el mismo día, y todo documento a los docentes lleva el apéndice de declaración de IA.`],

[`<h2>Reporte de estado (plantilla S13) · corte 24 de octubre</h2><table style="font-size:.56em"><tr><th>Campo</th><th>Contenido</th></tr><tr><td>Proyecto / período</td><td>SISG – Módulo Grupo 4 · hasta el 24 de octubre de 2026</td></tr><tr><td>Para / Elabora</td><td>Docentes de APT y BD II · Equipo del Grupo 4</td></tr><tr><td>CPI</td><td><b>1.00</b> <i>(supuesto)</i>: sin horas reales se asume AC = EV</td></tr><tr><td>SPI</td><td><b>1.27</b> (EV 110.1 h / PV 86.6 h): sujeto a validar los % de avance</td></tr><tr><td>EAC</td><td><b>168 h</b> <i>(supuesto)</i>, igual al BAC por CPI = 1.00</td></tr><tr><td>Avance</td><td><b>66 %</b> (EV / BAC)</td></tr></table><div class="cols" style="font-size:.6em;margin-top:.4em"><div class="box"><b>Desempeño (hecho)</b><br>ER entregado · estrella y ETL · app con carga masiva, MFA, roles y auditoría · pruebas e2e en verde · reconciliación en 0.<br><b>Pendiente:</b> presentar el estrella (30 oct.), ETL con datos reales, documento técnico, informe de cierre y exposición.</div><div class="box r"><b>Riesgos principales</b><br>① Plazo de BD II: 2 días de holgura y ≈ 74 % (R2) · ② Fuga de datos de salud (R12): pendientes HTTPS y cookie HttpOnly · ③ Omitir la declaración de IA: tope 60 % (R8).<br><b>Decisiones:</b> MySQL definitivo (R1 cerrado); registrar horas reales; adelantar el ETL; usar el apéndice de IA en cada entrega.</div></div><p class="mut" style="font-size:.58em">Borrador generado con IA: sí · Verificado por: ____ · Fecha: ____</p>`,
`Este es el reporte de estado con la plantilla del curso, con corte al veinticuatro de octubre. Muestra los indicadores: el SPI de uno punto veintisiete y el avance de sesenta y seis por ciento, con el CPI en uno punto cero cero y la proyección en ciento sesenta y ocho horas, ambos como supuesto porque no se registraron las horas reales. Resume el desempeño, lo hecho y lo pendiente, los tres riesgos principales y las decisiones tomadas: MySQL definitivo, registrar las horas reales, adelantar el ETL y usar el apéndice de IA en cada entrega. Como pide el estándar, indica que es un borrador generado con IA y deja el espacio de quién lo verificó.`],

[`<h2>Gestión de riesgos: el proceso</h2><div class="cols"><div class="box"><b>Ciclo común a Watt, ISO 21502, PMBOK 8 y NIST SP 800-30</b><ol style="font-size:.78em"><li><b>Preparar:</b> propósito (proteger plazo, calidad y datos de salud), alcance (el módulo), horizonte (28 nov. y 6 meses para seguridad), escala cualitativa 3×3, fuentes y supuestos</li><li><b>Conducir:</b> identificar con lluvia de ideas y la RBS; evaluar con probabilidad, impacto y <b>el porqué</b> de cada valor</li><li><b>Comunicar:</b> alto o crítico se informa al docente la misma semana y en el reporte</li><li><b>Mantener:</b> revisar la matriz cada semana y al cerrar cada sprint</li></ol></div><div class="box o" style="font-size:.78em"><b>Principios que aplicamos</b><ul><li><b>El porqué de cada valoración</b> («alto porque…») para que otra persona llegue al mismo resultado (buena práctica de NIST).</li><li><b>Severidad no es riesgo:</b> una vulnerabilidad de 10.0 puede dejar un riesgo residual bajo si el equipo ya está corregido.</li><li>El riesgo cambia con la fase: más incertidumbre al iniciar, menos al implementar; al cierre se registra lo ocurrido en las lecciones aprendidas.</li><li><b>Riesgo cerrado:</b> R1 (¿exigirán SQL Server?) — el grupo decidió el 24 oct. que MySQL es definitivo; se libera su reserva de 4 h.</li></ul></div></div>`,
`Seguimos el ciclo que comparten las referencias del curso: preparar, conducir, comunicar y mantener. En preparar definimos el propósito, el alcance, el horizonte y una escala cualitativa de tres niveles. En conducir identificamos los riesgos con lluvia de ideas y con la estructura de desglose de riesgos, y los evaluamos con probabilidad, impacto y, importante, el porqué de cada valor, para que otra persona llegue al mismo resultado. Los altos o críticos se comunican al docente la misma semana, y la matriz se revisa cada semana y al cerrar cada sprint. Recordamos que severidad no es lo mismo que riesgo, y que el riesgo uno, la exigencia de SQL Server, se cerró cuando el grupo decidió que MySQL es definitivo.`],

[`<h2>Matriz de probabilidad e impacto (3×3) y RBS</h2><table style="font-size:.6em;text-align:center"><tr><th>Impacto \ Probabilidad</th><th>Baja</th><th>Media</th><th>Alta</th></tr><tr><th>Alto</th><td style="background:#fff3cd">Medio<br>R3, R9, R13</td><td style="background:#ffd9b3">Alto<br>R5, R8, R12</td><td style="background:#f8b4b4"><b>Crítico</b><br>R2</td></tr><tr><th>Medio</th><td style="background:#e8f5e9">Bajo<br>R7, R14</td><td style="background:#fff3cd">Medio<br>R6, R11</td><td style="background:#ffd9b3">Alto<br>R4</td></tr><tr><th>Bajo</th><td style="background:#e8f5e9">Bajo<br>—</td><td style="background:#e8f5e9">Bajo<br>R10</td><td style="background:#fff3cd">Medio<br>—</td></tr></table><b style="font-size:.7em">RBS: riesgos por categoría</b><table style="font-size:.52em"><tr><td><b>Técnico:</b> R3, R7, R9, R10, R12, R14</td><td><b>Cronograma:</b> R2</td><td><b>Cliente:</b> R4</td><td><b>Contractual:</b> R6, R8, R11</td><td><b>Personas:</b> R5, R13</td></tr><tr><td colspan=5>Sin riesgo propio: <b>Costo</b> (Q 0; se cubre con reservas) · <b>Clima</b> (trabajo remoto; falla de equipo en R9) · <b>Financiero</b> y <b>Ambiental</b> (no aplican) · <b>Político</b> (no identificado en un prototipo académico)</td></tr></table>`,
`La matriz cruza probabilidad e impacto. Hay un riesgo crítico, el R2 del cronograma; cuatro altos: R4, R5, R8 y R12; cinco medios y tres bajos. Debajo está la estructura de desglose de riesgos, que clasifica los riesgos por categoría: la mayoría son técnicos, y para algunas categorías, costo, clima, financiero, ambiental y político, declaramos explícitamente que no tenemos riesgo propio y por qué, para demostrar que las revisamos y no las olvidamos.`],

[`<h2>Registro de riesgos (1/2): con su «porque»</h2><table style="font-size:.5em"><tr><th>Id</th><th>Riesgo</th><th>P / I</th><th>Nivel</th><th>Porque</th><th>Respuesta</th><th>Reserva</th></tr><tr><td>R2</td><td>La cadena de BD II tiene 2 días de holgura y coincide con el examen final</td><td>Alta / Alto</td><td><b>Crítico</b></td><td>Holgura de 2 días y ≈ 74 % de cumplir; cualquier atraso la agota</td><td><b>Mitigar:</b> adelantar el ETL con datos reales; mantener el solape de la revisión</td><td>6 h</td></tr><tr><td>R3</td><td>Datos de salud sensibles (nombres, DPI) en el almacén o las entregas</td><td>Baja / Alto</td><td>Medio</td><td>El almacén solo recibe datos sintéticos y no tiene columnas con nombre, DPI ni teléfono; si ocurriera, el daño sería alto</td><td><b>Evitar:</b> el DW no guarda datos personales</td><td>0 h</td></tr><tr><td>R4</td><td>Otros grupos no definen sus formatos de datos a tiempo</td><td>Alta / Medio</td><td>Alto</td><td>La integración depende de cuatro grupos y no hay formato común acordado (supuesto por confirmar)</td><td><b>Mitigar:</b> publicar un contrato de datos propio y dejar la integración real como exclusión</td><td>2 h</td></tr><tr><td>R5</td><td>Sobrecarga de un integrante (equipo de 3)</td><td>Media / Alto</td><td>Alto</td><td>La ruta crítica no tiene reemplazos y coincide con el examen final</td><td><b>Mitigar:</b> reparto de roles y revisión semanal de horas reales</td><td>4 h</td></tr><tr><td>R6</td><td>Crecimiento del alcance hacia funciones de la app que no se evalúan</td><td>Media / Medio</td><td>Medio</td><td>Ya ocurrió: el 24 oct. se agregaron MFA, roles y auditoría; se registró como cambio (paquete 3.4)</td><td><b>Evitar:</b> control de cambios aprobado por el líder</td><td>0 h</td></tr><tr><td>R7</td><td>La aplicación y el almacén no se conectan</td><td>Baja / Medio</td><td>Bajo</td><td>El puente existe y la reconciliación da 0; se repite tras cada cambio de esquema</td><td><b>Mitigar:</b> <code>run_app.sh</code> con reconciliación</td><td>0 h</td></tr></table>`,
`Este es el registro de riesgos, primera parte, con el porqué de cada valoración. El riesgo dos es crítico: holgura de dos días y setenta y cuatro por ciento de probabilidad de cumplir. El tres, datos sensibles en el almacén, es de nivel medio porque el almacén solo recibe datos sintéticos y no tiene columnas personales. El cuatro depende de cuatro grupos sin un formato común. El cinco es la sobrecarga de un integrante, porque la ruta crítica no tiene reemplazos. El seis, crecimiento del alcance, ya ocurrió y se gestionó con control de cambios. Y el siete, la conexión entre la aplicación y el almacén, se mitigó con un puente y reconciliación. A cada uno le corresponde una estrategia y una reserva de horas.`],

[`<h2>Registro de riesgos (2/2)</h2><table style="font-size:.48em"><tr><th>Id</th><th>Riesgo</th><th>P / I</th><th>Nivel</th><th>Porque</th><th>Respuesta</th><th>Reserva</th></tr><tr><td>R8</td><td>Omitir la declaración de IA o el formato IEEE (tope 60 %)</td><td>Media / Alto</td><td>Alto</td><td>El estándar fija el tope y el nivel de modificación ya está declarado (≈ 70 % revisado a mano)</td><td><b>Mitigar:</b> apéndice preparado y lista de verificación obligatoria</td><td>1 h</td></tr><tr><td>R9</td><td>Falla del equipo o de Docker durante la demostración</td><td>Baja / Alto</td><td>Medio</td><td>El prototipo corre en un solo equipo con Docker</td><td><b>Mitigar:</b> capturas, video y copia de los scripts</td><td>1 h</td></tr><tr><td>R10</td><td>Los datos sintéticos no reflejan casos reales</td><td>Media / Bajo</td><td>Bajo</td><td>Se generan con distribuciones simples</td><td><b>Aceptar:</b> declararlo como límite</td><td>0 h</td></tr><tr><td>R11</td><td>No se leyeron los lineamientos de los entregables 2 y 3</td><td>Media / Medio</td><td>Medio</td><td>Las tareas de Classroom no muestran descripción</td><td><b>Mitigar:</b> leer las instrucciones y ajustar antes de entregar</td><td>1 h</td></tr><tr><td>R12</td><td>Fuga de datos de salud de la aplicación (credenciales robadas, descarga masiva)</td><td>Media / Alto</td><td>Alto</td><td>Guardará datos de salud; los controles bajan la probabilidad pero quedan límites (sin HTTPS, sesión en el navegador)</td><td><b>Mitigar</b> (aplicado 24 oct.): MFA, roles, bloqueo por intentos, auditoría, bases locales, secretos fuertes. Pendiente: HTTPS y cookie HttpOnly</td><td>2 h</td></tr><tr><td>R13</td><td>Suplantación (phishing o deepfake) para ordenar exportar la base de pacientes</td><td>Baja / Alto</td><td>Medio</td><td>Caso de clase; hoy cualquier usuario con lectura puede exportar, aunque cada exportación queda auditada</td><td><b>Mitigar:</b> colgar y llamar al número oficial antes de exportar; revisión semanal de la auditoría</td><td>1 h</td></tr><tr><td>R14</td><td>Equipos del grupo sin parche (vulnerabilidades conocidas)</td><td>Baja / Medio</td><td>Bajo</td><td>El equipo inventariado está fuera del rango de CVE-2025-43300; faltan los otros dos integrantes</td><td><b>Mitigar:</b> actualizaciones al día; revisar inventario cada mes</td><td>1 h</td></tr></table><p class="mut" style="font-size:.56em">Reservas: las respuestas suman <b>19 h</b> (6+2+4+1+1+1+2+1+1 = 19). Con R1 cerrado se liberaron sus 4 h.</p>`,
`Segunda parte del registro. El ocho, omitir la declaración de IA, tiene un tope de sesenta por ciento de la nota, y el nivel de modificación ya está declarado: cerca de setenta por ciento revisado a mano. El nueve es una falla de Docker en la demostración. El diez, que los datos sintéticos no reflejen casos reales, lo aceptamos y lo declaramos como límite. El once son los lineamientos de entregables que no pudimos leer. El doce es una fuga de datos de salud de la aplicación: ya aplicamos MFA, roles, bloqueo, auditoría y secretos fuertes, y queda pendiente HTTPS y la cookie protegida antes de publicar. El trece es suplantación para ordenar una exportación y el catorce son equipos sin parche. Las reservas de todas las respuestas suman diecinueve horas.`],

[`<h2>Riesgos de seguridad con el modelo NIST</h2><table style="font-size:.5em"><tr><th>Id</th><th>Fuente de amenaza</th><th>Evento</th><th>Vulnerabilidad</th><th>Condición predisponente</th><th>Prob.</th><th>Impacto adverso</th></tr><tr><td>R12</td><td>Atacante externo o usuario con credenciales robadas</td><td>Acceso o descarga masiva de datos de pacientes</td><td>Contraseñas débiles o reutilizadas, bases accesibles en la red y falta de trazabilidad (corregidas el 24 oct.); sin HTTPS ni cookie HttpOnly (pendiente)</td><td>Datos de salud de alto valor en entidades pequeñas sin equipo de seguridad</td><td>Media (6 meses desde la publicación; no aplica a la entrega académica)</td><td>Alto: daño a las personas por pérdida de confidencialidad; daño legal y de reputación</td></tr><tr><td>R13</td><td>Adversario con IA generativa</td><td>Videollamada con un «viceministro» falso que ordena exportar la base a un correo externo</td><td>No existe un procedimiento escrito para verificar órdenes de exportación</td><td>Cualquier usuario autenticado con acceso de lectura puede exportar</td><td>Baja (6 meses)</td><td>Alto: salida masiva de datos de pacientes</td></tr><tr><td>R14</td><td>Error humano o explotación de un equipo sin parche</td><td>Ejecución de código al abrir una imagen manipulada (CVE-2025-43300, ImageIO)</td><td>macOS Ventura &lt; 13.7.8, Sonoma &lt; 14.7.8, Sequoia &lt; 15.6.1</td><td>Equipos personales sin administración central</td><td>Baja (6 meses; el equipo registrado ya está fuera del rango)</td><td>Medio: compromiso de un equipo del grupo</td></tr></table><p style="font-size:.62em"><b>Modelo:</b> fuente de amenaza → evento → vulnerabilidad (con su condición predisponente) → impacto adverso, con probabilidad en un horizonte definido (NIST SP 800-30).</p>`,
`Para los riesgos de seguridad usamos el modelo de NIST, que describe quién amenaza, qué evento puede ocurrir, qué vulnerabilidad lo permite, en qué condiciones, con qué probabilidad en un horizonte definido y qué impacto tendría. El R12 es una fuga de datos con credenciales robadas; ya corregimos contraseñas débiles, bases accesibles y falta de trazabilidad, y queda pendiente HTTPS. El R13 es un adversario con inteligencia artificial que simula una videollamada para ordenar una exportación, y la vulnerabilidad es que no existe un procedimiento escrito para verificar. Y el R14 es un equipo sin parche frente a una vulnerabilidad conocida de macOS.`],

[`<h2>Contingencia, oportunidades y laboratorio A1-b</h2><div class="cols"><div><b>Plan de contingencia</b> (método alternativo si el riesgo ocurre)<table style="font-size:.52em"><tr><th>Riesgo</th><th>Disparador</th><th>Alternativa</th></tr><tr><td>R2</td><td>A 7 días del plazo, pierde toda la holgura</td><td>Entregar alcance mínimo (ER, estrella, ETL, 8 consultas); diferir extras</td></tr><tr><td>R5</td><td>Un integrante no puede continuar</td><td>Reasignar paquetes; reserva de gestión</td></tr><tr><td>R9</td><td>Falla Docker o el equipo en la demo</td><td>Video y capturas; scripts en otro equipo</td></tr><tr><td>R12</td><td>El sistema cae o se sospecha fuga</td><td>Plantilla CSV sin conexión; restablecer contraseñas y MFA; revisar auditoría</td></tr></table><b>Oportunidades</b><table style="font-size:.52em"><tr><td><b>O1 · Compartir:</b> otros grupos podrían adoptar el contrato de datos y la plantilla CSV</td></tr><tr><td><b>O2 · Mejorar:</b> pruebas e2e y reconciliación automática acortan la verificación final</td></tr></table></div><div class="box" style="font-size:.64em"><b>Laboratorio A1-b</b> (inventario de equipos y vulnerabilidad vigente)<br>Base de la clase: <b>CVE-2025-24054</b> (Windows NTLM) y <b>CVE-2025-43300</b> (macOS ImageIO).<br><br><b>Integrante 1:</b> macOS 27.0.1, <b>fuera del rango</b> de CVE-2025-43300 (riesgo residual bajo). Parte B: <b>CVE-2026-65395</b> (ImageIO, escritura fuera de límites, CWE-787), CVSS 3.1 de 6.5 (media), <b>sin explotación conocida</b> (no está en el catálogo KEV); corregida en macOS 27.<br><br><b>Integrantes 2 y 3:</b> <i>por completar</i> (el laboratorio es individual).<br><br><b>Control:</b> mantener actualizaciones al día; revisar el inventario cada mes (≈ 0.5 h mensuales).</div></div>`,
`El plan de contingencia es el método alternativo que se aplica cuando un riesgo ocurre, con un disparador claro; no debe confundirse con el fondo de contingencia, que son las horas de reserva. Por ejemplo, para el riesgo de cronograma, si a siete días del plazo se pierde toda la holgura, se entrega el alcance mínimo. También identificamos dos oportunidades: compartir el contrato de datos con otros grupos y mejorar la verificación con pruebas y reconciliación automáticas. Del laboratorio A1-b, el integrante uno completó su inventario y su vulnerabilidad vigente, con fuentes consultadas el veinticuatro de octubre; los integrantes dos y tres deben completar su parte, porque el laboratorio es individual.`],

[`<h2>Calidad: enfoque y dominios de PMBOK 8</h2><p style="font-size:.72em">La calidad se define <b>contra requisitos documentados</b> (no contra opinión) y se trata como <b>principio</b> en los siete dominios. Producto evaluado con ISO/IEC 25010:2023: adecuación funcional, fiabilidad, seguridad y usabilidad. Prácticas ISO 21502: <b>planificar</b> (7.11.2) → <b>asegurar</b> (7.11.3) → <b>controlar</b> (7.11.4).</p><table style="font-size:.5em"><tr><th>Dominio</th><th>Pregunta de calidad</th><th>Aplicación en SISG</th></tr><tr><td>Gobernanza</td><td>¿Se auditan los procesos y se mejora?</td><td>Auditoría en la app (quién, qué, cuándo) y revisión semanal del grupo</td></tr><tr><td>Alcance</td><td>¿Cada requisito tiene criterio de aceptación?</td><td>Criterios por entregable (acta, B.3)</td></tr><tr><td>Cronograma</td><td>¿Prevención y pruebas están dentro de cada entregable?</td><td>Pruebas e2e y reconciliación antes de cada entrega (paquetes 4.1 y 4.2)</td></tr><tr><td>Finanzas</td><td>¿Se presupuestó el costo de la calidad?</td><td>Paquetes 4.1 a 4.3 = 17 h de 168 h</td></tr><tr><td>Interesados</td><td>¿La percepción del usuario se vuelve requisito medible?</td><td>Sesión de usabilidad y especificación de «facilidad de uso»</td></tr><tr><td>Recursos</td><td>¿Hay capacitación y herramientas desde el inicio?</td><td>Docker y scripts reproducibles (<code>run.sh</code>, <code>run_app.sh</code>); revisión por pares</td></tr><tr><td>Riesgo</td><td>¿Qué defecto detectado tarde tendría mayor impacto?</td><td>Un error en el ETL falsea todos los indicadores: reconciliación obligatoria; una fuga de datos (R12)</td></tr></table>`,
`La calidad se define contra requisitos documentados, no contra opinión, y la tratamos como un principio en los siete dominios de PMBOK ocho. El producto se evalúa con cinco características de ISO veinticinco mil diez: adecuación funcional, fiabilidad, seguridad, usabilidad y eficiencia de desempeño. Las actividades siguen a ISO veintiún mil quinientos dos: planificar, asegurar y controlar. En la tabla se ve cómo cada dominio se traduce en algo concreto en SISG; por ejemplo, en finanzas, la calidad tiene presupuesto: diecisiete de las ciento sesenta y ocho horas, y en riesgo, la reconciliación es obligatoria porque un error en el ETL falsearía todos los indicadores.`],

[`<h2>Especificaciones de calidad medibles y evidencia</h2><table style="font-size:.48em"><tr><th>Atributo</th><th>Unidad / cómo se mide</th><th>Mín. → Meta</th><th>Evidencia</th></tr><tr><td>Fiabilidad del ETL</td><td>Diferencia de filas y montos (<code>07_reconciliacion.sql</code>)</td><td>0 → 0</td><td><b>Cumple:</b> 0 en estudios, campañas y resumen; 12,507 estudios y 150 campañas</td></tr><tr><td>Adecuación funcional</td><td>% de pruebas e2e en verde</td><td>100 → 100</td><td><b>Cumple:</b> 103 pruebas (49 al 24 oct.)</td></tr><tr><td>Seguridad: confidencialidad</td><td>Columnas con nombre, DPI o teléfono en el DW</td><td>0 → 0</td><td><b>Cumple:</b> 0 columnas</td></tr><tr><td>Seguridad: autenticación</td><td>% de cuentas con MFA para obtener sesión</td><td>100 → 100</td><td><b>Cumple</b> (pruebas e2e de MFA)</td></tr><tr><td>Seguridad: trazabilidad</td><td>% de cambios, inicios de sesión y exportaciones auditados</td><td>100 → 100</td><td><b>Cumple;</b> límite: la exportación se registra desde el cliente</td></tr><tr><td>Seguridad: aislamiento</td><td>Intentos de acceso cruzado rechazados</td><td>100 → 100</td><td><b>Cumple</b> (404/403)</td></tr><tr><td>Eficiencia de desempeño</td><td>Segundos de una consulta con ≈ 12,000 estudios; <code>EXPLAIN</code></td><td>&lt;2 s → &lt;0.5 s</td><td><b>Cumple (13 nov.):</b> ≈ 11.1 ms y ≈ 1.6 ms, unas 7× más rápida</td></tr><tr><td>Usabilidad</td><td>% de personas que registran un paciente sin ayuda</td><td>80 → 95</td><td><i>Pendiente de medir</i></td></tr></table><p class="mut" style="font-size:.56em">Mínimos y metas de usabilidad y desempeño: propuestas del grupo (ilustrativas), a validar. Desempeño: promedio de 50 ejecuciones × 3 repeticiones, datos sintéticos, MySQL 8 en Docker.</p>`,
`Esta es la tabla de especificaciones de calidad: cada atributo tiene unidad, cómo se mide, un mínimo, una meta y evidencia. La fiabilidad del ETL se mide con la reconciliación y da cero. La adecuación funcional se mide con pruebas automáticas: eran cuarenta y nueve y hoy son ciento tres, todas en verde. La confidencialidad se mide contando columnas con datos personales en el almacén: cero. La autenticación, la trazabilidad y el aislamiento se verifican con pruebas. La eficiencia, con una consulta de unos once milisegundos y la optimizada de uno punto seis, siete veces más rápida. Y la usabilidad aún está pendiente de medir con personas, lo declaramos. Los mínimos y metas de usabilidad y desempeño son propuestas del grupo.`],

[`<h2>Defectos encontrados y corregidos</h2><table style="font-size:.6em"><tr><th>Defecto</th><th>Causa</th><th>Corrección</th></tr><tr><td>Las consultas se ejecutaban antes del ETL</td><td>Orden de scripts en <code>run.sh</code></td><td>El ETL corre antes; las consultas van aparte (<code>consultas.sh</code>)</td></tr><tr><td>La tabla de sumarización era casi tan grande como el hecho (10,106 filas)</td><td>Grano demasiado fino (incluía geografía)</td><td>Se quitó la geografía; quedó en ≈ 1,800 filas (hoy 1,758)</td></tr><tr><td>Los pacientes sin municipio perdían su departamento (80 estudios en «Desconocido»)</td><td>El mapeo guardaba solo el municipio</td><td>Se guarda el departamento aparte; bajó a 40 (los que no traen ningún lugar)</td></tr><tr><td><code>docker-compose.yml</code> quedó vacío tras una edición</td><td>Se abrió el archivo para escribir antes de leerlo</td><td>Se restauró; se revisa que ningún archivo quede en 0 bytes</td></tr><tr><td>Las pruebas e2e vaciaban la base de desarrollo</td><td>Apuntaban a la misma base</td><td>Se fijó una base de pruebas propia</td></tr></table><p style="font-size:.7em"><b>Aseguramiento:</b> revisión por pares con lista de verificación (alcance, formato IEEE, apéndice de IA) y ejecución completa desde cero antes de entregar. <b>Control:</b> pruebas e2e, reconciliación fuente–DW, registro de defectos y su corrección.</p>`,
`Llevamos un registro de defectos encontrados y corregidos, porque la calidad también se demuestra mostrando lo que falló. Las consultas se ejecutaban antes del ETL por el orden de los scripts. La tabla de resumen era casi tan grande como el hecho porque incluía la geografía, y se corrigió. Los pacientes sin municipio perdían su departamento y los estudios quedaban como desconocidos; se corrigió guardando el departamento aparte. Un archivo de configuración quedó vacío por una edición mal hecha y ahora revisamos que ningún archivo quede en cero bytes. Y las pruebas vaciaban la base de desarrollo, lo que corregimos con una base de pruebas propia.`],

[`<h2>Prueba de usabilidad: plan</h2><div class="cols"><div><b>Tareas con datos ficticios</b><table style="font-size:.52em"><tr><th>#</th><th>Tarea</th><th>Éxito si…</th></tr><tr><td>0</td><td>Ingresar con el correo dado y activar la verificación en dos pasos</td><td>Llega a Inicio</td></tr><tr><td><b>1</b></td><td><b>Registrar a la paciente Ana López, mujer, nacida el 12/03/1990, de Quetzaltenango</b></td><td><b>Aparece en la lista (mide la meta)</b></td></tr><tr><td>2</td><td>(Centro) Registrar un ultrasonido para Ana López, hoy, costo Q250</td><td>El estudio aparece asociado a Ana</td></tr><tr><td>3</td><td>(Organismo) Crear la campaña «Jornada de salud del corazón», cardiovascular, en Huehuetenango, el mes próximo</td><td>Aparece en la lista</td></tr><tr><td>4</td><td>Encontrar cuántos pacientes y estudios hay</td><td>Dice las cifras correctas</td></tr></table></div><div class="box" style="font-size:.6em"><b>Método</b><ul><li><b>3 a 5 personas</b> que no construyeron el sistema; ≈ 20 min cada una</li><li>Un <b>facilitador</b> habla y un <b>observador</b> anota; <b>3 min</b> atascado = «no completó»</li><li>Se evalúa el sistema, no a la persona; pensar en voz alta</li><li>Cuestionario <b>SUS</b> (10 preguntas, 1 a 5): impares restan 1, pares restan de 5; suma × 2.5 → 0 a 100 (<b>68</b> promedio, <b>80+</b> muy bueno)</li></ul><b>Indicador:</b> tasa de éxito sin ayuda en la tarea 1. Con 5 personas, 4 ✔ = 80 % (mínimo). Con 3, hay que acertar las 3.<br><b>Estado:</b> <i>guía lista; falta ejecutarla.</i> La muestra pequeña detecta problemas, no estima con precisión.</div></div>`,
`Para medir la usabilidad preparamos una prueba con tres a cinco personas que no construyeron el sistema. Cada persona hace tareas con datos ficticios; la tarea uno, registrar a una paciente, es la que mide la meta. Un facilitador habla y un observador anota sin intervenir; si pasan tres minutos sin avanzar, se anota que no completó. Al final se aplica el cuestionario SUS, de diez preguntas, que da un puntaje de cero a cien, donde sesenta y ocho es el promedio y ochenta o más es muy bueno. El indicador es el porcentaje que logra la tarea uno sin ayuda: con cinco personas, cuatro éxitos dan el ochenta por ciento mínimo. La guía está lista y la prueba falta ejecutarla; lo decimos con claridad, y reconocemos que una muestra pequeña sirve para detectar problemas, no para estimar con precisión.`],

[`<h2>Lecciones aprendidas</h2><div class="cols"><div class="box"><b>Lo que funcionó</b><ul style="font-size:.78em"><li>Calcular cronograma, ruta crítica, PERT y valor ganado con un <b>script</b> (<code>plan.py</code>): los números de los documentos no se transcriben a mano</li><li><b>Reconciliar</b> la fuente contra el almacén: confianza medible en el ETL</li><li>Separar claramente <b>predictivo</b> (entregables de BD II) de <b>ágil</b> (la app)</li><li><b>Pruebas automáticas</b> (103) como criterio de terminado</li><li>Declarar <b>límites y supuestos</b> en lugar de esconderlos</li></ul></div><div class="box o"><b>Lo que haríamos distinto</b><ul style="font-size:.78em"><li><b>Decidir el motor de BD al inicio:</b> la app nació en PostgreSQL y migrar a MySQL obligó a reescribir SQL</li><li><b>Registrar las horas reales desde el día 1:</b> sin ellas no hay CPI ni EAC</li><li><b>Pruebas con base propia</b> desde el comienzo (vaciaban la de desarrollo)</li><li><b>Congelar el alcance:</b> MFA, roles y auditoría se agregaron el 24 oct. (+12 h, paquete 3.4)</li><li><b>Asignar personas a los roles</b> en la fase 0 y completar la declaración de IA a medida que se trabaja</li></ul></div></div>`,
`Lo que funcionó: calcular cronograma, ruta crítica, PERT y valor ganado con un script, así los números de los documentos no se transcriben a mano; reconciliar la fuente contra el almacén; separar lo predictivo de lo ágil; usar las pruebas automáticas como criterio de terminado, y declarar límites y supuestos. Lo que haríamos distinto: decidir el motor de base de datos al inicio, registrar las horas reales desde el primer día porque sin ellas no hay índice de costo, usar una base propia para las pruebas desde el comienzo, congelar el alcance, porque MFA, roles y auditoría se agregaron a última hora y sumaron doce horas, y asignar personas a los roles y completar la declaración de IA a medida que se trabaja.`],

[`<h2>Declaración de uso de IA (Apéndice A)</h2><table style="font-size:.52em"><tr><th>Campo</th><th>Declaración</th></tr><tr><td><b>Herramienta</b></td><td>Claude Code, con el modelo Claude Sonnet 5.5 (Anthropic)</td></tr><tr><td><b>Prompt</b></td><td>Conversación con instrucciones del grupo (no un único prompt): revisar y mejorar la app; leer el material de Classroom; diseñar el almacén (ER, estrella, ETL, consultas); redactar los documentos de gestión con las plantillas del curso; agregar carga masiva, bitácora, MFA, roles, usuarios, auditoría y validación; rehacer el capítulo de riesgos y el plan híbrido con la sesión del 24 de octubre. El historial completo está disponible si el docente pide los prompts literales</td></tr><tr><td><b>Propósito</b></td><td>Borradores de documentos (acta, alcance, EDT, cronograma, interesados, comunicaciones, riesgos, calidad, enfoque híbrido); código SQL y de la app con sus pruebas; consulta del NVD y del aviso de Apple para el laboratorio A1-b; cálculo de ruta crítica, PERT y valor ganado con un script; búsqueda y corrección de errores</td></tr><tr><td><b>Secciones afectadas</b></td><td><code>docs/gestion/01</code> a <code>04</code>, <code>dw/</code>, <code>backend/</code> y <code>nuevo-diseño/</code>. Los números de 02 a 04 salen de <code>plan.py</code></td></tr><tr><td><b>Nivel de modificación</b></td><td>El grupo declara que revisó a mano aproximadamente el <b>70 %</b> del contenido generado con IA (27 de noviembre de 2026).</td></tr></table><p style="font-size:.62em"><b>Datos estimados por la IA que el grupo debe validar:</b> horas por paquete, % de avance, valores O/M/P del PERT, poder e interés, probabilidad e impacto y el «porque» de los riesgos, las 12 h del paquete 3.4 y los mínimos y metas de usabilidad y desempeño. <b>Sin esta declaración la nota máxima es 60 %.</b></p>`,
`Presentamos la declaración de uso de inteligencia artificial en el formato exigido por el curso: herramienta, prompt, propósito, secciones afectadas y nivel de modificación. Usamos Claude Code, con el modelo Claude Sonnet cinco punto cinco, a partir de una conversación con instrucciones del grupo; el historial está disponible si el docente quiere los prompts literales. Se usó para borradores de documentos, para el código y sus pruebas, para consultar fuentes de seguridad y para calcular el cronograma con un script. El grupo declara que revisó a mano aproximadamente el setenta por ciento del contenido generado, y también debe validar todas las estimaciones que hizo la IA.`],

[`<h2>Pendientes y cómo se cierran</h2><table style="font-size:.52em"><tr><th>Pendiente</th><th>Quién</th><th>Cómo se cierra</th></tr><tr><td>Roles asignados: líder Soberanis, datos Jolón, aplicación y calidad Estrada</td><td>Grupo</td><td>Hecho (acta, sección 9)</td></tr><tr><td>Confirmar horas, % de avance, valores PERT y valoraciones de riesgo e interesados</td><td>Grupo</td><td>Reunión de validación; regenerar con <code>plan.py</code></td></tr><tr><td>Registrar horas reales (AC)</td><td>Cada integrante</td><td>Calcular CPI y EAC</td></tr><tr><td>Nivel de modificación de la declaración de IA: ≈ 70 % revisado a mano</td><td>Grupo</td><td>Hecho (Apéndice A)</td></tr><tr><td>Ejecutar la prueba de usabilidad (3 a 5 personas)</td><td>Grupo</td><td>Llenar la fila de la especificación de calidad</td></tr><tr><td>Laboratorio A1-b: filas y Parte B de los integrantes 2 y 3; confirmar el CVE en el NVD</td><td>Cada integrante</td><td>Tabla de inventario completa</td></tr><tr><td>Verificar el catálogo de municipios (339 contra 340 oficial)</td><td>Datos</td><td>Corregir <code>geografia.ts</code> y <code>01b_catalogos.sql</code></td></tr><tr><td>Antes de publicar la app: HTTPS, cookie HttpOnly, migraciones, contraseña propia de MySQL, respaldos</td><td>Calidad</td><td>Cierra el riesgo R12</td></tr><tr><td>Leer lineamientos de los entregables 2 y 3; abrir el Word en Microsoft Word</td><td>Líder</td><td>Riesgo R11; revisión de formato</td></tr></table>`,
`Cerramos con transparencia: esto es lo que falta y cómo se cierra. Falta asignar personas a los roles, que el grupo confirme las estimaciones, registrar las horas reales para calcular el costo, ejecutar la prueba de usabilidad, que cada integrante complete su parte del laboratorio, verificar el catálogo de municipios, que tiene uno menos que el oficial, y los controles que se necesitan antes de publicar la aplicación de verdad. También revisar el documento en Word. Cada pendiente tiene responsable y una forma concreta de cerrarse.`],

[`<h2>Normas y estándares: dónde se aplica cada una en SISG</h2><table style="font-size:.5em"><tr><th>Norma</th><th>Qué es</th><th>Dónde la aplicamos</th></tr>
<tr><td><b>PMBOK 8</b> (PMI, 2025)</td><td>Guía de dirección de proyectos: siete dominios y principios</td><td>Marco del plan de gestión: la calidad como principio en los siete dominios y el ciclo del riesgo</td></tr>
<tr><td><b>ISO 21502:2020</b></td><td>Guía de gestión de proyectos</td><td>Riesgos (7.8: preparar, conducir, comunicar, mantener) y calidad (7.11.2 planificar, 7.11.3 asegurar, 7.11.4 controlar)</td></tr>
<tr><td><b>ISO/IEC 25010:2023</b></td><td>Modelo de calidad del software</td><td>Cinco características con metas medibles: adecuación funcional, fiabilidad, seguridad, usabilidad y eficiencia de desempeño (reconciliación en cero, consulta 8 unas 7 veces más rápida, MFA obligatorio)</td></tr>
<tr><td><b>NIST SP 800-30</b> Rev. 1</td><td>Evaluación de riesgos de seguridad</td><td>Riesgos de seguridad: fuente de amenaza, evento, vulnerabilidad e impacto, con el «porque» de cada valor</td></tr>
<tr><td><b>CVSS / CVE (NVD)</b></td><td>Severidad de vulnerabilidades conocidas</td><td>Laboratorio A1-b: CVE vigente del equipo de cada integrante; severidad no es riesgo</td></tr>
<tr><td><b>Scrum Guide 2020</b></td><td>Marco ágil</td><td>Sprints de la aplicación con Sprint Goal, incremento y Definition of Done</td></tr>
<tr><td><b>IEEE</b></td><td>Formato de documentos técnicos</td><td>Plan de gestión con carátula, tablas y figuras en IEEE, y Apéndice A de uso de IA</td></tr>
<tr><td><b>HL7 FHIR</b></td><td>Estándar de interoperabilidad en salud</td><td>La aplicación exporta datos en FHIR (extra técnico, fuera del plan de gestión)</td></tr>
<tr><td><b>ISO/IEC 27001</b></td><td>Gestión de seguridad de la información</td><td><b>No la aplicamos formalmente</b> (sin certificación). Controles propios: MFA, roles por entidad y bitácora de auditoría</td></tr></table>`,
`Estas son las normas y estándares que usamos y dónde se ve cada una en el proyecto. PMBOK 8 es el marco general. ISO 21502 nos da el detalle de riesgos y calidad en la gestión. ISO/IEC 25010 define las características de calidad del producto: evaluamos cinco, con metas medibles. NIST SP 800-30 estructura los riesgos de seguridad. CVSS mide la severidad de una vulnerabilidad, y distinguimos severidad de riesgo. Scrum organiza los sprints de la aplicación e IEEE define el formato de los documentos. HL7 FHIR es un extra técnico: la aplicación exporta en ese formato. Y una aclaración honesta: no aplicamos ISO 27001 de manera formal ni tenemos certificación; los controles de seguridad son propios.`],

[`<h2>Referencias</h2><ol style="font-size:.7em;line-height:1.5"><li>Organización Panamericana de la Salud, <i>Bases para la construcción del Marco de Arquitectura de Salud Pública para Guatemala: Línea de base</i>, OPS/OMS Guatemala, 2024.</li><li>Project Management Institute, <i>Guía de los Fundamentos para la Dirección de Proyectos (Guía del PMBOK)</i>, 8.ª ed., 2025.</li><li>ISO, <i>ISO 21502:2020 – Project, programme and portfolio management – Guidance on project management</i>, 2020.</li><li>ISO/IEC, <i>ISO/IEC 25010:2023 – Systems and software quality models</i>, 2023.</li><li>Joint Task Force, <i>NIST SP 800-30 Rev. 1: Guide for Conducting Risk Assessments</i>, NIST, 2012.</li><li>A. Watt, <i>Project Management</i>, cap. 16, BCcampus, 2.ª ed., 2014.</li><li>NIST, <i>National Vulnerability Database (NVD)</i>, https://nvd.nist.gov, consultado el 24 de octubre de 2026.</li><li>Apple, <i>About the security content of macOS Golden Gate 27</i>, 14 de septiembre de 2026 (entradas actualizadas el 19 de octubre), https://support.apple.com/en-us/149035.</li></ol><p class="mut" style="font-size:.64em">Citas numeradas, como en el documento IEEE entregado.</p>`,
`Estas son las ocho referencias del documento: la línea base de la OPS para Guatemala, la guía del PMBOK octava edición, ISO veintiún mil quinientos dos de gestión de proyectos, ISO veinticinco mil diez de calidad de software, la guía de evaluación de riesgos de NIST, el capítulo de riesgos de Watt, la base de vulnerabilidades del NIST y el aviso de seguridad de Apple. Se citan con números, como en el documento en formato IEEE.`],

[`<h2>Preguntas sobre metodología y normas</h2><table style="font-size:.52em"><tr><th>Pregunta</th><th>Respuesta</th></tr>
<tr><td>¿Qué metodología usaron?</td><td>Híbrida: predictiva para los entregables fijos (hitos y ruta crítica) y ágil, con Scrum, para construir la aplicación por sprints.</td></tr>
<tr><td>¿Por qué híbrida y no solo ágil?</td><td>Plazo y entregables los fija el curso (28 de noviembre); la aplicación sí evoluciona con un backlog priorizado.</td></tr>
<tr><td>¿Qué ISO usaron?</td><td>ISO 21502 para gestión de proyectos, ISO/IEC 25010 para calidad del producto; PMBOK 8 como marco y NIST SP 800-30 para riesgos de seguridad.</td></tr>
<tr><td>¿Por qué ISO/IEC 25010?</td><td>Define características de calidad que se pueden medir. Elegimos cinco y les pusimos meta y evidencia.</td></tr>
<tr><td>¿Severidad y riesgo no son lo mismo?</td><td>No. CVSS mide qué tan grave es una vulnerabilidad; el riesgo depende además de la probabilidad y de lo que está expuesto. Un CVE grave en un equipo ya parchado deja un riesgo residual bajo.</td></tr>
<tr><td>¿Cómo gestionan los cambios?</td><td>Los cambios al alcance de los entregables fijos pasan por el líder; los de la aplicación entran al backlog.</td></tr>
<tr><td>¿Tienen certificación de seguridad?</td><td>No. Aplicamos controles propios (MFA, roles, bitácora); ISO/IEC 27001 queda como mejora futura.</td></tr>
<tr><td>¿Por qué IEEE y declaración de IA?</td><td>El curso exige el formato IEEE y declarar el uso de IA en el Apéndice A; sin declaración, la nota máxima baja a 60%.</td></tr></table>`,
`Esta diapositiva reúne las preguntas más probables sobre metodología y normas, con la respuesta corta. Si preguntan por la metodología: híbrida, con una parte predictiva y otra ágil con Scrum. Si preguntan por las ISO: 21502 para la gestión y 25010 para la calidad del producto, con PMBOK 8 como marco. Y si preguntan por seguridad, aclaramos que no tenemos certificación, sino controles propios.`],

[`<h2>Más preguntas posibles (respuestas cortas)</h2><table style="font-size:.5em"><tr><th>Pregunta</th><th>Respuesta</th></tr><tr><td>¿Por qué un enfoque híbrido?</td><td>Los entregables de BD II tienen contenido y fecha fijos (predictivo); la app evoluciona con un backlog (ágil).</td></tr><tr><td>¿Qué significa «holgura» y por qué importa?</td><td>Días que una actividad puede atrasarse sin atrasar el proyecto. La cadena de BD II tiene 2: un atraso mayor incumple la entrega.</td></tr><tr><td>¿Por qué horas y no dinero?</td><td>No hay gasto monetario (Q 0); las horas-persona son el costo real. El método es el mismo con quetzales.</td></tr><tr><td>¿Por qué reserva de 13 % y no 10 %?</td><td>Las respuestas a riesgos suman 19 h; el 10 % (16.8 h) no alcanza; 13 % = 21.8 h cubre con 2.8 h de margen.</td></tr><tr><td>¿Qué significa SPI = 1.27?</td><td>Valor ganado ÷ planificado: vamos adelantados. Depende de % de avance estimados; no es resultado final.</td></tr><tr><td>¿Por qué el CPI y el EAC son supuestos?</td><td>No se registraron las horas reales (AC); se asume AC = EV, lo que da CPI 1.00 y EAC 168 h. Es un supuesto, no una medición; se recalcula con las horas reales.</td></tr><tr><td>¿Contingencia: plan o reserva?</td><td>Son distintos: el plan es el método alternativo si el riesgo ocurre; la reserva son horas para cubrirlo.</td></tr><tr><td>¿Severidad y riesgo son lo mismo?</td><td>No: una vulnerabilidad de 10.0 puede dejar riesgo bajo si el equipo ya está corregido.</td></tr><tr><td>¿Hubo cambios de alcance?</td><td>Sí: el 24 oct. se agregó seguridad y usuarios (paquete 3.4, +12 h); se registró con control de cambios (R6).</td></tr><tr><td>¿Cómo declaran el uso de IA?</td><td>Apéndice A con herramienta, prompt, propósito, secciones y nivel de modificación (este último, por completar por el grupo).</td></tr><tr><td>¿Qué pasa si se atrasa el ETL (C)?</td><td>Tiene 2 días de holgura. Si se pierde, se activa el plan de contingencia: entregar alcance mínimo.</td></tr></table>`,
`Cerramos con una tanda de preguntas posibles sobre gestión: por qué un enfoque híbrido, qué es la holgura, por qué medimos en horas, por qué la reserva es de trece por ciento, qué significa el índice del cronograma, por qué no hay índice de costo, la diferencia entre plan de contingencia y reserva, la diferencia entre severidad y riesgo, qué cambios de alcance hubo y cómo declaramos la inteligencia artificial. Cada respuesta es corta y está respaldada por las tablas de las diapositivas anteriores.`],

let i=0;const s=document.getElementById("s"),n=document.getElementById("notes");
function fit(){s.style.fontSize='';const b=parseFloat(getComputedStyle(s).fontSize);
 for(let f=1.7;f>=0.7;f-=0.05){s.style.fontSize=(b*f)+'px';if(s.scrollHeight<=s.clientHeight+1&&s.scrollWidth<=s.clientWidth+1)return}}
window.addEventListener('resize',()=>fit());
function draw(){s.innerHTML=S[i][0]+`<div class="num">${i+1} / ${S.length}</div>`;n.innerHTML="<b>Qué decir:</b> "+S[i][1];
 document.querySelector("#prog i").style.width=((i+1)/S.length*100)+"%";document.getElementById("cnt").textContent=(i+1)+"/"+S.length;location.hash=i+1;fit()}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));draw()}
function tn(){n.classList.toggle("on")}
document.addEventListener("keydown",e=>{if(e.target.id==="q")return;if(["ArrowRight","PageDown"," "].includes(e.key))go(1);else if(["ArrowLeft","PageUp"].includes(e.key))go(-1);
 else if(e.key=="n"||e.key=="N")tn();else if(e.key=="f"||e.key=="F")document.documentElement.requestFullscreen();else if(e.key=="Home"){i=0;draw()}else if(e.key=="End"){i=S.length-1;draw()}});
const h=parseInt(location.hash.slice(1));if(h>0&&h<=S.length)i=h-1;draw();

// Buscador: busca en el texto de cada diapositiva y en el guion. "/" o Ctrl/Cmd+K para abrirlo; Enter va al primer resultado.
(()=>{const q=document.getElementById("q"),res=document.getElementById("res");
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const plain=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ").trim();
const idx=S.map((d,k)=>{const m=d[0].match(/<h[12][^>]*>([\s\S]*?)<\/h[12]>/);const title=plain(m?m[1]:d[0]).slice(0,90);const body=plain(d[0]);return{k,title,body,all:norm(body+" "+plain(d[1]))}});
let sel=0,hits=[];
function find(){const w=norm(q.value).split(/\s+/).filter(x=>x.length>1);if(!w.length){res.style.display="none";hits=[];return}
 hits=idx.filter(d=>w.every(x=>d.all.includes(x))).map(d=>({d,s:w.filter(x=>norm(d.title).includes(x)).length})).sort((a,b)=>b.s-a.s||a.d.k-b.d.k).slice(0,20);sel=0;
 res.innerHTML=hits.length?hits.map((h,n)=>{const t=norm(h.d.body),p=t.indexOf(w[0]),a=Math.max(0,p-40),sn=p<0?h.d.body.slice(0,110):"…"+h.d.body.slice(a,a+120)+"…";return `<div data-k="${h.d.k}" class="${n?"":"on"}"><b>${h.d.k+1}.</b> ${h.d.title}<small>${sn}</small></div>`}).join(""):"<div>Sin resultados</div>";res.style.display="block"}
function ir(k){i=k;draw();res.style.display="none";q.blur()}
q.addEventListener("input",find);
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";res.style.display="none";q.blur()}
 else if(e.key==="Enter"&&hits.length)ir(hits[sel].d.k);
 else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(hits.length-1,sel+(e.key==="ArrowDown"?1:-1)));[...res.children].forEach((c,n)=>c.classList.toggle("on",n===sel));res.children[sel]&&res.children[sel].scrollIntoView({block:"nearest"})}});
res.addEventListener("click",e=>{const c=e.target.closest("[data-k]");if(c)ir(+c.dataset.k)});
document.addEventListener("keydown",e=>{if(e.target===q)return;if(e.key==="/"||(e.key.toLowerCase()==="k"&&(e.metaKey||e.ctrlKey))){e.preventDefault();q.focus();q.select()}},true);
})();
</script></body></html>
