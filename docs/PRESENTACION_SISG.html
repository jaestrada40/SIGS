[`<h2>La aplicación: roles y qué puede hacer cada uno</h2><div class="cols"><div><b>4 roles</b><table style="font-size:.62em"><tr><th>Rol</th><th>Alcance</th></tr><tr><td><code>SUPERADMIN</code></td><td>Plataforma: da de alta entidades, invitaciones y otros superadmins; ve la auditoría de la plataforma</td></tr><tr><td><code>ADMIN</code></td><td>Administra <b>su</b> entidad: usuarios, impacto, FHIR y auditoría</td></tr><tr><td><code>OPERADOR</code></td><td>Opera el día a día de su entidad; sin acceso a usuarios, impacto, FHIR ni a consultar la auditoría</td></tr><tr><td><code>AUDITOR</code></td><td>Consulta: impacto, FHIR y auditoría</td></tr></table></div><div><b>Permisos verificados en el código</b><table style="font-size:.6em"><tr><th>Función</th><th>Quién</th></tr><tr><td>Usuarios de la entidad</td><td>ADMIN</td></tr><tr><td>Indicadores de impacto</td><td>ADMIN, AUDITOR</td></tr><tr><td>Exportación FHIR</td><td>ADMIN, AUDITOR</td></tr><tr><td>Consultar la auditoría</td><td>ADMIN, AUDITOR</td></tr><tr><td>Registrar eventos de auditoría</td><td>ADMIN, OPERADOR, AUDITOR</td></tr><tr><td>Administración de la plataforma</td><td>SUPERADMIN</td></tr></table></div></div><p style="font-size:.7em"><b>Aislamiento:</b> cada consulta filtra por la entidad de la sesión (<code>entidadId</code>); una entidad nunca ve datos de otra (probado con pruebas que esperan 404/403).</p>`,
`Detallamos los roles. Hay cuatro: el superadministrador, que es de la plataforma y da de alta las entidades; y tres por entidad, administrador, operador y auditor. Antes dije tres roles; son tres por entidad más el de plataforma. En el código verificamos que solo el administrador gestiona usuarios, que el administrador y el auditor ven el impacto, la exportación FHIR y la auditoría, y que cada consulta se filtra por la entidad de la sesión, de modo que una entidad no puede ver datos de otra; eso está cubierto por pruebas que esperan un rechazo.`],

[`<h2>La aplicación: qué hace cada tipo de entidad</h2><table style="font-size:.6em"><tr><th>Módulo (ruta)</th><th>Centro de diagnóstico</th><th>Organismo no lucrativo</th><th>Qué hace</th></tr><tr><td><code>/paciente</code></td><td>✔</td><td>✔</td><td>Listar, crear, editar, ver, <b>importar CSV</b></td></tr><tr><td><code>/estudio</code></td><td>✔ <b>solo centros</b></td><td>✘</td><td>Registrar, editar, ver, importar CSV</td></tr><tr><td><code>/campana</code></td><td>✘</td><td>✔ <b>solo organismos</b></td><td>Crear, editar, ver campañas</td></tr><tr><td><code>/referido</code></td><td>agenda o marca «No llegó»</td><td>crea y cancela</td><td>Envío de una persona a un centro, con consentimiento</td></tr><tr><td><code>/enlace</code></td><td>✔ <b>solo centros</b></td><td>✘</td><td>Enlace seguro para entregar un resultado</td></tr><tr><td><code>/jornada</code></td><td>✘</td><td>✔ <b>solo organismos</b></td><td>Sincronizar atenciones registradas sin conexión</td></tr><tr><td><code>/alerta</code> · <code>/dashboard</code></td><td>✔</td><td>✔</td><td>Avisos y totales en Inicio</td></tr><tr><td><code>/impacto</code> · <code>/fhir</code></td><td colspan=2>ADMIN y AUDITOR</td><td>Indicadores y exportación</td></tr><tr><td><code>/auth</code></td><td colspan=2>público</td><td>Invitación, login, MFA, cambio de contraseña, cierre de sesión</td></tr></table><p style="font-size:.66em">La restricción por tipo se aplica con un decorador (<code>@SoloTipo</code>) en el servidor: <b>no depende de la interfaz</b>.</p>`,
`Esta tabla resume los módulos según el tipo de entidad. Los estudios y los enlaces de resultado son solo de centros; las campañas y la jornada sin conexión son solo de organismos. Los referidos son el puente entre ambos: el organismo los crea y cancela, y el centro los agenda o marca que no llegó. La restricción por tipo se aplica en el servidor con un decorador, así que no depende de lo que la interfaz muestre u oculte.`],

[`<h2>Referidos: de la campaña al estudio</h2><div class="flow" style="font-size:.78em"><div class="box o"><b>PENDIENTE</b><br>el organismo crea el referido con el <b>consentimiento</b> de la persona</div><div class="ar">→</div><div class="box b"><b>AGENDADO</b><br>el centro fija la cita; se crea la persona y el <b>estudio</b> en el centro</div><div class="ar">→</div><div class="box"><b>ATENDIDO</b><br>pasa solo al marcar el estudio como <b>realizado</b></div></div><div class="cols" style="margin-top:.5em;font-size:.74em"><div class="box r"><b>Otros estados:</b> <code>NO_LLEGO</code> (el centro lo marca) · <code>CANCELADO</code> (lo cancela el organismo).</div><div class="box"><b>Privacidad:</b><ul><li>El centro recibe una <b>copia mínima</b>: nombre, DPI, nacimiento, sexo, teléfono, estudio y motivo.</li><li>Se guarda la <b>fecha del consentimiento</b>.</li><li>El organismo ve el estado, <b>nunca el resultado clínico</b>.</li></ul></div></div><p style="font-size:.66em"><b>Límites:</b> una persona por referido; sin notificaciones automáticas (el organismo ve el estado al abrir la pantalla). Cada referido tiene un código único para mostrarlo en el centro.</p>`,
`Los referidos son lo que une los dos tipos de entidad. Un organismo, por ejemplo después de un tamizaje en una campaña, refiere a una persona a un centro de diagnóstico y registra que la persona dio su consentimiento. El centro recibe solo una copia mínima de los datos, agenda la cita y al hacerlo se crean la persona y el estudio en el centro. Cuando el centro marca el estudio como realizado, el referido pasa solo a atendido. Hay dos estados más: no llegó y cancelado. Lo más importante para la privacidad: el organismo ve el estado, pero nunca el resultado clínico. Los límites: un referido es de una sola persona y no hay notificaciones automáticas.`],

[`<h2>Seguridad de la aplicación, en detalle</h2><div class="cols"><div class="box"><b>Entrada al sistema</b><ul style="font-size:.78em"><li>Sin registro público: el superadmin crea la entidad y entrega una <b>invitación de un solo uso (72 h)</b>.</li><li>Flujo: <code>login</code> → token parcial → <code>mfa/verificar</code> (código de un solo uso) → sesión.</li><li><b>MFA obligatorio</b>: <code>mfa/configurar</code> y <code>mfa/activar</code>; la clave se guarda cifrada.</li><li><b>Bloqueo por intentos</b> y límite de peticiones.</li></ul></div><div class="box b"><b>Enlace seguro de resultado</b><ul style="font-size:.78em"><li>El token se muestra <b>una sola vez</b>; en la base solo se guarda su <b>hash</b>.</li><li>Vence (1 a 30 días) y se puede <b>revocar</b>.</li><li>Pide fecha de nacimiento o últimos 4 del DPI; <b>se bloquea tras 5 fallos</b>.</li><li>Límite de <b>10 solicitudes por minuto</b>; no se indexa ni se guarda en caché.</li><li>Cada acceso y cada intento fallido quedan en la auditoría.</li></ul></div></div><p style="font-size:.68em"><b>Pendiente antes de publicar:</b> HTTPS, sesión en cookie <code>HttpOnly</code>, migraciones, contraseña propia para MySQL y respaldos (riesgo R12). Hoy es un prototipo académico.</p>`,
`Más detalle de seguridad. No hay registro público: el superadministrador crea la entidad y entrega una invitación de un solo uso. El inicio de sesión tiene dos pasos: contraseña y luego un código de un solo uso; el segundo factor es obligatorio y su clave se guarda cifrada. Hay bloqueo por intentos y límite de peticiones. El enlace seguro para entregar un resultado muestra el token una sola vez y en la base solo se guarda su hash, vence, se puede revocar, pide una verificación de identidad, se bloquea tras cinco fallos y todo queda auditado. Y declaramos lo que falta antes de publicar de verdad: HTTPS, cookie HttpOnly, migraciones y respaldos, porque hoy es un prototipo académico.`],

[`<h2>Funciones diferenciales y sus límites</h2><table style="font-size:.58em"><tr><th>Función</th><th>Qué hace</th><th>Límite que declaramos</th></tr><tr><td><b>Impacto</b> (<code>/impacto</code>)</td><td>Centro: ingresos, cobro promedio, cancelación. Organismo: personas, costo por persona, tasa de llegada de referidos. Exporta CSV (auditado) e imprime a PDF</td><td>Se calcula en vivo sobre la <b>base de la app</b>, no sobre el almacén</td></tr><tr><td><b>Modo sin conexión</b> (<code>/jornada</code>)</td><td>Registra personas atendidas sin internet; cifra cada registro (AES-GCM, clave PBKDF2) y sincroniza al volver la señal sin duplicar</td><td>La contraseña de jornada <b>no se recupera</b>; solo registra personas, no estudios</td></tr><tr><td><b>FHIR</b> (<code>/fhir</code>)</td><td><code>Patient</code>, <code>DiagnosticReport</code>, <code>Organization</code> como Bundle FHIR R4</td><td><b>Subconjunto</b>: sin búsqueda ni escritura, estudios como texto (sin LOINC/SNOMED)</td></tr><tr><td><b>Alertas</b> (<code>/alerta</code>)</td><td>Estudios vencidos o sin resultado o monto; referidos sin agendar o sin atender; campañas vencidas o sin costo</td><td>Se ven al abrir Inicio; no se envían solas</td></tr><tr><td><b>Recordatorio</b></td><td>Enlace de WhatsApp con el mensaje listo; no menciona el tipo de estudio</td><td>La persona del centro decide enviarlo</td></tr></table>`,
`Estas son las funciones que van más allá de un registro de pacientes, cada una con su límite declarado. El panel de impacto calcula indicadores para centros y para organismos, pero lo hace en vivo sobre la base de la aplicación, no sobre el almacén de datos del curso. El modo sin conexión permite registrar atenciones en una jornada sin internet, con cifrado en el dispositivo y sincronización sin duplicados; su límite es que la contraseña de jornada no se puede recuperar. La exportación FHIR es un subconjunto y no debe describirse como compatible sin más. Las alertas y el recordatorio por WhatsApp completan el flujo; el recordatorio no menciona el tipo de estudio para proteger la privacidad.`],

[`<h2>Pruebas automáticas: 103 en 14 archivos</h2><table style="font-size:.6em"><tr><th>Archivo</th><th>Pruebas</th><th>Qué cubre</th></tr><tr><td><code>usuarios</code></td><td>13</td><td>Gestión de usuarios y roles</td></tr><tr><td><code>plataforma</code></td><td>12</td><td>Superadmin, entidades, invitaciones</td></tr><tr><td><code>enlaces</code> · <code>referidos</code></td><td>11 · 11</td><td>Enlace seguro · flujo de referidos</td></tr><tr><td><code>auth</code></td><td>10</td><td>Login, MFA, bloqueo, cambio de contraseña</td></tr><tr><td><code>jornada</code></td><td>8</td><td>Sincronización sin conexión</td></tr><tr><td><code>importar</code></td><td>7</td><td>Carga masiva por CSV, errores por fila</td></tr><tr><td><code>fhir</code> · <code>impacto</code> · <code>validacion</code></td><td>6 · 6 · 6</td><td>Exportación · indicadores · validación de datos</td></tr><tr><td><code>bitacora</code></td><td>4</td><td>Auditoría</td></tr><tr><td><code>campanas</code> · <code>estudios</code> · <code>pacientes</code></td><td>3 · 3 · 3</td><td>Altas, ediciones y aislamiento entre entidades</td></tr></table><p style="font-size:.7em"><b>Total: 103</b> (contadas en los archivos de <code>backend/test</code>). Lección: corrían contra la base de desarrollo y la vaciaban; se corrigió con una base de pruebas fija.</p>`,
`Las pruebas automáticas son ciento tres, repartidas en catorce archivos; las contamos directamente en la carpeta de pruebas. Los archivos con más pruebas son usuarios, plataforma, enlaces y referidos, porque son los flujos con más reglas. También cubren autenticación y MFA, la sincronización sin conexión, la carga masiva, la exportación, los indicadores, la validación de datos y la auditoría. Y recordamos la lección: las pruebas corrían contra la base de desarrollo y la vaciaban; lo corregimos fijando una base de pruebas.`],

[`<h2>Seguridad y privacidad</h2><div class="cols3"><div class="box"><b>Acceso</b><ul><li>Sin registro público</li><li>Invitación de un solo uso (72 h)</li><li><b>MFA obligatorio</b></li><li>Roles por entidad</li></ul></div><div class="box b"><b>Trazabilidad</b><ul><li>Bitácora de auditoría</li><li>Triggers de validación</li><li>Llaves foráneas</li></ul></div><div class="box o"><b>Privacidad en el DW</b><ul><li>Sin nombre, DPI ni teléfono</li><li>Solo sexo y grupo de edad</li><li>Rol <code>analista</code> de solo lectura</li><li>Las contraseñas no se exportan</li></ul></div></div><p class="mut">La API no arranca sin <code>JWT_SECRET</code> (≥32 caracteres) y <code>MFA_KEY</code>.</p>`,
`En seguridad: no hay registro público, el superadministrador da de alta cada entidad y entrega un enlace de invitación de un solo uso, válido setenta y dos horas. El MFA es obligatorio y los datos quedan auditados en una bitácora. En el almacén, por privacidad, no guardamos nombre, DPI ni teléfono: solo sexo y grupo de edad, y el acceso es con un rol de solo lectura. Las contraseñas nunca se exportan al staging. Y la API se niega a arrancar si faltan las claves secretas.`],

[`<h2>Integración con la plataforma del Grupo 8 (<code>sisg_analitica</code>)</h2><div class="flow" style="font-size:.8em"><div class="box"><b>Nuestro almacén</b><br><code>sisg_dw</code></div><div class="ar">→</div><div class="box o"><b>Agregado mensual</b><br><code>01_agregado_g4.sql</code></div><div class="ar">→</div><div class="box o"><b>Buzón</b><br><code>ingesta_g4_servicio</code></div><div class="ar">→</div><div class="box b"><b>Trigger</b><br>valida llaves contra sus catálogos</div><div class="ar">→</div><div class="box b"><b><code>fact_servicio</code></b><br>central · lo consumen otros grupos</div></div><div class="cols" style="margin-top:.6em"><div class="box"><b>Qué enviamos</b><ul style="font-size:.85em"><li>Servicios y monto cobrado por mes, establecimiento, ubicación y servicio</li><li><b>1,908 filas · 14 establecimientos</b> (claves 11 a 24)</li><li>Sin pacientes ni datos personales: solo cifras agregadas</li></ul></div><div class="box b"><b>Validación (solo lectura)</b><ul style="font-size:.85em"><li><b>0</b> llaves inválidas contra sus catálogos</li><li>1,908 de 1,908 filas ya en su <code>fact_servicio</code>, sin diferencias de valores</li><li>Su tablero del Grupo 4 muestra nuestros datos</li></ul></div></div><p class="mut" style="font-size:.7em">Su vista tiene además 10 filas de prueba del Grupo 8 (establecimientos 8 a 10, 2024). Evidencia: <code>dw/g8/02_resultado_validacion.txt</code>.</p>`,
`Hasta aquí todo es nuestro: la aplicación genera los datos y nuestro almacén los modela. Ahora cerramos el ciclo con el resto del sistema de salud. El Grupo 8 es el gestor de la plataforma: tiene un almacén central, sisg_analitica, donde convergen los siete grupos de datos. Nosotros, como Grupo 4, le aportamos un resumen, no la base completa: servicios y monto cobrado por mes, establecimiento, ubicación y tipo de servicio. Son 1,908 filas de 14 establecimientos, que se insertan en nuestra tabla buzón. Un disparador en el servidor las valida contra sus catálogos y las copia a su tabla de hechos, que consumen otros grupos, como las aseguradoras. No viajan pacientes ni datos personales. Antes de enviar validamos, solo con lectura, que todas nuestras llaves existieran: cero inválidas, y las 1,908 filas coinciden con lo cargado. El tablero del Grupo 8 ya muestra nuestros datos. Si preguntan por otras filas, son 10 datos de prueba del Grupo 8.`],

[`<h2>Gestión del proyecto</h2><div class="cols"><div><ul><li><b>Enfoque híbrido:</b> predictivo para acordar el plan; ágil para construir en iteraciones cortas</li><li>Plazo fijo · equipo de 3</li></ul><b>Documentos entregados</b><ul><li>Acta de constitución y alcance</li><li>EDT (regla del 100 %)</li><li>Cronograma: ruta crítica, PERT y Gantt</li><li>Registro de interesados y matriz poder-interés</li><li>Plan de comunicaciones</li><li>Reporte de estado con CPI y SPI</li></ul></div><div class="box"><b>CPI y SPI</b><br>CPI = EV/AC → ¿gasté lo planeado?<br>SPI = EV/PV → ¿voy al ritmo?<br>&gt;1 es favorable.<br><br><span class="mut">Los valores finales y el EAC dependen de las horas reales que el grupo está completando.</span></div></div>`,
`Pasamos a la gestión. Usamos un enfoque híbrido: predictivo para acordar el plan, con alcance, hitos y dependencias, y ágil para construir en iteraciones cortas con revisión y ajuste. La documentación incluye el acta, la EDT con la regla del cien por ciento, el cronograma con ruta crítica, PERT y Gantt, los interesados con matriz poder-interés, el plan de comunicaciones y el reporte de estado con CPI y SPI. Somos transparentes: los valores finales de CPI y EAC dependen de las horas reales trabajadas que aún estamos completando.`],

[`<h2>EDT: estructura de desglose del trabajo</h2><table style="font-size:.56em"><tr><th>Rama</th><th>Paquetes de trabajo (horas)</th><th>Horas</th></tr><tr><td><b>1 Gestión</b></td><td>1.1 Acta y alcance (6) · 1.2 EDT, cronograma y costos (6) · 1.3 Interesados y comunicaciones (5) · 1.4 Riesgos y calidad (6) · 1.5 Reportes de estado (3)</td><td><b>26</b></td></tr><tr><td><b>2 Datos (BD II)</b></td><td>2.1 ER de las fuentes (8) · 2.2 Modelo estrella (8) · 2.3 ETL (10) · 2.4 Consultas (6) · 2.5 Documento técnico (8)</td><td><b>40</b></td></tr><tr><td><b>3 Aplicación web</b></td><td>3.1 Backend y autenticación (25) · 3.2 Interfaz y rediseño (12) · 3.3 Carga masiva y bitácora (12) · 3.4 Seguridad y usuarios (12)</td><td><b>61</b></td></tr><tr><td><b>4 Calidad y pruebas</b></td><td>4.1 Pruebas e2e (8) · 4.2 Reconciliación fuente–DW (3) · 4.3 Revisión por pares (6)</td><td><b>17</b></td></tr><tr><td><b>5 Cierre</b></td><td>5.1 Informe de cierre (8) · 5.2 Exposición final (10) · 5.3 Ajustes y entrega final BD II (6)</td><td><b>24</b></td></tr></table><p style="font-size:.74em"><b>Total = 168 horas</b> (el presupuesto, BAC). <b>Regla del 100 %:</b> los paquetes del nivel 2 suman todo el alcance del nivel 1: ni falta ni sobra trabajo. Las horas son <b>estimaciones iniciales</b> que el grupo debe validar con sus horas reales.</p>`,
`Esta es la estructura de desglose del trabajo, con cinco ramas: gestión, datos, aplicación web, calidad y cierre, y veinte paquetes de trabajo. Las horas por rama suman ciento sesenta y ocho, que es el presupuesto del proyecto. Cumple la regla del cien por ciento: los paquetes suman exactamente el alcance de su rama, sin trabajo faltante ni sobrante. Aclaramos que las horas son estimaciones iniciales que el grupo valida con las horas reales trabajadas.`],

[`<h2>Cronograma, ruta crítica y PERT</h2><table style="font-size:.52em"><tr><th>ID</th><th>Actividad restante (desde el 26 oct.)</th><th>Dur.</th><th>Fechas</th><th>Holgura</th></tr><tr><td>A</td><td>Validar acta, alcance y EDT</td><td>2</td><td>26–27 oct</td><td>8</td></tr><tr><td>B</td><td>Presentar el diseño estrella (30 oct.)</td><td>5</td><td>26–30 oct</td><td>2</td></tr><tr><td>C</td><td>ETL con datos reales de la app</td><td>6</td><td>31 oct–5 nov</td><td>2</td></tr><tr><td>D</td><td>Consultas finales y análisis con EXPLAIN</td><td>5</td><td>6–10 nov</td><td>2</td></tr><tr><td>E</td><td>Documento técnico de BD II</td><td>8</td><td>11–18 nov</td><td>2</td></tr><tr><td>K</td><td>Revisión por pares (solapa 2 d con E)</td><td>5</td><td>17–21 nov</td><td>2</td></tr><tr><td>L</td><td>Ajustes y entrega final BD II</td><td>4</td><td>22–25 nov</td><td>2</td></tr><tr><td>J</td><td>Exposición final (semana 19)</td><td>2</td><td>20–21 nov</td><td><b>0</b></td></tr></table><div class="cols" style="font-size:.66em;margin-top:.3em"><div class="box"><b>Ruta con menos holgura (BD II):</b> B→C→D→E→K→L termina el <b>25 nov</b>; el límite es el <b>28 nov, 8:00</b>: 2 días de holgura. <b>J</b> tiene holgura 0 porque su fecha la fija el curso.</div><div class="box o"><b>PERT:</b> esperado = (O+4M+P)/6. Cadena = <b>31.8 días</b>, σ = 1.91, disponibles 33 → z = 0.63 → <b>≈ 74 %</b> de cumplir. Para subirlo: adelantar el ETL con datos reales.</div></div>`,
`El cronograma lo calculamos con el método de diagramación por precedencia. La cadena de Bases de Datos II, diseño estrella, ETL con datos reales, consultas, documento técnico, revisión y ajustes, termina el veinticinco de noviembre, con dos días de holgura frente al límite del veintiocho a las ocho de la mañana. Cualquier atraso mayor de dos días la incumple. La exposición tiene holgura cero porque su fecha la fija el calendario del curso. Con estimaciones PERT de tres valores, la duración esperada de la cadena es treinta y uno punto ocho días contra treinta y tres disponibles, lo que da una probabilidad de cumplir de aproximadamente setenta y cuatro por ciento. Para mejorarla, adelantamos el ETL con datos reales.`],

[`<h2>Costos y valor ganado (al 24 de octubre)</h2><div class="cols"><div><table style="font-size:.62em"><tr><th>Indicador</th><th>Valor</th></tr><tr><td>BAC (presupuesto)</td><td>168 h</td></tr><tr><td>PV (valor planificado)</td><td>86.6 h</td></tr><tr><td>EV (valor ganado)</td><td>110.1 h</td></tr><tr><td><b>SPI</b> = EV/PV</td><td><b>1.27</b> (adelantados)</td></tr><tr><td>Avance = EV/BAC</td><td>66 %</td></tr><tr><td>AC · CPI · EAC</td><td><i>pendientes: horas reales</i></td></tr></table></div><div class="box" style="font-size:.74em"><b>Unidad de costo: horas-persona</b> (no hay presupuesto monetario: Q 0).<br><br><b>Reservas</b><ul><li>Contingencia: <b>13 % = 21.8 h</b> (cubre las 19 h de respuestas a riesgos; el 10 % sugerido, 16.8 h, no alcanzaba)</li><li>Gestión: <b>5 % = 8.4 h</b></li><li>Presupuesto con reservas: <b>198.2 h</b></li></ul><b>Fórmulas:</b> CPI = EV/AC · SPI = EV/PV · EAC = BAC/CPI</div></div><p class="mut" style="font-size:.66em">El SPI &gt; 1 depende de los % de avance y las horas, que son estimaciones: <b>no se reporta como resultado final</b> hasta validarlas. CPI y EAC requieren las horas reales (AC), que el grupo está completando.</p>`,
`En costos, como no hay presupuesto monetario, usamos horas-persona como unidad. El presupuesto es de ciento sesenta y ocho horas. Al veinticuatro de octubre el valor planificado era ochenta y seis punto seis horas y el valor ganado ciento diez punto uno, lo que da un SPI de uno punto veintisiete, es decir adelantados respecto al plan, con un avance del sesenta y seis por ciento. Hay dos reservas: la de contingencia de trece por ciento, veintiuno punto ocho horas, que cubre las diecinueve horas de respuestas a riesgos, y la de gestión de cinco por ciento. Somos claros en un punto: el SPI depende de estimaciones, y el CPI y la proyección EAC quedan pendientes hasta que el grupo registre las horas reales.`],

[`<h2>Enfoque híbrido: etapas, objetivo y criterio de terminado</h2><table style="font-size:.54em"><tr><th>Etapa</th><th>Objetivo (Sprint Goal)</th><th>Definition of Done</th><th>Estado 24 oct.</th></tr><tr><td><b>Fase 0</b> · predictiva</td><td>Requisitos, alcance y cronograma de hitos aprobados</td><td>Acta, alcance y EDT validados; ER de las fuentes entregado</td><td>ER entregado; documentos por validar</td></tr><tr><td><b>Sprint 1</b> · Fuente operativa</td><td>Aplicación fuente segura y con datos</td><td>Pruebas e2e al 100 %; MFA, roles y auditoría activos</td><td><b>Hecho</b></td></tr><tr><td><b>Sprint 2</b> · Modelo estrella</td><td>Diseño del almacén aprobado y presentado</td><td>Presentado el 30 oct., sin datos personales</td><td>En curso</td></tr><tr><td><b>Sprint 3</b> · ETL con datos reales</td><td>Cargar los datos de la app al almacén</td><td>Reconciliación con diferencia 0 con datos de la app (5 nov.)</td><td>En curso</td></tr><tr><td><b>Sprint 4</b> · Consultas y documento</td><td>Responder las preguntas de análisis</td><td>8 consultas sin error con EXPLAIN; documento revisado por pares</td><td>Por iniciar</td></tr><tr><td><b>Sprint 5</b> · Cierre</td><td>Entregar y exponer</td><td>Lista de verificación completa; exposición 20–21 nov.; entrega 28 nov. 8:00</td><td>Por iniciar</td></tr></table><p style="font-size:.68em"><b>Regla:</b> el modelo de datos verificado va antes que las consultas; cada sprint construye sobre lo que el anterior dejó verificado. Entre sprints hay un hito; al cerrar cada uno, una revisión y una retrospectiva breve en el reporte semanal.</p>`,
`El enfoque es híbrido: una fase cero predictiva para acordar el plan, y cinco sprints ágiles, cada uno con su objetivo y su criterio de terminado verificable. La regla que adoptamos es que el modelo de datos verificado va antes que las consultas, y cada sprint se apoya en lo que el anterior dejó verificado. Entre sprints hay un hito, y al cerrar cada uno hacemos una revisión del incremento y una retrospectiva breve. El estado que se muestra es el del corte del veinticuatro de octubre.`],

[`<h2>Riesgos y calidad</h2><div class="cols"><div class="box r"><b>Riesgos</b><ul><li>Matriz <b>3×3</b> probabilidad × impacto, con el <b>porqué</b> de cada valor</li><li>Respuestas: evitar, transferir, mitigar, aceptar, escalar</li><li>Ejemplo: ¿exigirán SQL Server? → decisión del 24 de octubre: MySQL definitivo → <b>riesgo cerrado</b></li><li>Severidad de una vulnerabilidad ≠ nivel de riesgo</li></ul></div><div class="box"><b>Calidad · ISO/IEC 25010 con metas medibles</b><ul><li><b>Corrección:</b> reconciliación = 0 diferencias</li><li><b>Eficiencia:</b> consulta 8 ≈ 7× más rápida</li><li><b>Seguridad:</b> MFA obligatorio y acceso por rol</li></ul></div></div>`,
`Los riesgos los valoramos con una matriz de tres por tres, probabilidad por impacto, y escribimos el porqué de cada valor para que otra persona llegue a la misma conclusión. Un ejemplo: existía el riesgo de que se exigiera SQL Server; el grupo decidió el veinticuatro de octubre que MySQL es definitivo y el riesgo se cerró. Para la calidad usamos ISO 25010 con metas medibles: corrección con la reconciliación en cero, eficiencia con la consulta ocho siete veces más rápida, y seguridad con MFA y acceso por rol.`],

[`<h2>Riesgos: registro con nivel y respuesta</h2><table style="font-size:.5em"><tr><th>Id</th><th>Riesgo</th><th>Prob./Imp.</th><th>Nivel</th><th>Respuesta</th></tr><tr><td>R2</td><td>La cadena de BD II tiene 2 días de holgura y coincide con el examen final</td><td>Alta/Alto</td><td><b>Crítico</b></td><td>Mitigar: adelantar el ETL; mantener el solape de la revisión</td></tr><tr><td>R4</td><td>Otros grupos no definen sus formatos de datos</td><td>Alta/Medio</td><td>Alto</td><td>Mitigar: publicar un contrato de datos propio</td></tr><tr><td>R5</td><td>Sobrecarga de un integrante (equipo de 3)</td><td>Media/Alto</td><td>Alto</td><td>Mitigar: reparto de roles; revisión semanal de horas</td></tr><tr><td>R8</td><td>Omitir la declaración de IA o el formato IEEE (tope 60 %)</td><td>Media/Alto</td><td>Alto</td><td>Mitigar: apéndice y lista de verificación</td></tr><tr><td>R12</td><td>Fuga de datos de salud de la aplicación</td><td>Media/Alto</td><td>Alto</td><td>Mitigar: MFA, roles, bloqueo, auditoría; pendiente HTTPS</td></tr><tr><td>R3</td><td>Datos personales en el almacén o las entregas</td><td>Baja/Alto</td><td>Medio</td><td>Evitar: el DW no guarda datos personales</td></tr><tr><td>R6</td><td>Crecimiento del alcance (MFA, roles, auditoría)</td><td>Media/Medio</td><td>Medio</td><td>Evitar: control de cambios (ya ocurrió: paquete 3.4)</td></tr><tr><td>R9 · R11 · R13</td><td>Falla de Docker en la demo · lineamientos sin leer · suplantación para exportar datos</td><td>—</td><td>Medio</td><td>Mitigar: video y capturas · leer tareas · verificar por llamada</td></tr><tr><td>R7 · R14 · R10</td><td>App y DW desconectados · equipos sin parche · datos sintéticos no reales</td><td>—</td><td>Bajo</td><td>Mitigar · Mitigar · <b>Aceptar</b> (se declara)</td></tr></table><p style="font-size:.64em"><b>R1</b> (¿exigirán SQL Server?) está <b>cerrado</b>: MySQL definitivo (24 oct.), reserva de 4 h liberada. Cada riesgo lleva su <b>«porque»</b> escrito. Matriz 3×3: Crítico (R2) · Alto (R4, R5, R8, R12) · Medio (R3, R6, R9, R11, R13) · Bajo (R7, R10, R14).</p>`,
`Este es el registro de riesgos con su nivel y su respuesta. El único crítico es el R2, el cronograma: la cadena de Bases de Datos II tiene dos días de holgura y coincide con el examen final. Son altos el desacuerdo de formatos con otros grupos, la sobrecarga de un integrante, omitir la declaración de IA, que tiene un tope de sesenta por ciento de nota, y una fuga de datos de salud de la aplicación. Algunos ya ocurrieron: el crecimiento del alcance pasó el veinticuatro de octubre, cuando agregamos MFA, roles y auditoría, y se registró como cambio de alcance. Y el riesgo de que exigieran SQL Server se cerró cuando el grupo decidió que MySQL es definitivo. De cada riesgo escribimos el porqué de su valoración.`],

[`<h2>Contingencia, modelo NIST y reservas</h2><div class="cols"><div><b>Plan de contingencia (método alternativo si el riesgo ocurre)</b><table style="font-size:.54em"><tr><th>Riesgo</th><th>Disparador</th><th>Método alternativo</th></tr><tr><td>R2</td><td>A 7 días del plazo, la cadena pierde toda su holgura</td><td>Entregar el alcance mínimo (ER, estrella, ETL y 8 consultas) y diferir extras</td></tr><tr><td>R5</td><td>Un integrante no puede continuar</td><td>Reasignar paquetes y usar la reserva de gestión</td></tr><tr><td>R9</td><td>Falla Docker o el equipo en la demo</td><td>Video y capturas; copia de scripts en otro equipo</td></tr><tr><td>R12</td><td>El sistema cae o se sospecha una fuga</td><td>Plantilla CSV sin conexión; restablecer contraseñas y MFA; revisar la auditoría</td></tr></table></div><div class="box" style="font-size:.7em"><b>Modelo NIST (riesgos de seguridad)</b><br>fuente de amenaza → evento → vulnerabilidad → impacto.<br><br><b>R12:</b> atacante con credenciales robadas → descarga masiva de datos de pacientes → contraseñas débiles, bases accesibles, sin trazabilidad (corregido) y sin HTTPS (pendiente) → impacto alto.<br><br><b>R13:</b> adversario con IA → videollamada falsa que ordena exportar → no hay procedimiento escrito de verificación.<br><br><b>Severidad ≠ riesgo:</b> una vulnerabilidad con puntaje alto puede dejar un riesgo residual bajo si el equipo ya está corregido.</div></div><p style="font-size:.64em">Reserva de contingencia 21.8 h (13 %) y de gestión 8.4 h (5 %). La contingencia es un <b>método alternativo</b>; no es lo mismo que el fondo de contingencia.</p>`,
`Para los riesgos más importantes definimos un plan de contingencia, que es el método alternativo si el riesgo ocurre y se activa con un disparador concreto. Por ejemplo, si a siete días del plazo la cadena de Bases de Datos II pierde su holgura, entregamos el alcance mínimo: ER, estrella, ETL y las ocho consultas, y diferimos lo demás. Para los riesgos de seguridad usamos el modelo de NIST: quién amenaza, qué evento, qué vulnerabilidad lo permite y qué impacto tendría. Y recalcamos que severidad no es lo mismo que riesgo: una vulnerabilidad con puntaje alto puede dejar un riesgo bajo si el equipo ya está corregido.`],

[`<h2>Interesados: poder e interés</h2><table style="font-size:.54em"><tr><th>ID</th><th>Interesado</th><th>Poder</th><th>Interés</th><th>Cuadrante · estrategia</th></tr><tr><td>01</td><td>Docentes</td><td>5</td><td>5</td><td><b>Gestionar atentamente</b> · reportes y entregas por Classroom</td></tr><tr><td>02</td><td>Equipo del Grupo 4</td><td>4</td><td>5</td><td><b>Gestionar atentamente</b> · reunión semanal de 15 min y registro de horas</td></tr><tr><td>03</td><td>Gestor de plataforma (Grupo 8)</td><td>5</td><td>4</td><td><b>Gestionar atentamente</b> · acordar formatos y seguridad</td></tr><tr><td>04–05</td><td>Ministerio, INE (G2) · Hospitales (G1, G2)</td><td>5 · 4</td><td>4 · 4</td><td><b>Gestionar atentamente</b> · mostrar estrella y reconciliación; plantillas</td></tr><tr><td>06–08</td><td>Seguro social (G3) · Centros · Organismos (usuarios)</td><td>3</td><td>4 · 5 · 5</td><td><b>Mantener informado</b> · avances, plantilla CSV, panel</td></tr><tr><td>09–11</td><td>Aseguradoras (G5) · Org. internacionales (G6) · Universidades (G7)</td><td>3 · 3 · 2</td><td>3</td><td><b>Monitorear</b> · solo datos agregados o anonimizados</td></tr><tr><td>12</td><td>Pacientes</td><td>2</td><td>2</td><td><b>Monitorear</b> · se protegen: sin datos personales en el DW</td></tr></table><p style="font-size:.64em"><b>Regla:</b> alto = 4 o 5. Alto poder + alto interés → gestionar atentamente · alto poder + bajo interés → mantener satisfecho · bajo poder + alto interés → mantener informado · bajo + bajo → monitorear. Son <b>valoraciones iniciales</b> del grupo a validar.</p>`,
`Este es el registro de interesados con poder e interés de uno a cinco. Los de alto poder y alto interés, que gestionamos atentamente, son los docentes, el equipo, el gestor de plataforma, el Ministerio y los hospitales. Los usuarios, centros y organismos, tienen interés muy alto pero poder medio, así que los mantenemos informados. Aseguradoras, organismos internacionales y universidades solo reciben datos agregados o anonimizados. A los pacientes no los contactamos, pero son a quienes más protegemos: por eso el almacén no tiene sus datos personales. Estas valoraciones son iniciales y las valida el grupo.`],

[`<h2>Plan de comunicaciones y reglas</h2><table style="font-size:.52em"><tr><th>A quién</th><th>Qué</th><th>Cuándo</th><th>Cómo</th><th>Quién</th></tr><tr><td>Docentes</td><td>Entregables, reporte de estado, dudas de alcance</td><td>Según calendario; reporte cada 2 semanas</td><td>Classroom; correo institucional</td><td>Líder</td></tr><tr><td>Equipo</td><td>Avance, horas reales, riesgos, decisiones</td><td>Semanal (15 min); bloqueos el mismo día</td><td>Reunión breve y chat</td><td>Líder</td></tr><tr><td>Gestor de plataforma (G8)</td><td>Formato de datos, control de acceso, bitácora</td><td>Quincenal</td><td>Reunión entre grupos</td><td>Resp. de datos</td></tr><tr><td>Grupos fuente (G1–G3)</td><td>Plantilla CSV y reglas de validación</td><td>Una vez y al cambiar</td><td>Chat y Classroom</td><td>Resp. de datos</td></tr><tr><td>Centros y organismos</td><td>Uso de la app, errores de carga por fila</td><td>Al entregar y al cambiar</td><td>Aplicación y sesión breve</td><td>Resp. de aplicación</td></tr><tr><td>Consumidores (G5–G7)</td><td>Resultados de consultas agregadas</td><td>Al cierre</td><td>Documento técnico</td><td>Resp. de datos</td></tr></table><div class="box r" style="font-size:.7em;margin-top:.4em"><b>Reglas:</b> ① los datos de pacientes <b>no</b> se envían por chat ni correo (solo sintéticos o anonimizados) · ② un problema bloqueante se avisa el <b>mismo día</b> · ③ todo documento a los docentes lleva el <b>apéndice de declaración de IA</b> (omitirlo: máximo 60 %).</div>`,
`Este es el plan de comunicaciones: a quién, qué información, cuándo, por qué medio y quién es responsable. Con los docentes, entregas por Classroom y un reporte de estado cada dos semanas; con el equipo, una reunión semanal de quince minutos y los bloqueos se avisan el mismo día; con los otros grupos, un contrato de datos y una plantilla CSV. Tres reglas: los datos de pacientes nunca se envían por chat ni correo, un problema bloqueante se avisa el mismo día, y todo documento a los docentes lleva el apéndice de declaración de IA.`],

[`<h2>Calidad: especificaciones medibles (ISO/IEC 25010)</h2><table style="font-size:.5em"><tr><th>Atributo</th><th>Cómo se mide</th><th>Mínimo → Meta</th><th>Estado</th></tr><tr><td>Fiabilidad del ETL</td><td>Diferencia de filas y montos (<code>07_reconciliacion.sql</code>)</td><td>0 → 0</td><td><b>Cumple</b> (verificado hoy: 0)</td></tr><tr><td>Adecuación funcional</td><td>% de pruebas e2e en verde (<code>npm run test:e2e</code>)</td><td>100 % → 100 %</td><td><b>Cumple</b>; el documento del 24 oct. decía 49; hoy son 103</td></tr><tr><td>Seguridad: confidencialidad</td><td>Columnas con nombre, DPI o teléfono en el DW</td><td>0 → 0</td><td><b>Cumple</b>: 0 columnas</td></tr><tr><td>Seguridad: autenticación</td><td>% de cuentas que exigen MFA para obtener sesión</td><td>100 % → 100 %</td><td><b>Cumple</b></td></tr><tr><td>Seguridad: trazabilidad</td><td>% de cambios, inicios de sesión y exportaciones en la auditoría</td><td>100 % → 100 %</td><td><b>Cumple</b>; límite: la exportación se registra desde el cliente</td></tr><tr><td>Seguridad: aislamiento</td><td>Intentos de acceso cruzado rechazados</td><td>100 % → 100 %</td><td><b>Cumple</b></td></tr><tr><td>Eficiencia de desempeño</td><td>Segundos de una consulta con ≈12,000 estudios; <code>EXPLAIN</code></td><td>&lt;2 s → &lt;0.5 s</td><td><b>Cumple</b> (13 nov.): ≈11.1 ms y ≈1.6 ms</td></tr><tr><td>Usabilidad</td><td>% de personas que registran un paciente sin ayuda (3 a 5 personas)</td><td>80 % → 95 %</td><td><i>Pendiente de medir</i></td></tr></table><p style="font-size:.62em">La calidad se define <b>contra requisitos documentados</b>. Planificar (ISO 21502 7.11.2) → asegurar (7.11.3: revisión por pares con lista de verificación) → controlar (7.11.4: pruebas, reconciliación, registro de defectos). Mínimos y metas de usabilidad y desempeño son propuestas del grupo.</p>`,
`Definimos la calidad contra requisitos medibles, con las características de ISO 25010: fiabilidad, adecuación funcional, seguridad, eficiencia y usabilidad. Cada una tiene una unidad, cómo se mide, un mínimo, una meta y un estado. Cumplen la fiabilidad del ETL, con diferencia cero; las pruebas, ahora ciento tres, que en el documento del veinticuatro de octubre eran cuarenta y nueve; la confidencialidad, con cero columnas con datos personales; la autenticación, la trazabilidad, el aislamiento y la eficiencia. Y declaramos lo que está pendiente: la usabilidad todavía no se ha medido con personas.`],

[`<h2>Normas y estándares: dónde se aplica cada una en SISG</h2><table style="font-size:.5em"><tr><th>Norma</th><th>Qué es</th><th>Dónde la aplicamos</th></tr>
<tr><td><b>PMBOK 8</b> (PMI, 2025)</td><td>Guía de dirección de proyectos: siete dominios y principios</td><td>Marco del plan de gestión: la calidad como principio en los siete dominios y el ciclo del riesgo</td></tr>
<tr><td><b>ISO 21502:2020</b></td><td>Guía de gestión de proyectos</td><td>Riesgos (7.8: preparar, conducir, comunicar, mantener) y calidad (7.11.2 planificar, 7.11.3 asegurar, 7.11.4 controlar)</td></tr>
<tr><td><b>ISO/IEC 25010:2023</b></td><td>Modelo de calidad del software</td><td>Cuatro características con metas medibles: adecuación funcional, fiabilidad, seguridad y usabilidad (reconciliación en cero, consulta 8 unas 7 veces más rápida, MFA obligatorio)</td></tr>
<tr><td><b>NIST SP 800-30</b> Rev. 1</td><td>Evaluación de riesgos de seguridad</td><td>Riesgos de seguridad: fuente de amenaza, evento, vulnerabilidad e impacto, con el «porque» de cada valor</td></tr>
<tr><td><b>CVSS / CVE (NVD)</b></td><td>Severidad de vulnerabilidades conocidas</td><td>Laboratorio A1-b: CVE vigente del equipo de cada integrante; severidad no es riesgo</td></tr>
<tr><td><b>Scrum Guide 2020</b></td><td>Marco ágil</td><td>Sprints de la aplicación con Sprint Goal, incremento y Definition of Done</td></tr>
<tr><td><b>IEEE</b></td><td>Formato de documentos técnicos</td><td>Plan de gestión con carátula, tablas y figuras en IEEE, y Apéndice A de uso de IA</td></tr>
<tr><td><b>HL7 FHIR</b></td><td>Estándar de interoperabilidad en salud</td><td>La aplicación exporta datos en FHIR (extra técnico, fuera del plan de gestión)</td></tr>
<tr><td><b>ISO/IEC 27001</b></td><td>Gestión de seguridad de la información</td><td><b>No la aplicamos formalmente</b> (sin certificación). Controles propios: MFA, roles por entidad y bitácora de auditoría</td></tr></table>`,
`Estas son las normas y estándares que usamos y dónde se ve cada una en el proyecto. PMBOK 8 es el marco general. ISO 21502 nos da el detalle de riesgos y calidad en la gestión. ISO/IEC 25010 define las características de calidad del producto: evaluamos cuatro, con metas medibles. NIST SP 800-30 estructura los riesgos de seguridad. CVSS mide la severidad de una vulnerabilidad, y distinguimos severidad de riesgo. Scrum organiza los sprints de la aplicación e IEEE define el formato de los documentos. HL7 FHIR es un extra técnico: la aplicación exporta en ese formato. Y una aclaración honesta: no aplicamos ISO 27001 de manera formal ni tenemos certificación; los controles de seguridad son propios.`],

[`<h2>Lecciones aprendidas</h2><div class="cols"><div class="box"><b>Lo que funcionó</b><ul><li>Separar operación de analítica</li><li>Reconciliar fuente vs almacén para confiar en el ETL</li><li>103 pruebas automáticas de extremo a extremo</li></ul></div><div class="box o"><b>Lo que haríamos distinto</b><ul><li>Decidir el motor de base de datos <b>al inicio</b>: la app nació en PostgreSQL y migrar a MySQL obligó a reescribir el SQL hecho a mano</li><li>Las pruebas deben correr sobre <b>una base propia</b>: descubrimos tarde que vaciaban la base de desarrollo; se corrigió fijando la base de pruebas</li></ul></div></div>`,
`Lo que funcionó: separar la operación de la analítica, reconciliar la fuente contra el almacén para confiar en el ETL, y las pruebas automáticas. Lo que haríamos distinto: decidir el motor de base de datos desde el inicio, porque la aplicación nació en PostgreSQL y migrarla a MySQL nos obligó a reescribir SQL. Y las pruebas deben correr en su propia base: descubrimos tarde que apuntaban a la de desarrollo y la vaciaban en cada corrida. Lo corregimos fijando una base de pruebas.`],

[`<h2>Límites y siguientes pasos</h2><div class="cols"><div class="box r"><b>Límites que declaramos</b><ul><li>Datos <b>sintéticos</b>: las cifras no significan nada real</li><li>Costo y duración: <b>valores de lista</b>, no cobros reales</li><li>Presupuesto de campaña: vacío con datos de la app</li><li>ETL de <b>recarga completa</b></li><li>Dimensiones sin historia (SCD tipo 1)</li><li>La app aún no registra costo ni duración</li></ul></div><div class="box"><b>Siguientes pasos</b><ul><li>Carga <b>incremental</b> con marca de agua</li><li>SCD tipo 2 si se requiere historia</li><li>Registrar costo, duración y presupuesto reales en la app</li><li>Si el curso lo pidiera: pasar a SQL Server (tabla de equivalencias en <code>dw/README.md</code>)</li></ul></div></div>`,
`Preferimos decir nosotros los límites. Los datos del almacén son sintéticos, así que las cifras no significan nada real; lo que se evalúa es el diseño, el ETL y las consultas. Costo y duración son valores de lista, porque la app todavía no los registra, y el presupuesto de campaña queda vacío. El ETL es de recarga completa y las dimensiones no guardan historia. Los siguientes pasos serían la carga incremental, historia con SCD tipo 2, y registrar esos montos reales en la aplicación.`],

[`<h2>Cómo se ejecuta todo, paso a paso</h2><div class="cols"><div class="box b"><b>Almacén (carpeta <code>dw/</code>)</b><pre style="font-size:.58em">./run.sh        # MySQL en Docker (puerto 3307)
                # corre sql/01 … 05 en orden
                # genera datos y ejecuta el ETL
./consultas.sh  # ejecuta 06_consultas.sql
./run_app.sh    # alimenta el almacén con la
                # base real de la app
docker compose down -v   # borra todo</pre><p style="font-size:.66em">Orden de los scripts: <code>01</code> esquema fuente · <code>01b</code> catálogos · <code>02</code> datos · <code>03</code> triggers (<b>después</b> de los datos) · <code>04</code> esquema estrella · <code>04b</code> vistas · <code>05</code> ETL · <code>06</code> consultas · <code>07</code> reconciliación.</p></div><div class="box"><b>Aplicación</b><pre style="font-size:.58em">cd backend
cp .env.example .env
docker compose up -d
npm install
npm run start:dev      # API
npm run test:e2e       # 103 pruebas

cd nuevo-diseño
npm install
npm run dev            # http://localhost:8080</pre><p style="font-size:.66em">Necesita <code>JWT_SECRET</code> y <code>MFA_KEY</code>. El almacén usa usuario <code>root</code> solo en local.</p></div></div>`,
`Esto es lo que hay que hacer para reproducir todo. En la carpeta dw, run.sh levanta MySQL en Docker, ejecuta los scripts en orden, genera los datos sintéticos y corre el ETL. Los triggers se crean después de cargar los datos de prueba, para que no frenen la carga. consultas.sh ejecuta las consultas y run_app.sh alimenta el almacén con la base real de la aplicación. Para la aplicación, se copia el archivo de variables, se levanta la base, se instala y se arranca la API y la interfaz. Las claves secretas son obligatorias.`],

[`<h2>Decisiones de diseño: qué elegimos y por qué</h2><table style="font-size:.56em"><tr><th>Decisión</th><th>Alternativa descartada</th><th>Razón</th></tr><tr><td>Dos bases (app y almacén)</td><td>Analizar sobre la base de la app</td><td>El análisis pesado no debe frenar el registro; el ETL necesita origen y destino</td></tr><tr><td>MySQL 8 para todo</td><td>SQL Server</td><td>Decisión del grupo (24 oct.); equivalencias T-SQL documentadas</td></tr><tr><td>Estrella pura</td><td>Copo de nieve</td><td>Menos uniones; dimensiones chicas; jerarquías de 2 niveles</td></tr><tr><td>Llaves sustitutas (<code>*_key</code>)</td><td>Usar los ids de la fuente</td><td>Independencia de otros sistemas; <code>tiempo_key</code> = yyyymmdd es legible</td></tr><tr><td>Fila <code>-1</code> «Desconocido»</td><td>Descartar el hecho</td><td>No perder estudios sin municipio o sin fecha de nacimiento</td></tr><tr><td>Sin datos personales</td><td>Incluir nombre y DPI</td><td>Son datos de salud; el análisis no los necesita</td></tr><tr><td>Resumen <b>sin</b> geografía</td><td>Incluirla</td><td>Con ella casi no reducía (10,106 vs 12,219 filas)</td></tr><tr><td>Recarga completa</td><td>Carga incremental</td><td>Con este volumen basta y es más simple</td></tr><tr><td>SCD tipo 1</td><td>Tipo 2 (historia)</td><td>El ETL recarga todo; no se pidió historia</td></tr><tr><td>Costo y duración de lista</td><td>Costo real cobrado</td><td>La app aún no los registra</td></tr></table>`,
`Resumimos las decisiones de diseño con su alternativa y su razón, para que se vea que cada una fue pensada. Dos bases en lugar de una por rendimiento y por la mecánica del ETL. MySQL por decisión del grupo, con las equivalencias a SQL Server documentadas. Estrella pura por velocidad y simplicidad. Llaves sustitutas para independizar el almacén. La fila de desconocido para no perder hechos. Sin datos personales por ser datos de salud. El resumen sin geografía porque con ella casi no reducía. Recarga completa y cambio tipo uno por simplicidad con este volumen. Y costos de lista porque la aplicación aún no los registra.`],

[`<h2>Glosario</h2><table style="font-size:.56em"><tr><th>Término</th><th>Significado en SISG</th></tr><tr><td><b>OLTP / transaccional</b></td><td>Base para registrar el día a día: la app <code>sisg</code> y <code>sisg_fuente</code></td></tr><tr><td><b>OLAP / analítico</b></td><td>Base para analizar: el almacén <code>sisg_dw</code></td></tr><tr><td><b>ETL</b></td><td>Extraer, transformar y cargar: <code>sp_etl_completo</code></td></tr><tr><td><b>Staging</b></td><td>Zona intermedia <code>sisg_stg</code> con la copia cruda de la app</td></tr><tr><td><b>Normalizar / desnormalizar</b></td><td>Guardar cada dato una vez (fuente) / repetir texto a propósito (estrella)</td></tr><tr><td><b>Hecho</b></td><td>Lo que pasó y se mide: un estudio, una campaña</td></tr><tr><td><b>Dimensión</b></td><td>Contexto para cortar los hechos: tiempo, lugar, entidad, paciente, tipo, edad, área</td></tr><tr><td><b>Grano</b></td><td>Qué representa una fila del hecho</td></tr><tr><td><b>Dimensión conformada</b></td><td>La misma dimensión compartida por varios hechos (tiempo, geografía, entidad)</td></tr><tr><td><b>Llave sustituta</b></td><td>Número propio del almacén (<code>*_key</code>)</td></tr><tr><td><b>Dimensión degenerada</b></td><td>Identificador sin tabla propia (<code>estudio_id</code>, <code>campana_id</code>)</td></tr><tr><td><b>Medida aditiva</b></td><td>Se puede sumar por cualquier dimensión (costo, personas)</td></tr><tr><td><b>SCD tipo 1 / 2</b></td><td>Sobrescribir / guardar historia con vigencia</td></tr><tr><td><b>Sumarización</b></td><td>Tabla resumen precalculada: <code>fact_estudio_mensual</code></td></tr><tr><td><b>Reconciliación</b></td><td>Comparar fuente y almacén en filas y montos (diferencia 0)</td></tr></table>`,
`Cerramos con un glosario de los términos que usamos, cada uno con su significado concreto dentro de SISG, para que no haya ambigüedad. Transaccional y analítico, ETL, staging, normalizar y desnormalizar, hecho, dimensión, grano, dimensión conformada, llave sustituta, dimensión degenerada, medida aditiva, tipos de cambio de dimensión, sumarización y reconciliación.`],

[`<h2>Declaración de uso de IA y cierre</h2><div class="cols"><div><p><b>Entregamos</b></p><ul><li><b>BD II:</b> ER de fuentes, modelo estrella, ETL, consultas con vistas y una aplicación que genera los datos</li><li><b>APT:</b> acta, EDT, cronograma, interesados, comunicaciones, riesgos y calidad</li></ul></div><div class="box o"><b>Uso de inteligencia artificial</b><br>Se usó para código, documentos y esta presentación. El detalle (herramienta, propósito y nivel de modificación) está en <code>docs/gestion/05_apendice_declaracion_ia.md</code>.</div></div><p class="big" style="text-align:center;margin-top:1em">¡Gracias! Quedamos atentos a sus preguntas.</p>`,
`Resumiendo: para Bases de Datos II entregamos el ER de las fuentes, el modelo estrella, el ETL y las consultas con sus vistas, más una aplicación que genera los datos. Para Administración de Proyectos entregamos el plan completo de gestión. Declaramos el uso de inteligencia artificial: se usó para código, documentos y esta presentación, y el detalle está en el apéndice. Gracias, quedamos atentos a sus preguntas.`],

[`<h2>Preguntas sobre metodología y normas</h2><table style="font-size:.52em"><tr><th>Pregunta</th><th>Respuesta</th></tr>
<tr><td>¿Qué metodología usaron?</td><td>Híbrida: predictiva para los entregables fijos (hitos y ruta crítica) y ágil, con Scrum, para construir la aplicación por sprints.</td></tr>
<tr><td>¿Por qué híbrida y no solo ágil?</td><td>Plazo y entregables los fija el curso (28 de noviembre); la aplicación sí evoluciona con un backlog priorizado.</td></tr>
<tr><td>¿Qué ISO usaron?</td><td>ISO 21502 para gestión de proyectos, ISO/IEC 25010 para calidad del producto; PMBOK 8 como marco y NIST SP 800-30 para riesgos de seguridad.</td></tr>
<tr><td>¿Por qué ISO/IEC 25010?</td><td>Define características de calidad que se pueden medir. Elegimos cuatro y les pusimos meta y evidencia.</td></tr>
<tr><td>¿Severidad y riesgo no son lo mismo?</td><td>No. CVSS mide qué tan grave es una vulnerabilidad; el riesgo depende además de la probabilidad y de lo que está expuesto. Un CVE grave en un equipo ya parchado deja un riesgo residual bajo.</td></tr>
<tr><td>¿Cómo gestionan los cambios?</td><td>Los cambios al alcance de los entregables fijos pasan por el líder; los de la aplicación entran al backlog.</td></tr>
<tr><td>¿Tienen certificación de seguridad?</td><td>No. Aplicamos controles propios (MFA, roles, bitácora); ISO/IEC 27001 queda como mejora futura.</td></tr>
<tr><td>¿Por qué IEEE y declaración de IA?</td><td>El curso exige el formato IEEE y declarar el uso de IA en el Apéndice A; sin declaración, la nota máxima baja a 60%.</td></tr></table>`,
`Esta diapositiva reúne las preguntas más probables sobre metodología y normas, con la respuesta corta. Si preguntan por la metodología: híbrida, con una parte predictiva y otra ágil con Scrum. Si preguntan por las ISO: 21502 para la gestión y 25010 para la calidad del producto, con PMBOK 8 como marco. Y si preguntan por seguridad, aclaramos que no tenemos certificación, sino controles propios.`],

[`<h2>Preguntas sobre la integración con el Grupo 8</h2><table style="font-size:.52em"><tr><th>Pregunta</th><th>Respuesta</th></tr>
<tr><td>¿Qué le mandan al Grupo 8?</td><td>Solo un agregado mensual (servicios y monto por mes, establecimiento, ubicación y servicio) en <code>ingesta_g4_servicio</code>. Sin pacientes ni datos personales.</td></tr>
<tr><td>¿Cómo saben que llegó bien?</td><td>Validamos con solo lectura contra sus catálogos: 0 llaves inválidas y 1,908 de 1,908 filas ya en su <code>fact_servicio</code>, sin diferencias de valores.</td></tr>
<tr><td>¿Por qué hay más filas que las suyas en su tablero?</td><td>Hay 10 filas de prueba del Grupo 8 (establecimientos 8 a 10, 2024). Lo propio son 1,908 filas y 52,004 servicios.</td></tr>
<tr><td>¿El ETL es en Python?</td><td>El nuestro es SQL (procedimientos almacenados, <code>sp_etl_completo</code>). El Grupo 8 hizo su portal y su ETL en Python; nos integramos por el buzón.</td></tr>
<tr><td>¿Qué pasa si una llave no existe en su catálogo?</td><td>El trigger rechaza la fila. Por eso validamos antes de enviar.</td></tr>
<tr><td>¿Quién consume lo que enviamos?</td><td>Otros grupos desde su <code>fact_servicio</code>; por ejemplo, las aseguradoras (Grupo 5), según el documento del Grupo 8.</td></tr>

[`<h2>Respuestas rápidas a posibles preguntas</h2><table style="font-size:.66em"><tr><th>Pregunta</th><th>Respuesta</th></tr><tr><td>¿Por qué dos bases?</td><td>Registrar y analizar son trabajos distintos; el ETL necesita origen y destino.</td></tr><tr><td>¿Por qué MySQL y no SQL Server?</td><td>Decisión del grupo (24 oct.); equivalencias T-SQL documentadas.</td></tr><tr><td>¿Estrella o copo?</td><td>Estrella: jerarquías de 2 niveles, dimensiones pequeñas, menos uniones.</td></tr><tr><td>¿Por qué dos hechos?</td><td>Estudio y campaña tienen granos distintos.</td></tr><tr><td>Si desnormalizas, ¿no se desordena?</td><td>Solo el ETL escribe; la integridad está en la fuente.</td></tr><tr><td>¿Cómo saben que el ETL es correcto?</td><td>Reconciliación = 0 y <code>etl_log</code>.</td></tr><tr><td>¿Carga incremental?</td><td>No: recarga completa; incremental es el siguiente paso.</td></tr><tr><td>¿Y si falta municipio o fecha de nacimiento?</td><td>Fila <code>-1</code> Desconocido: no se pierde el hecho.</td></tr><tr><td>¿Datos reales?</td><td>No: sintéticos; costos = precios de lista.</td></tr><tr><td>¿Datos personales en el DW?</td><td>Ninguno identificable: solo sexo y grupo de edad.</td></tr><tr><td>¿Qué mejora lograron?</td><td>Consulta 8 ≈ 1.6 ms vs consulta 1 ≈ 11 ms (~7×).</td></tr></table>`,
`Esta diapositiva queda de respaldo para las preguntas. Cada fila tiene la respuesta corta a las preguntas más probables: por qué dos bases, por qué MySQL, estrella o copo de nieve, por qué dos hechos, si desnormalizar desordena los datos, cómo sabemos que el ETL es correcto, y los límites de los datos.`],
[`<h2>Más preguntas posibles (respuestas cortas)</h2><table style="font-size:.5em"><tr><th>Pregunta</th><th>Respuesta</th></tr><tr><td>¿Cómo generaron los datos?</td><td><code>02_fuente_datos.sql</code> con <code>RAND()</code>: 14 entidades fijas, 6,000 pacientes, 12,507 estudios, 150 campañas. Cada carga cambia las cifras.</td></tr><tr><td>¿Por qué 31 estudios sin grupo de edad?</td><td>Fechas de nacimiento sintéticas posteriores al estudio → edad negativa → <code>-1</code>. No se perdió ningún hecho.</td></tr><tr><td>¿Por qué la consulta 2 devuelve 5 filas en Guatemala?</td><td><code>RANK</code> da el mismo puesto a empates (tres con 149). Para exactamente 3 se usaría <code>ROW_NUMBER</code>.</td></tr><tr><td>¿El panel de impacto usa el almacén?</td><td>No: se calcula en vivo sobre la base de la app. El almacén es para el análisis del curso.</td></tr><tr><td>¿Qué pasa si el ETL falla a la mitad?</td><td>Un <code>EXIT HANDLER</code> marca <code>ERROR</code> con el mensaje en <code>etl_log</code> y relanza el error; se vuelve a ejecutar (recarga completa).</td></tr><tr><td>¿Se puede ejecutar el ETL dos veces?</td><td>Sí: vacía y recarga, y el calendario usa <code>INSERT IGNORE</code>; el resultado es el mismo.</td></tr><tr><td>Un paciente en dos entidades, ¿cuenta una o dos veces?</td><td>Dos: el DPI es único <i>por entidad</i> y cada entidad ve solo a sus pacientes; el almacén no deduplica entre entidades (límite).</td></tr><tr><td>¿Por qué la geografía del estudio es la del paciente?</td><td>Es lo que permite cruzar con campañas por departamento; la ubicación del centro está en <code>dim_entidad</code>.</td></tr><tr><td>¿Qué índices hay en los hechos?</td><td>Las llaves foráneas crean índices (el <code>EXPLAIN</code> usa <code>tipo_estudio_key</code>); la fuente tiene índices por entidad+fecha.</td></tr><tr><td>¿El almacén tiene el costo real cobrado?</td><td>No: con datos de la app es el precio de lista del catálogo; con datos sintéticos, lista ± variación.</td></tr><tr><td>¿Cuánto tarda el ETL?</td><td>Menos de un segundo con 12,507 estudios (según <code>etl_log</code>).</td></tr></table>`,

let i=0;const s=document.getElementById("s"),n=document.getElementById("notes");
function fit(){s.style.fontSize='';const b=parseFloat(getComputedStyle(s).fontSize);
 for(let f=1.7;f>=0.7;f-=0.05){s.style.fontSize=(b*f)+'px';if(s.scrollHeight<=s.clientHeight+1&&s.scrollWidth<=s.clientWidth+1)return}}
window.addEventListener('resize',()=>fit());
function draw(){s.innerHTML=S[i][0]+`<div class="num">${i+1} / ${S.length}</div>`;n.innerHTML="<b>Qué decir:</b> "+S[i][1];
 document.querySelector("#prog i").style.width=((i+1)/S.length*100)+"%";document.getElementById("cnt").textContent=(i+1)+"/"+S.length;location.hash=i+1;fit()}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));draw()}
function tn(){n.classList.toggle("on")}
document.addEventListener("keydown",e=>{if(e.target.id==="q")return;if(["ArrowRight","PageDown"," "].includes(e.key))go(1);else if(["ArrowLeft","PageUp"].includes(e.key))go(-1);
 else if(e.key=="n"||e.key=="N")tn();else if(e.key=="f"||e.key=="F")document.documentElement.requestFullscreen();else if(e.key=="Home"){i=0;draw()}else if(e.key=="End"){i=S.length-1;draw()}});
const h=parseInt(location.hash.slice(1));if(h>0&&h<=S.length)i=h-1;draw();

// Buscador: busca en el texto de cada diapositiva y en el guion. "/" o Ctrl/Cmd+K para abrirlo; Enter va al primer resultado.
(()=>{const q=document.getElementById("q"),res=document.getElementById("res");
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const plain=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ").trim();
const idx=S.map((d,k)=>{const m=d[0].match(/<h[12][^>]*>([\s\S]*?)<\/h[12]>/);const title=plain(m?m[1]:d[0]).slice(0,90);const body=plain(d[0]);return{k,title,body,all:norm(body+" "+plain(d[1]))}});
let sel=0,hits=[];
function find(){const w=norm(q.value).split(/\s+/).filter(x=>x.length>1);if(!w.length){res.style.display="none";hits=[];return}
 hits=idx.filter(d=>w.every(x=>d.all.includes(x))).map(d=>({d,s:w.filter(x=>norm(d.title).includes(x)).length})).sort((a,b)=>b.s-a.s||a.d.k-b.d.k).slice(0,20);sel=0;
 res.innerHTML=hits.length?hits.map((h,n)=>{const t=norm(h.d.body),p=t.indexOf(w[0]),a=Math.max(0,p-40),sn=p<0?h.d.body.slice(0,110):"…"+h.d.body.slice(a,a+120)+"…";return `<div data-k="${h.d.k}" class="${n?"":"on"}"><b>${h.d.k+1}.</b> ${h.d.title}<small>${sn}</small></div>`}).join(""):"<div>Sin resultados</div>";res.style.display="block"}
function ir(k){i=k;draw();res.style.display="none";q.blur()}
q.addEventListener("input",find);
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";res.style.display="none";q.blur()}
 else if(e.key==="Enter"&&hits.length)ir(hits[sel].d.k);
 else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(hits.length-1,sel+(e.key==="ArrowDown"?1:-1)));[...res.children].forEach((c,n)=>c.classList.toggle("on",n===sel));res.children[sel]&&res.children[sel].scrollIntoView({block:"nearest"})}});
res.addEventListener("click",e=>{const c=e.target.closest("[data-k]");if(c)ir(+c.dataset.k)});
document.addEventListener("keydown",e=>{if(e.target===q)return;if(e.key==="/"||(e.key.toLowerCase()==="k"&&(e.metaKey||e.ctrlKey))){e.preventDefault();q.focus();q.select()}},true);
})();
