<script>
// Cada diapositiva: [html, guion]
const S=[
[`<div style="margin-top:7%"><h1 style="font-size:2.6em">SISG</h1><div class="big">Sistema de Información de Salud de Guatemala</div><p>Módulo para centros de diagnóstico y organismos no lucrativos</p><p><b>Grupo 4</b> · Bases de Datos II y Administración de Proyectos Tecnológicos<br>Universidad San Pablo de Guatemala · Entrega: 28 de noviembre de 2026</p></div>`,
`Buenos días. Somos el Grupo 4 y presentamos SISG. Es un solo proyecto que entregamos en dos cursos: en Bases de Datos II mostramos cómo diseñamos y analizamos los datos, y en Administración de Proyectos Tecnológicos mostramos cómo lo planificamos y gestionamos. Primero veremos el problema y los datos, después la aplicación, y al final la gestión.`],

[`<h2>Agenda</h2><div class="cols"><div class="box b"><b>Bases de Datos II</b><ol><li>Problema y alcance</li><li>Arquitectura: dos bases</li><li>ER de las fuentes (normalizado)</li><li>Staging y puente</li><li>Modelo estrella</li><li>ETL</li><li>Consultas y desempeño</li></ol></div><div class="box o"><b>Aplicación y gestión</b><ol start="8"><li>La aplicación, su seguridad e integración con el Grupo 8</li><li>Planificación y cronograma</li><li>Riesgos y calidad</li><li>Lecciones aprendidas</li><li>Límites y siguientes pasos</li><li>Declaración de IA y cierre</li></ol></div></div>`,
`Esta es la ruta. Primero la parte de datos, que es el corazón de Bases de Datos II: de dónde salen los datos, cómo se ordenan y cómo se analizan. Luego la aplicación que los genera y, por último, la gestión del proyecto. Al final dejamos un espacio para preguntas y pusimos las respuestas de las más probables en la última diapositiva.`],

[`<h2>El problema y el alcance</h2><div class="cols"><div><p><b>Hoy:</b> centros de diagnóstico y organizaciones no lucrativas registran pacientes, estudios y campañas <b>cada uno por su lado</b>.</p><p><b>Consecuencia:</b> no pueden medir cuánto ingresan, a cuántas personas llegan, ni cuántos referidos terminan en un estudio.</p></div><div class="box"><b>SISG integra tres datos</b><ul><li>Pacientes</li><li>Estudios diagnósticos</li><li>Campañas de salud</li></ul>en <b>una aplicación</b> (registrar) y <b>un almacén de datos</b> (analizar).</div></div><p class="mut">Plazo fijo: 28 de noviembre de 2026 · Equipo de 3 personas.</p>`,
`El problema es sencillo: cada centro y cada organización anota por su cuenta. Sin integrar esos datos nadie puede responder preguntas básicas como cuánto ingresa un centro, a cuántas personas llegó una campaña o cuántos referidos terminaron en un estudio. SISG junta pacientes, estudios y campañas en una aplicación para registrarlos y en un almacén de datos para analizarlos. El plazo es fijo, el 28 de noviembre, y somos tres personas.`],

[`<h2>Arquitectura: ¿por qué dos bases de datos?</h2><div class="flow"><div class="box b"><b>App</b><br><code>sisg</code><br>transaccional<br>normalizada</div><div class="ar">→</div><div class="box o"><b>Staging</b><br><code>sisg_stg</code><br>CSV sin validar</div><div class="ar">→</div><div class="box"><b>Fuente</b><br><code>sisg_fuente</code><br>limpia, con catálogos y llaves</div><div class="ar">→</div><div class="box p"><b>ETL</b><br><code>sp_etl_completo</code></div><div class="ar">→</div><div class="box r"><b>Almacén</b><br><code>sisg_dw</code><br>estrella</div></div><ul><li><b>Registrar</b> (app) y <b>analizar</b> (almacén) son trabajos distintos: el análisis pesado no debe frenar a quien registra pacientes.</li><li>El ETL necesita un <b>origen</b> y un <b>destino</b>.</li><li>Una base normalizada y una estrella <b>no conviven</b> en el mismo esquema.</li><li>Todo es <b>MySQL 8</b> (decisión del grupo del 24 de octubre); la app y el almacén en contenedores Docker distintos.</li></ul>`,
`Esta es la arquitectura. A la izquierda está la aplicación con su base transaccional, llamada sisg: normalizada y pensada para registrar rápido. A la derecha está el almacén de datos, pensado para consultar rápido. En medio hay una etapa intermedia o staging, donde caen los datos tal como salen de la app, y una base fuente limpia donde ya se aplican catálogos y reglas. El ETL toma la fuente y carga la estrella. Las separamos por tres razones: registrar y analizar son trabajos distintos y no deben competir, el ETL necesita origen y destino, y una base normalizada y una estrella no pueden convivir en el mismo esquema. Todo es MySQL 8.`],

[`<h2>Transaccional (OLTP) · Transformación (ETL) · Analítico (OLAP)</h2><div class="flow" style="font-size:.85em"><div class="box b"><b>Transaccional · OLTP</b><br>la app <code>sisg</code> y <code>sisg_fuente</code></div><div class="ar">→</div><div class="box p"><b>Transformacional · ETL</b><br>extrae, limpia, transforma, carga</div><div class="ar">→</div><div class="box r"><b>Analítico · OLAP</b><br>el almacén <code>sisg_dw</code></div></div><table style="margin-top:.5em"><tr><th></th><th>Transaccional (OLTP)</th><th>Analítico (OLAP / DW)</th></tr><tr><td>Propósito</td><td>Registrar el día a día</td><td>Analizar y decidir</td></tr><tr><td>Operaciones</td><td>Muchas escrituras pequeñas (INSERT, UPDATE)</td><td>Pocas consultas grandes de lectura</td></tr><tr><td>Diseño</td><td><b>Normalizado</b>, muchas tablas</td><td><b>Desnormalizado</b>, estrella</td></tr><tr><td>Datos</td><td>Actuales, un registro a la vez</td><td>Históricos, resumidos por tiempo, lugar, tipo…</td></tr><tr><td>Usuarios</td><td>Operadores y administradores</td><td>Analistas, ministerio, universidades</td></tr><tr><td>En SISG</td><td>Registrar un paciente o un estudio</td><td>¿Cuántos estudios por mes y categoría?</td></tr></table>`,
`Aquí fijamos tres palabras. Transaccional, u OLTP, es el mundo de registrar: la aplicación guarda un paciente o un estudio, son muchas escrituras pequeñas, y por eso la base está normalizada. Analítico, u OLAP, es el mundo de preguntar: pocas consultas grandes de lectura sobre datos históricos, y por eso el almacén está desnormalizado en estrella. Entre los dos está lo transformacional, que es el ETL: extrae de lo transaccional, limpia y transforma, y carga en lo analítico. Esa es la razón de ser de las dos bases: cada una está optimizada para un trabajo distinto.`],

[`<h2>ER de las fuentes (<code>sisg_fuente</code>)</h2><div class="cols"><div><p><b>10 tablas · 13 llaves foráneas</b></p><div class="cols3" style="font-size:.8em"><div class="box b"><b>Catálogos</b><br>departamento<br>municipio<br>tipo_entidad<br>tipo_estudio<br>area_campana</div><div class="box"><b>Entidades de negocio</b><br>entidad<br>paciente<br>estudio<br>campana</div><div class="box o"><b>Auditoría</b><br>bitacora<br>+ triggers</div></div></div><div style="font-size:.85em"><ul><li>Una <b>entidad</b> (centro u ONG) registra pacientes</li><li>Un <b>paciente</b> reside en un municipio → departamento</li><li>Un <b>estudio</b> es de un paciente, de un tipo y lo realiza un centro</li><li>Una <b>campaña</b> la organiza una ONG, de un área, en un lugar</li><li>DPI único por entidad</li></ul></div></div>`,
`Este es el modelo entidad-relación de las fuentes: diez tablas y trece llaves foráneas. Usamos catálogos en lugar de texto libre: departamento, municipio, tipo de entidad, tipo de estudio y área de campaña. Un estudio pertenece a un paciente, a un tipo y a un centro; un paciente vive en un municipio que pertenece a un departamento. Las llaves foráneas garantizan que no exista un estudio sin paciente. Además hay una bitácora de auditoría y triggers que validan estudios y campañas antes de guardarlos. Frente al modelo de la app agregamos costo, duración y presupuesto como medidas.`],

[`<h2>ER en detalle (1/2): catálogos, entidad y paciente</h2><table style="font-size:.62em"><tr><th>Tabla</th><th>Columnas</th><th>Restricciones e índices</th></tr><tr><td><code>departamento</code></td><td>id (PK), nombre</td><td>nombre <b>UNIQUE</b></td></tr><tr><td><code>municipio</code></td><td>id (PK, autoincremental), departamento_id (FK), nombre</td><td><b>UNIQUE (departamento_id, nombre)</b>: no se repite un municipio dentro de su departamento</td></tr><tr><td><code>tipo_entidad</code></td><td>id (PK), nombre</td><td>1 = centro de diagnóstico · 2 = organismo no lucrativo</td></tr><tr><td><code>entidad</code></td><td>id (PK), nombre, tipo_entidad_id (FK), departamento_id (FK, opcional), telefono, correo, creado_en</td><td>correo <b>UNIQUE</b> y obligatorio</td></tr><tr><td><code>paciente</code></td><td>id (PK), entidad_id (FK), nombre_completo, dpi (opcional), fecha_nacimiento (opcional), sexo <b>ENUM</b>(F, M, NE), departamento_id (FK), municipio_id (FK), telefono, estado <b>ENUM</b>(ACTIVO, INACTIVO)</td><td><b>UNIQUE (entidad_id, dpi)</b>: el DPI es único <i>por entidad</i> porque cada entidad solo ve sus pacientes · índice por municipio</td></tr></table><p class="mut" style="font-size:.7em">Diseño llevado a <b>tercera forma normal (3FN)</b>: catálogos en lugar de texto libre, llaves foráneas, UNIQUE, CHECK e índices.</p>`,
`Vamos al detalle del modelo, tabla por tabla. Los catálogos son departamento, municipio, tipo de entidad. El municipio tiene una restricción única sobre departamento y nombre, para que no se repita un municipio dentro de su departamento. En tipo de entidad, el uno es centro de diagnóstico y el dos es organismo no lucrativo; los triggers usan esos números. La entidad tiene correo único y obligatorio. El paciente guarda el sexo como enumerado, y el DPI y la fecha de nacimiento son opcionales, por eso después existen los valores desconocidos en el almacén. El DPI es único por entidad, no global, porque cada entidad solo ve a sus pacientes; es una decisión de la aplicación. Todo el diseño está llevado a tercera forma normal.`],

[`<h2>ER en detalle (2/2): estudios, campañas y bitácora</h2><table style="font-size:.58em"><tr><th>Tabla</th><th>Columnas</th><th>Restricciones e índices</th></tr><tr><td><code>tipo_estudio</code></td><td>id, nombre, categoria, <b>precio_base_q</b> DECIMAL(10,2), <b>duracion_base</b></td><td>nombre UNIQUE · precio y duración <b>de lista</b></td></tr><tr><td><code>estudio</code></td><td>id (BIGINT), entidad_id, paciente_id, tipo_estudio_id (FK), fecha, hora, especialista, sala_equipo, estado ENUM(PROGRAMADO, REALIZADO, CANCELADO), duracion_min, costo_q, resultado (TEXT)</td><td><b>CHECK costo_q ≥ 0</b> (o nulo) · índices (entidad_id, fecha), paciente, tipo · 3 FK</td></tr><tr><td><code>area_campana</code></td><td>id, nombre</td><td>nombre UNIQUE</td></tr><tr><td><code>campana</code></td><td>id, entidad_id, area_id (FK), nombre, departamento_id, municipio_id, ubicacion, fecha_inicio, fecha_fin (opcional), estado ENUM(PROGRAMADA, EN_CURSO, FINALIZADA), personas_atendidas, presupuesto_q (opcional)</td><td><b>CHECK fecha_fin ≥ fecha_inicio</b> · índice (entidad_id, fecha_inicio) · 4 FK</td></tr><tr><td><code>bitacora</code></td><td>id, tabla, registro_id, accion ENUM(INSERT, UPDATE, DELETE), usuario_db, fecha_hora, detalle (JSON)</td><td>índice (tabla, registro_id)</td></tr></table><p class="mut" style="font-size:.7em"><b>Columnas nuevas frente a la app:</b> <code>costo_q</code>, <code>duracion_min</code> y <code>presupuesto_q</code> (las medidas del análisis).</p>`,
`Seguimos con el resto. El tipo de estudio guarda la categoría y el precio y la duración de lista; de ahí salen el costo y la duración cuando la app no los registra. El estudio tiene fecha, estado como enumerado, y un CHECK que impide costos negativos. Tiene índices por entidad y fecha, por paciente y por tipo, para que las uniones y los filtros sean rápidos. La campaña tiene un CHECK que impide que la fecha de fin sea anterior a la de inicio. La bitácora guarda tabla, id del registro, acción, usuario de la base, fecha y un detalle en JSON. Las columnas de costo, duración y presupuesto son nuevas respecto a la aplicación: las agregamos porque son las medidas que queremos analizar.`],

[`<h2>Triggers: reglas de negocio y auditoría en la base</h2><table style="font-size:.66em"><tr><th>Trigger</th><th>Cuándo</th><th>Qué hace</th></tr><tr><td><code>trg_estudio_valida</code></td><td>BEFORE INSERT en <code>estudio</code></td><td>Rechaza si la entidad <b>no es un centro de diagnóstico</b> y si el <b>paciente no pertenece a esa entidad</b></td></tr><tr><td><code>trg_campana_valida</code></td><td>BEFORE INSERT en <code>campana</code></td><td>Rechaza si la entidad <b>no es un organismo no lucrativo</b></td></tr><tr><td><code>trg_estudio_ai</code></td><td>AFTER INSERT en <code>estudio</code></td><td>Escribe en la bitácora: estado y paciente</td></tr><tr><td><code>trg_estudio_au</code></td><td>AFTER UPDATE en <code>estudio</code></td><td>Bitácora: estado anterior y nuevo, y <b>si el resultado fue modificado</b> (sin copiar el resultado médico)</td></tr><tr><td><code>trg_campana_au</code></td><td>AFTER UPDATE en <code>campana</code></td><td>Bitácora: estado y personas atendidas, antes y después</td></tr></table><div class="cols" style="margin-top:.5em;font-size:.8em"><div class="box">Los BEFORE usan <code>SIGNAL SQLSTATE '45000'</code> con un mensaje: <b>el INSERT se cancela</b>.</div><div class="box o"><b>Límite que declaramos:</b> no hay trigger de DELETE, aunque la bitácora admite esa acción.</div></div>`,
`Estos son los triggers. Hay dos de validación, que se ejecutan antes de insertar: uno impide que una entidad que no es centro de diagnóstico registre estudios, y que se registre un estudio de un paciente que no es de esa entidad; el otro impide que algo que no sea un organismo no lucrativo registre campañas. Si la regla no se cumple, usan SIGNAL con el estado cuarenta y cinco mil, que cancela la inserción con un mensaje. Los otros tres son de auditoría y se ejecutan después: dejan en la bitácora quién cambió qué. En la actualización del estudio guardamos si el resultado fue modificado, pero no copiamos el resultado, porque es información médica. Un límite que declaramos: no hay trigger para borrados.`],

[`<h2>Normalizada vs. desnormalizada</h2><div class="cols"><div class="box b"><b>Normalizada · app y fuente</b><p>Cada dato vive <b>una sola vez</b>. Sin repetición ni contradicciones.</p><p>✔ Registrar rápido y sin errores<br>✘ Analizar exige muchas uniones</p><p class="mut">Como una libreta de direcciones: la dirección está en un solo lugar.</p></div><div class="box r"><b>Desnormalizada · estrella</b><p>Se <b>repite texto a propósito</b> (departamento y municipio juntos).</p><p>✔ Menos uniones, consultas rápidas<br>✘ Repetición (controlada)</p><p class="mut">Como una hoja de respuestas: todo ya viene escrito.</p></div></div><p><b>¿Por qué no se desordena?</b> Nadie escribe en el almacén a mano: solo el ETL, que recarga desde la fuente normalizada y con llaves foráneas. La integridad se garantiza <b>en la fuente</b>.</p>`,
`Aquí está la idea central. Normalizar significa guardar cada dato una sola vez, como una libreta de direcciones: es ideal para registrar porque no hay contradicciones. Desnormalizar es repetir texto a propósito, por ejemplo el departamento junto al municipio, para que consultar sea más rápido y con menos uniones. La pregunta natural es: si repites, ¿no se desordena? No, porque en el almacén nadie escribe a mano; solo lo llena el ETL desde una fuente que sí está normalizada y con llaves foráneas. La integridad se garantiza en la fuente.`],

[`<h2>Datos de ejemplo: cómo se generan (<code>02_fuente_datos.sql</code>)</h2><table style="font-size:.56em"><tr><th>Tabla</th><th>Filas</th><th>Cómo se genera</th></tr><tr><td><code>entidad</code></td><td>14</td><td>Fijas: <b>8 centros</b> de diagnóstico (ids 1–8) y <b>6 organismos</b> no lucrativos (ids 9–14), con nombre, departamento y correo de ejemplo</td></tr><tr><td><code>paciente</code></td><td>6,000</td><td>Números 1 a 6000 con una consulta recursiva. Entidad al azar entre las 14. Nombre = nombre + dos apellidos tomados de listas de 12. DPI de 13 dígitos distinto para cada uno. Nacimiento hasta ≈80 años antes de la fecha de carga. Sexo F o M al azar y 2 % «NE». 5 % INACTIVO. Municipio al azar entre los primeros 32; el departamento se deduce del municipio</td></tr><tr><td><code>estudio</code></td><td>12,507</td><td>Solo para pacientes de <b>centros</b>: 6 intentos por paciente con 60 % de probabilidad (0 a 6 estudios). Fecha entre 2025-01-01 y 660 días después. Tipo al azar entre los 10. <b>92 % REALIZADO, 8 % CANCELADO</b> (PROGRAMADO si la fecha fuera futura). Costo = precio de lista × (0.9 a 1.2). Duración = base × (0.8 a 1.2)</td></tr><tr><td><code>campana</code></td><td>150</td><td>Organismos 9 a 14. Área y departamento al azar; municipio al azar <i>de ese departamento</i>. Inicio en 2025–2026, dura 1 a 14 días. Personas atendidas 30 a 499. Presupuesto de Q 5,000 a Q 50,000</td></tr></table><p class="mut" style="font-size:.66em">Todo usa <code>RAND()</code>: cada carga produce cifras distintas (la medición del 11 de noviembre usó otro conjunto). <b>Nada es real.</b> Los triggers se crean <i>después</i> de esta carga.</p>`,
`Esta diapositiva responde cómo se generaron los datos. Son sintéticos y salen del script 02. Los catálogos y las catorce entidades son fijos: ocho centros y seis organismos. Los seis mil pacientes se generan con una consulta recursiva y valores al azar: nombres combinando listas, DPI distinto para cada uno, fecha de nacimiento de hasta unos ochenta años atrás, sexo con un dos por ciento de no especificado y cinco por ciento inactivos. Los estudios se generan solo para pacientes de centros, con cero a seis por paciente, noventa y dos por ciento realizados y el resto cancelados, con el costo y la duración variando alrededor de los valores de lista. Las ciento cincuenta campañas se generan para los organismos. Como todo usa aleatoriedad, cada carga da cifras distintas, y nada de esto es real.`],

[`<h2>Catálogos: el contenido real</h2><div class="cols"><div><table style="font-size:.6em"><tr><th>Tipo de estudio</th><th>Categoría</th><th>Precio Q</th><th>Min</th></tr><tr><td>Rayos X de tórax</td><td>Imagenología</td><td>150</td><td>15</td></tr><tr><td>Ultrasonido abdominal</td><td>Imagenología</td><td>300</td><td>30</td></tr><tr><td>Tomografía computarizada</td><td>Imagenología</td><td>1,800</td><td>45</td></tr><tr><td>Resonancia magnética</td><td>Imagenología</td><td>3,200</td><td>60</td></tr><tr><td>Mamografía</td><td>Imagenología</td><td>450</td><td>25</td></tr><tr><td>Electrocardiograma</td><td>Cardiología</td><td>200</td><td>20</td></tr><tr><td>Ecocardiograma</td><td>Cardiología</td><td>650</td><td>40</td></tr><tr><td>Espirometría</td><td>Neumología</td><td>280</td><td>30</td></tr><tr><td>Hematología completa</td><td>Laboratorio</td><td>90</td><td>10</td></tr><tr><td>Papanicolaou</td><td>Laboratorio</td><td>120</td><td>15</td></tr></table></div><div style="font-size:.74em"><div class="box"><b>4 categorías</b> de estudio: Imagenología, Cardiología, Neumología, Laboratorio.</div><div class="box b" style="margin-top:.4em"><b>4 áreas de campaña:</b> Cardiovascular, Respiratoria, Planificación familiar, Oncológico y otros.</div><div class="box o" style="margin-top:.4em"><b>Geografía:</b> 22 departamentos y <b>339 municipios</b> (el oficial son 340; el catálogo se escribió de memoria y está pendiente de verificar). Es el <b>mismo catálogo</b> que usa la app.</div><div class="box p" style="margin-top:.4em"><b>Tipos de entidad:</b> 1 = centro de diagnóstico · 2 = organismo no lucrativo.</div></div></div>`,
`Estos son los catálogos reales. Diez tipos de estudio, cada uno con su categoría, su precio de lista en quetzales y su duración en minutos; de estos precios y duraciones salen el costo y la duración cuando la aplicación no los registra. Hay cuatro categorías y cuatro áreas de campaña. La geografía tiene veintidós departamentos y trescientos treinta y nueve municipios; es el mismo catálogo de la aplicación, y declaramos que el oficial tiene trescientos cuarenta, así que está pendiente de verificar un municipio.`],

[`<h2>¿Cuántas filas tiene cada tabla?</h2><div class="cols"><div><b>Fuente <code>sisg_fuente</code></b><table style="font-size:.64em"><tr><th>Tabla</th><th>Filas</th></tr><tr><td>departamento</td><td>22</td></tr><tr><td>municipio</td><td>339</td></tr><tr><td>entidad</td><td>14</td></tr><tr><td>paciente</td><td>6,000</td></tr><tr><td>tipo_estudio</td><td>10</td></tr><tr><td>estudio</td><td><b>12,507</b> (11,510 realizados · 997 cancelados)</td></tr><tr><td>campana</td><td><b>150</b></td></tr></table></div><div><b>Almacén <code>sisg_dw</code></b><table style="font-size:.64em"><tr><th>Tabla</th><th>Filas</th></tr><tr><td>dim_tiempo</td><td>1,461 (2024-01-01 a 2027-12-31)</td></tr><tr><td>dim_geografia</td><td>362 = 1 + 339 + 22</td></tr><tr><td>dim_entidad</td><td>14 (8 centros · 6 organismos)</td></tr><tr><td>dim_paciente</td><td>6,000</td></tr><tr><td>dim_grupo_etario</td><td>6</td></tr><tr><td>dim_tipo_estudio · dim_area_campana</td><td>10 · 4</td></tr><tr><td>fact_estudio</td><td><b>12,507</b></td></tr><tr><td>fact_campana</td><td><b>150</b></td></tr><tr><td>fact_estudio_mensual</td><td><b>1,758</b></td></tr></table></div></div><p style="font-size:.7em"><b>Totales:</b> 11,510 estudios realizados que suman <b>Q 8,660,063.70</b> · 150 campañas con <b>40,494 personas</b> atendidas y Q 4,228,573.14 de presupuesto.</p>`,
`Estas son las cantidades reales que medimos en la base. La fuente y el almacén tienen exactamente doce mil quinientos siete estudios y ciento cincuenta campañas, que es lo que verifica la reconciliación. La dimensión de tiempo tiene mil cuatrocientos sesenta y un días, de enero de 2024 a diciembre de 2027. La dimensión de geografía tiene trescientas sesenta y dos filas: la de desconocido, trescientos treinta y nueve municipios y veintidós departamentos. Una corrección: en el documento de diseño aparecía cincuenta y cinco filas para esa dimensión, pero el valor real es trescientos sesenta y dos; el argumento no cambia, sigue siendo una dimensión pequeña frente a los doce mil hechos.`],

[`<h2>Staging y puente: de la app a la fuente</h2><div class="flow" style="font-size:.85em"><div class="box b">App exporta tablas a <b>CSV</b><br>(sin contraseñas)</div><div class="ar">→</div><div class="box o"><code>sisg_stg</code><br>llegan <b>sin validar</b></div><div class="ar">→</div><div class="box"><code>02_mapeo.sql</code><br>limpia contra catálogos</div><div class="ar">→</div><div class="box">Triggers validan<br>→ <code>sisg_fuente</code></div></div><table style="margin-top:.6em"><tr><th>Dato de la app</th><th>Qué se hace</th></tr><tr><td>Departamento/municipio en texto</td><td>Se enlaza al catálogo sin distinguir mayúsculas ni tildes; si no existe, queda vacío y se cuenta</td></tr><tr><td>Tipo de estudio libre</td><td>Si no está en el catálogo → «Sin clasificar»</td></tr><tr><td>Estado libre</td><td><code>realiz…</code>→REALIZADO · <code>cancel…</code>→CANCELADO · otro→PROGRAMADO</td></tr><tr><td>Campaña con fin antes del inicio</td><td>Se descarta (la app no lo valida)</td></tr><tr><td>Costo y duración del estudio</td><td><b>La app no los registra</b>: se usa precio y duración <b>de lista</b> del catálogo</td></tr></table>`,
`El puente lleva los datos de la app al almacén. La app exporta sus tablas a CSV sin contraseñas; caen en una base de staging sin validar, que es como la mesa donde pones las compras antes de guardarlas. Luego un script de mapeo limpia contra los catálogos: por ejemplo llegaba sacatepequez sin tilde y Sacatepéquez con tilde, y ambos se enlazan al mismo departamento. Los tipos de estudio nuevos se agregan como Sin clasificar y los estados libres se convierten a un enumerado. Una cosa que decimos con honestidad: la app todavía no registra costo ni duración, así que usamos el precio y la duración de lista del catálogo; no son montos reales cobrados, y el presupuesto de campaña queda vacío.`],

[`<h2>El mapeo, paso por paso (<code>puente/02_mapeo.sql</code>)</h2><table style="font-size:.62em"><tr><th>#</th><th>Tabla destino</th><th>Regla aplicada</th></tr><tr><td>1</td><td><code>entidad</code></td><td>Tipo de la app <code>CENTRO_DIAGNOSTICO</code> → 1; cualquier otro → 2. Departamento por nombre (<code>LEFT JOIN</code>: si no existe, queda vacío)</td></tr><tr><td>2</td><td><code>paciente</code></td><td>Municipio <b>solo si existe en el catálogo y coincide con el departamento</b>. Estado <code>INACTIVO</code> o <code>BAJA</code> → INACTIVO; lo demás → ACTIVO</td></tr><tr><td>3</td><td><code>paciente</code></td><td>Si solo vino el municipio, el <b>departamento se deduce</b> de él</td></tr><tr><td>4</td><td><code>tipo_estudio</code></td><td>Tipos escritos libremente que no están en el catálogo se agregan como <b>«Sin clasificar»</b>, precio 0 y duración 0</td></tr><tr><td>5</td><td><code>estudio</code></td><td>Estado: <code>%realiz%</code> → REALIZADO, <code>%cancel%</code> → CANCELADO, otro → PROGRAMADO. Costo y duración = <b>precio y duración de lista</b> (vacío si el tipo no está clasificado)</td></tr><tr><td>6</td><td><code>campana</code></td><td>Área: CARDIOVASCULAR → 1, RESPIRATORIA → 2, PLANIFICACION → 3, otra → 4. Fecha de fin anterior al inicio se descarta. Presupuesto vacío</td></tr></table><p class="mut" style="font-size:.7em">Se conservan los <b>ids de la app</b> para rastrear cada fila. Solo se admiten fechas 2024–2027 (rango de <code>dim_tiempo</code>). Al final, el resumen cuenta lo que quedó vacío.</p>`,
`Este es el mapeo del staging a la fuente, en el orden en que corre. Uno: las entidades, con su tipo traducido a uno o dos y su departamento buscado por nombre. Dos: los pacientes; el municipio solo se acepta si existe en el catálogo y coincide con el departamento, y el estado se normaliza. Tres: si solo vino el municipio, el departamento se deduce de él. Cuatro: los tipos de estudio nuevos se agregan como Sin clasificar. Cinco: los estudios, con el estado convertido y con el costo y la duración tomados de la lista del catálogo. Seis: las campañas, con el área traducida a su número y la fecha de fin descartada si es anterior al inicio. Conservamos los ids de la app para poder rastrear cada fila hasta su origen.`],

[`<h2>Modelo estrella: la idea</h2><div class="cols"><div><div class="star" style="grid-template-columns:repeat(3,1fr)"><div class="d">Tiempo<br>¿cuándo?</div><div class="d">Geografía<br>¿dónde?</div><div class="d">Entidad<br>¿qué centro?</div><div class="d">Paciente<br>¿quién?</div><div class="f">HECHO<br>estudio</div><div class="d">Tipo<br>¿qué estudio?</div><div class="d"></div><div class="d">Grupo etario<br>¿qué edad?</div><div class="d"></div></div></div><div><ul><li><b>Hecho:</b> lo que pasó y se puede contar o sumar (un estudio)</li><li><b>Dimensiones:</b> las preguntas con que se corta (cuándo, dónde, quién, qué)</li><li>Tablas planas unidas por <b>llaves sustitutas</b> (<code>*_key</code>)</li><li>Consultas con solo <b>2 a 3 uniones</b></li></ul></div></div>`,
`El modelo estrella tiene al centro una tabla de hechos, que guarda lo que pasó y se puede contar o sumar, y alrededor las dimensiones, que son las preguntas con las que cortamos esos números: cuándo, dónde, quién y qué tipo. Se llama estrella por la forma. Las tablas se unen con llaves sustitutas, que son números propios del almacén, así el almacén no depende de los ids de otros sistemas. Con esto las consultas necesitan solo dos o tres uniones.`],

[`<h2>Constelación: dos hechos que comparten dimensiones</h2><div class="star"><div class="d">dim_tipo_estudio</div><div class="d">dim_grupo_etario</div><div class="d">dim_paciente</div><div class="d">dim_area_campana</div><div class="d"></div><div class="f" style="grid-column:span 2">fact_estudio<br><small>1 fila = 1 estudio</small></div><div class="dc">dim_tiempo<br>dim_geografia<br>dim_entidad<br><small>compartidas</small></div><div class="f" style="grid-column:span 2">fact_campana<br><small>1 fila = 1 campaña</small></div><div class="d"></div></div><ul style="font-size:.85em"><li><b>Dos hechos</b> porque son procesos con <b>granos distintos</b>; mezclarlos en una tabla sería incorrecto.</li><li>Las dimensiones <b>conformadas</b> (tiempo, geografía, entidad) permiten <b>cruzar</b> estudios y campañas por departamento.</li><li><code>dim_tiempo</code> juega <b>dos roles</b> en la campaña: inicio y fin.</li></ul>`,
`Tenemos dos estrellas que comparten dimensiones, lo que se llama una constelación de hechos. fact_estudio tiene una fila por estudio y fact_campana una fila por campaña. Son dos tablas porque son procesos con granos distintos; mezclarlos en una sola tabla daría resultados incorrectos. Tiempo, geografía y entidad son dimensiones conformadas: tienen la misma estructura y las mismas claves en los dos hechos, y por eso podemos cruzar estudios y campañas por departamento sin inventar uniones. Además, el tiempo se usa dos veces en la campaña: inicio y fin.`],

[`<h2>Grano y medidas</h2><table><tr><th>Hecho</th><th>Grano (1 fila =)</th><th>Medida</th><th>¿Cómo se usa?</th></tr><tr><td rowspan=3><code>fact_estudio</code></td><td rowspan=3>un estudio diagnóstico</td><td><code>cantidad</code> (=1)</td><td>aditiva</td></tr><tr><td><code>costo_q</code></td><td>aditiva</td></tr><tr><td><code>duracion_min</code></td><td>se analiza como <b>promedio</b></td></tr><tr><td rowspan=3><code>fact_campana</code></td><td rowspan=3>una campaña de salud</td><td><code>personas_atendidas</code></td><td>aditiva</td></tr><tr><td><code>presupuesto_q</code></td><td>aditiva</td></tr><tr><td><code>duracion_dias</code></td><td><b>promedio</b> (sumarla no tiene sentido)</td></tr></table><p><b>Atributos degenerados</b> (sin dimensión propia): <code>estudio_id</code>, <code>campana_id</code> y <code>estado</code>. Las consultas de ingresos filtran <code>estado = 'REALIZADO'</code>.</p>`,
`Primero definimos el grano, que es qué significa una fila: un estudio en un hecho, una campaña en el otro. Después las medidas. Costo, cantidad, personas atendidas y presupuesto son aditivas: se pueden sumar por cualquier dimensión. Las duraciones se analizan como promedio, porque sumar duraciones entre campañas no tiene sentido. El identificador y el estado viajan en el hecho como atributos degenerados, sin tabla propia, y las consultas de ingresos solo cuentan los estudios realizados.`],

[`<h2>Las siete dimensiones</h2><table><tr><th>Dimensión</th><th>Atributos</th><th>Nota</th></tr><tr><td><code>dim_tiempo</code></td><td>fecha, año, trimestre, mes, día, día de semana, fin de semana</td><td>llave yyyymmdd · 2024–2027</td></tr><tr><td><code>dim_geografia</code></td><td>departamento, municipio</td><td>fila <b>-1</b> = Desconocido</td></tr><tr><td><code>dim_entidad</code></td><td>nombre, tipo de entidad, departamento</td><td>centro u organismo</td></tr><tr><td><code>dim_paciente</code></td><td>sexo</td><td><b>sin nombre ni DPI</b></td></tr><tr><td><code>dim_grupo_etario</code></td><td>0-14, 15-29, 30-44, 45-59, 60+</td><td>edad <b>al día del estudio</b></td></tr><tr><td><code>dim_tipo_estudio</code></td><td>tipo, categoría</td><td>jerarquía tipo → categoría</td></tr><tr><td><code>dim_area_campana</code></td><td>área</td><td>solo campañas</td></tr></table><p class="mut">Matriz: tiempo, geografía y entidad en ambos hechos · paciente, grupo etario y tipo solo en estudios · área solo en campañas.</p>`,
`Estas son las siete dimensiones. Tiempo se genera con un procedimiento y cubre 2024 a 2027. Geografía junta departamento y municipio y tiene una fila especial con clave menos uno para lo desconocido. Entidad distingue centros de organismos. Paciente guarda solo el sexo: no hay nombre ni DPI porque son datos de salud. El grupo etario se calcula con la edad que tenía el paciente el día del estudio. Tipo de estudio tiene la jerarquía tipo y categoría, y área solo se usa en campañas.`],

[`<h2>Matriz de dimensiones conformadas (bus matrix)</h2><table style="font-size:.7em"><tr><th>Dimensión</th><th><code>fact_estudio</code></th><th><code>fact_campana</code></th><th>¿Conformada?</th><th>Papel</th></tr><tr><td><code>dim_tiempo</code></td><td>✔ fecha del estudio</td><td>✔ inicio <b>y</b> fin</td><td><b>Sí</b></td><td>¿cuándo?</td></tr><tr><td><code>dim_geografia</code></td><td>✔ residencia del paciente</td><td>✔ lugar de la campaña</td><td><b>Sí</b></td><td>¿dónde?</td></tr><tr><td><code>dim_entidad</code></td><td>✔ el centro</td><td>✔ el organismo</td><td><b>Sí</b></td><td>¿quién lo hizo?</td></tr><tr><td><code>dim_paciente</code></td><td>✔</td><td>—</td><td>No</td><td>sexo</td></tr><tr><td><code>dim_grupo_etario</code></td><td>✔</td><td>—</td><td>No</td><td>edad el día del estudio</td></tr><tr><td><code>dim_tipo_estudio</code></td><td>✔</td><td>—</td><td>No</td><td>tipo y categoría</td></tr><tr><td><code>dim_area_campana</code></td><td>—</td><td>✔</td><td>No</td><td>área de la campaña</td></tr></table><p style="font-size:.74em">Una dimensión es <b>conformada</b> si tiene la <b>misma estructura y las mismas claves</b> en todos los hechos que la usan. Por eso la consulta 6 puede cruzar estudios y campañas por departamento sin inventar uniones. En <code>fact_estudio</code> la geografía es el <i>lugar de residencia del paciente</i> (no donde está el centro).</p>`,
`Esta es la matriz de dimensiones conformadas, también llamada bus matrix. Las filas son las dimensiones y las columnas son los hechos. Tiempo, geografía y entidad aparecen en los dos hechos con la misma estructura y las mismas claves, así que son conformadas, y eso es lo que nos permite cruzar los dos procesos. Las otras cuatro son propias de un solo hecho. Un detalle que conviene decir: en los estudios la geografía es la residencia del paciente, no la ubicación del centro.`],

[`<h2>La dimensión de tiempo: cómo se genera</h2><div class="cols"><div><pre style="font-size:.55em">CREATE PROCEDURE sp_cargar_dim_tiempo(
  IN p_desde DATE, IN p_hasta DATE)
INSERT IGNORE INTO dim_tiempo (...)
WITH RECURSIVE d AS (
  SELECT p_desde AS f
  UNION ALL
  SELECT f + INTERVAL 1 DAY FROM d
  WHERE f &lt; p_hasta)
SELECT YEAR(f)*10000 + MONTH(f)*100 + DAY(f),
       f, YEAR(f), QUARTER(f), MONTH(f),
       ELT(MONTH(f),'Enero','Febrero',...),
       DAY(f),
       ELT(WEEKDAY(f)+1,'Lunes','Martes',...),
       WEEKDAY(f) &gt;= 5
FROM d;</pre></div><div style="font-size:.76em"><ul><li>Una consulta <b>recursiva</b> crea un día por fila entre las dos fechas.</li><li>Se llama con <code>2024-01-01</code> a <code>2027-12-31</code> → <b>1,461 filas</b> (incluye el 29 de feb. de 2024).</li><li><code>es_fin_semana</code> es verdadero si <code>WEEKDAY ≥ 5</code> (sábado y domingo).</li><li><code>INSERT IGNORE</code>: si se repite la carga, no duplica fechas.</li><li><b>Por eso el rango de fechas del mapeo es 2024–2027</b>: una fecha fuera del calendario no tendría clave.</li></ul></div></div>`,
`La dimensión de tiempo no viene de ninguna tabla de la fuente: la genera un procedimiento con una consulta recursiva que crea un día por fila entre dos fechas. Se carga de enero de 2024 a diciembre de 2027, que son mil cuatrocientos sesenta y un días. Para cada día calcula año, trimestre, mes con su nombre, día, nombre del día de la semana y si es fin de semana. Usa INSERT IGNORE para no duplicar si se repite la carga. Y de ahí viene la restricción del mapeo: solo se admiten fechas entre 2024 y 2027, porque una fecha fuera del calendario no tendría clave en la dimensión.`],

tiempo_inicio_key  INT  FK → dim_tiempo

presupuesto_q      DECIMAL(12,2)  nulo
duracion_dias      SMALLINT</pre></div></div><ul style="font-size:.78em"><li><code>fact_estudio</code> tiene <b>6 llaves foráneas</b> y <code>fact_campana</code> <b>5</b> (una por cada dimensión; el tiempo cuenta dos veces: inicio y fin).</li><li><code>fact_estudio_mensual</code>: llave primaria compuesta <b>(año, mes, entidad_key, tipo_estudio_key)</b> con <code>total_estudios</code>, <code>ingresos_q</code> y <code>duracion_prom_min</code>.</li></ul>`,
`Aquí están las tablas de hechos columna por columna. fact_estudio tiene como llave primaria el id del estudio, que es la dimensión degenerada, seis llaves foráneas a las seis dimensiones, el estado, la cantidad que siempre es uno, el costo y la duración. fact_campana tiene dos llaves de tiempo, inicio y fin, y la de fin puede ser nula porque una campaña puede no tener fin. Las llaves foráneas obligan a que cada hecho apunte a una dimensión que existe; por eso el ETL necesita la fila de desconocido. La tabla de resumen tiene una llave compuesta de año, mes, entidad y tipo de estudio, que es exactamente su grano.`],

[`<h2>Las dimensiones: columnas y casos especiales</h2><table style="font-size:.58em"><tr><th>Dimensión</th><th>Llave sustituta</th><th>Llave de negocio</th><th>Atributos</th></tr><tr><td><code>dim_tiempo</code></td><td>tiempo_key INT = <b>yyyymmdd</b></td><td>fecha (UNIQUE)</td><td>anio, trimestre, mes, nombre_mes, dia, dia_semana, es_fin_semana</td></tr><tr><td><code>dim_geografia</code></td><td>geo_key (autoincremental)</td><td>departamento_id, municipio_id</td><td>departamento, municipio · índices por municipio y departamento</td></tr><tr><td><code>dim_entidad</code></td><td>entidad_key</td><td>entidad_id (UNIQUE)</td><td>nombre, tipo_entidad, departamento</td></tr><tr><td><code>dim_paciente</code></td><td>paciente_key</td><td>paciente_id (UNIQUE)</td><td>sexo (sin nombre, DPI ni teléfono)</td></tr><tr><td><code>dim_grupo_etario</code></td><td>grupo_etario_key</td><td>—</td><td>etiqueta, edad_min, edad_max</td></tr><tr><td><code>dim_tipo_estudio</code></td><td>tipo_estudio_key</td><td>tipo_estudio_id (UNIQUE)</td><td>tipo_estudio, categoria</td></tr><tr><td><code>dim_area_campana</code></td><td>area_key</td><td>area_id (UNIQUE)</td><td>area</td></tr></table><div class="cols" style="margin-top:.5em;font-size:.68em"><div class="box"><b>dim_geografia contiene 3 clases de fila</b><br>① <code>-1</code> «Desconocido»<br>② una por <b>municipio</b> (con su departamento)<br>③ una por <b>departamento</b> con «(Sin municipio)», para campañas sin municipio</div><div class="box o"><b>dim_grupo_etario (fija)</b><br><code>-1</code> Sin dato · <code>1</code> 0-14 · <code>2</code> 15-29 · <code>3</code> 30-44 · <code>4</code> 45-59 · <code>5</code> 60+ (hasta 130)</div></div>`,
`Cada dimensión tiene dos llaves: la sustituta, que es la que usan los hechos, y la de negocio, que es el id original en la fuente y está marcada como única; así el ETL siempre puede traducir de una a otra. La dimensión de tiempo usa como llave el número año-mes-día, por ejemplo el 14 de marzo de 2026 se guarda como 20260314. La geografía tiene tres clases de filas: el desconocido con clave menos uno, una fila por municipio con su departamento, y una fila por departamento marcada sin municipio, que sirve para las campañas que se hicieron en un departamento sin precisar el municipio. El grupo etario es una tabla fija con seis filas, incluida la de sin dato.`],

[`<h2>¿Estrella o copo de nieve?</h2><p class="big">Decisión: estrella.</p><table><tr><th>Criterio</th><th>En SISG</th></tr><tr><td>Velocidad</td><td>2–3 uniones en estrella; 4–5 en copo de nieve</td></tr><tr><td>Usuarios de negocio</td><td>Ministerio, aseguradoras y universidades consultan indicadores; tablas planas se entienden mejor</td></tr><tr><td>Jerarquías</td><td>Solo 2 niveles (municipio→departamento, tipo→categoría)</td></tr><tr><td>Ahorro de espacio</td><td><code>dim_geografia</code> = 362 filas, <code>dim_tipo_estudio</code> = 10: normalizar casi no ahorra espacio</td></tr><tr><td>Integridad</td><td>Se resuelve en la fuente con catálogos y llaves foráneas</td></tr></table><p class="mut">Regla de la clase 12: «empieza siempre en estrella». Si creciera, el candidato a copo es <code>dim_geografia</code>.</p>`,
`Elegimos estrella y no copo de nieve por criterios concretos. Es más rápida porque necesita menos uniones. Los usuarios de negocio entienden tablas planas. Nuestras jerarquías son de solo dos niveles. Y normalizar dimensiones de trescientas sesenta y dos o diez filas no ahorra espacio, solo agrega uniones. La integridad ya se resolvió en la fuente con catálogos y llaves foráneas. Seguimos la regla de la clase de empezar siempre en estrella, y si la geografía creciera, esa sería la primera dimensión que pasaríamos a copo de nieve.`],

[`<h2>Desnormalizar en la práctica</h2><p>Misma pregunta: <b>«¿estudios por departamento y categoría?»</b></p><div class="cols"><div><b>Fuente (normalizada): 4 uniones</b><pre>FROM estudio e
JOIN paciente p     ON p.id = e.paciente_id
JOIN municipio m    ON m.id = p.municipio_id
JOIN departamento d ON d.id = m.departamento_id
JOIN tipo_estudio t ON t.id = e.tipo_estudio_id</pre></div><div><b>Estrella: 2 uniones</b><pre>FROM fact_estudio f
JOIN dim_geografia g
  ON g.geo_key = f.geo_key
JOIN dim_tipo_estudio t
  ON t.tipo_estudio_key = f.tipo_estudio_key</pre></div></div><p><code>dim_geografia</code> trae <code>departamento</code> y <code>municipio</code> como columnas: <b>eso es desnormalizar</b>.</p>`,
`Para que se vea claro, la misma pregunta, estudios por departamento y categoría. En la base normalizada hay que pasar del estudio al paciente, del paciente al municipio, del municipio al departamento y del estudio al tipo: cuatro uniones. En la estrella, la geografía ya trae departamento y municipio en la misma fila, así que bastan dos uniones. Esa es la ganancia de desnormalizar.`],

[`<h2>ETL: Extraer · Transformar · Cargar</h2><table><tr><th>Paso</th><th>Procedimiento</th><th>Qué hace</th></tr><tr><td>0</td><td><code>sp_etl_completo</code></td><td>Orquesta todo y registra en <code>etl_log</code> (inicio, fin, filas, estado)</td></tr><tr><td>1</td><td><code>sp_cargar_dim_tiempo</code></td><td>Genera el calendario 2024–2027; <code>tiempo_key</code> = yyyymmdd</td></tr><tr><td>2</td><td><code>sp_etl_dimensiones</code></td><td>Vacía y llena dimensiones: geografía (con -1), entidad, paciente, tipo, área</td></tr><tr><td>3</td><td><code>sp_etl_facts</code></td><td>Cada estudio/campaña → fila de hechos: fecha→<code>tiempo_key</code>, ids→claves sustitutas, <b>edad a la fecha del estudio → grupo etario</b></td></tr><tr><td>4</td><td><code>sp_etl_resumen</code></td><td>Llena <code>fact_estudio_mensual</code> (mes × centro × tipo)</td></tr></table><div class="box o" style="margin-top:.5em"><b>Geografía:</b> primero el municipio; si no hay, el departamento; si tampoco, <code>-1</code>. Así <b>no se pierde ningún hecho</b>.</div>`,
`El ETL se hace con procedimientos almacenados. El principal, sp_etl_completo, llama a los demás en orden y deja una fila en etl_log con inicio, fin, filas y estado. Primero genera el calendario, luego vacía y llena las dimensiones, luego convierte cada estudio y campaña en una fila de hechos: la fecha pasa a una clave numérica, los ids pasan a claves sustitutas y se calcula la edad al día del estudio para ubicarlo en un grupo etario. Para la geografía se busca primero el municipio, luego el departamento, y si no hay nada, la fila de desconocido; así ningún hecho se pierde. Por último se llena la tabla resumen mensual.`],

[`<h2>Un estudio de punta a punta (ejemplo ilustrativo)</h2><table style="font-size:.62em"><tr><th>Etapa</th><th>Cómo se ve el mismo estudio</th></tr><tr><td><b>1. App</b> <code>sisg</code></td><td>paciente 17 · departamento <code>"sacatepequez"</code> · municipio <code>"antigua guatemala"</code> · nació 1990-05-02 · estudio: tipo <code>"rayos x"</code>, estado <code>"Realizado "</code>, fecha 2026-03-14</td></tr><tr><td><b>2. Staging</b> <code>sisg_stg</code></td><td>exactamente lo mismo, copiado del CSV: <b>sigue sucio</b></td></tr><tr><td><b>3. Fuente</b> <code>sisg_fuente</code></td><td>municipio_id y departamento_id del catálogo («Antigua Guatemala», «Sacatepéquez») · tipo_estudio_id · estado = <b>REALIZADO</b> · costo y duración = valores de lista</td></tr><tr><td><b>4. ETL</b></td><td>fecha → <code>tiempo_key = 20260314</code> · municipio → <code>geo_key</code> · edad a esa fecha = <b>35</b> → grupo <b>30-44</b> · tipo → <code>tipo_estudio_key</code></td></tr><tr><td><b>5. Estrella</b> <code>fact_estudio</code></td><td>una fila con 6 llaves + estado + cantidad 1 + costo + duración. En <code>dim_geografia</code>: «Sacatepéquez · Antigua Guatemala» <b>en una sola fila</b>. Sin nombre ni DPI</td></tr><tr><td><b>6. Consulta</b></td><td>cuenta en «estudios del mes de marzo 2026, categoría X» y en «grupo 30-44»</td></tr></table><p class="mut" style="font-size:.66em">Los números (paciente 17, edad 35) son <b>inventados para ilustrar</b>; los nombres de tablas y reglas son los reales.</p>`,
`Para unir todo, sigamos un solo estudio de punta a punta. Aclaramos que los números del ejemplo son inventados para ilustrar, pero las tablas y las reglas son las reales. En la aplicación llega con el departamento escrito sin tilde, el tipo de estudio como texto libre y el estado con un espacio sobrante. En el staging se copia igual, todavía sucio. En la fuente ya está limpio: los textos son ids del catálogo y el estado es un enumerado. En el ETL la fecha se vuelve una clave numérica, la edad a esa fecha, treinta y cinco años, lo ubica en el grupo treinta a cuarenta y cuatro, y la geografía se resuelve. En la estrella queda una fila de hechos con seis llaves y sin ningún dato personal. Y ya puede contarse en cualquier consulta.`],

[`<h2><code>sp_etl_dimensiones</code>: paso a paso</h2><div class="cols"><div><pre style="font-size:.55em">SET FOREIGN_KEY_CHECKS = 0;
TRUNCATE fact_estudio; TRUNCATE fact_campana;
TRUNCATE fact_estudio_mensual;
TRUNCATE dim_geografia; TRUNCATE dim_entidad;
TRUNCATE dim_paciente; TRUNCATE dim_tipo_estudio;
TRUNCATE dim_area_campana;
SET FOREIGN_KEY_CHECKS = 1;

-- geografía: tres clases de fila
INSERT ... VALUES (-1,NULL,NULL,'Desconocido','Desconocido');
INSERT ... SELECT m.departamento_id, m.id, d.nombre, m.nombre
  FROM municipio m JOIN departamento d ...;
INSERT ... SELECT d.id, NULL, d.nombre, '(Sin municipio)'
  FROM departamento d;</pre></div><div><ol style="font-size:.74em"><li><b>Vacía</b> primero los hechos y luego las dimensiones (por eso <code>FOREIGN_KEY_CHECKS = 0</code> durante el vaciado)</li><li><b>Geografía:</b> -1, una fila por municipio, una por departamento</li><li><b>Entidad:</b> une con <code>tipo_entidad</code> y departamento; sin departamento → «Desconocido»</li><li><b>Paciente:</b> copia <b>solo</b> <code>id</code> y <code>sexo</code></li><li><b>Tipo de estudio</b> y <b>área:</b> copia directa de los catálogos</li></ol><p class="mut" style="font-size:.7em"><code>dim_tiempo</code> y <code>dim_grupo_etario</code> no se vacían aquí: el tiempo lo genera <code>sp_cargar_dim_tiempo</code> y el grupo etario es fija.</p></div></div>`,
`Este es el primer procedimiento de carga, el de dimensiones. Primero vacía las tablas: los hechos antes que las dimensiones, y por eso se desactivan temporalmente las llaves foráneas durante el vaciado, y se reactivan al terminar. Luego carga la geografía con sus tres clases de filas. La entidad une con el tipo de entidad y el departamento, y si no tiene departamento queda como Desconocido. Del paciente copia únicamente el id y el sexo: ahí está la decisión de privacidad. Tipo de estudio y área se copian tal cual de los catálogos. El calendario y el grupo etario no se tocan aquí.`],

[`<h2><code>sp_etl_facts</code>: cómo se arma cada fila de hechos</h2><pre style="font-size:.52em">INSERT INTO fact_estudio (...)
SELECT s.id,
       YEAR(s.fecha)*10000 + MONTH(s.fecha)*100 + DAY(s.fecha),      -- tiempo_key
       de.entidad_key,
       COALESCE(dg.geo_key, dd.geo_key, -1),                          -- municipio, si no departamento, si no -1
       dp.paciente_key, dt.tipo_estudio_key,
       COALESCE(ge.grupo_etario_key, -1),                             -- sin fecha de nacimiento → -1
       s.estado, 1, s.costo_q, s.duracion_min
FROM sisg_fuente.estudio s
JOIN sisg_fuente.paciente p ON p.id = s.paciente_id
JOIN dim_entidad de ON de.entidad_id = s.entidad_id   JOIN dim_paciente dp ON ...   JOIN dim_tipo_estudio dt ON ...
LEFT JOIN dim_geografia dg ON dg.municipio_id = p.municipio_id
LEFT JOIN dim_geografia dd ON dd.departamento_id = p.departamento_id AND dd.municipio_id IS NULL
LEFT JOIN dim_grupo_etario ge ON p.fecha_nacimiento IS NOT NULL
      AND TIMESTAMPDIFF(YEAR, p.fecha_nacimiento, s.fecha) BETWEEN ge.edad_min AND ge.edad_max;</pre><ul style="font-size:.7em"><li><b><code>JOIN</code></b> a entidad, paciente y tipo: siempre existen (llaves foráneas). <b><code>LEFT JOIN</code></b> a geografía y grupo etario: pueden faltar, y <b>no se debe perder el estudio</b>.</li><li><b>Campañas:</b> misma idea; <code>duracion_dias = DATEDIFF(fin, inicio) + 1</code> (si no hay fin, 1 día) y <code>tiempo_fin_key</code> queda nulo si no hay fecha de fin.</li></ul>`,
`Aquí se ve cómo se arma cada fila de hechos, que es el corazón del ETL. La fecha se convierte en la clave numérica sumando año por diez mil, mes por cien y día. La geografía usa COALESCE: primero el municipio del paciente, si no, el departamento, y si tampoco, menos uno. El grupo etario se calcula con la edad cumplida a la fecha del estudio y se busca en qué rango cae; si no hay fecha de nacimiento, menos uno. Hay una razón por la que unas uniones son JOIN y otras LEFT JOIN: entidad, paciente y tipo siempre existen por las llaves foráneas, pero la geografía y la edad pueden faltar, y con LEFT JOIN el estudio no se pierde. En campañas, la duración en días es la diferencia entre fin e inicio más uno, y si no hay fecha de fin se cuenta un día.`],

[`<h2>Control del ETL: errores, bitácora y reconciliación</h2><div class="cols"><div class="box p" style="font-size:.78em"><b><code>sp_etl_completo</code> en orden</b><ol><li>Inserta en <code>etl_log</code> con estado <b>EN_CURSO</b></li><li>Carga el calendario (2024-01-01 a 2027-12-31)</li><li><code>sp_etl_dimensiones</code></li><li><code>sp_etl_facts</code></li><li><code>sp_etl_resumen</code> (solo estudios <b>REALIZADOS</b>)</li><li>Cierra el log: <b>OK</b> con fin y filas cargadas de cada tabla</li></ol><b>Si algo falla:</b> un <code>EXIT HANDLER</code> marca el log como <b>ERROR</b>, guarda el mensaje y relanza el error (<code>RESIGNAL</code>).</div><div><b>Reconciliación (<code>07_reconciliacion.sql</code>)</b><table style="font-size:.66em"><tr><th>Control</th><th>Diferencia de filas</th><th>Diferencia de monto</th></tr><tr><td>estudios</td><td>fuente − hechos</td><td>suma de costos REALIZADOS</td></tr><tr><td>campañas</td><td>fuente − hechos</td><td>suma de personas atendidas</td></tr><tr><td>resumen mensual</td><td>—</td><td>ingresos del resumen − costos REALIZADOS del hecho</td></tr></table><p class="big" style="font-size:.95em">Cualquier diferencia ≠ 0 es un defecto.</p></div></div>`,
`Así controlamos el ETL. El procedimiento principal abre una fila en el log como en curso, ejecuta los pasos en orden y al final la cierra como OK con las filas cargadas. Si algo falla, un manejador de errores marca el log como ERROR con el mensaje y relanza el error, así nunca queda una carga a medias sin registro. Para la reconciliación hay tres controles. En estudios, comparamos la cantidad de filas y la suma de costos de los realizados entre la fuente y el almacén. En campañas, filas y personas atendidas. Y en el resumen mensual verificamos que la suma de ingresos coincida con la del hecho. La regla es que cualquier diferencia distinta de cero es un defecto.`],

[`<h2>Resultado real de la última carga</h2><div class="cols"><div><b><code>etl_log</code></b> (consultado en la base)<table style="font-size:.6em"><tr><th>Campo</th><th>Valor</th></tr><tr><td>id</td><td>1</td></tr><tr><td>inicio</td><td>2026-11-14 02:06:31</td></tr><tr><td>fin</td><td>2026-11-14 02:06:31 (menos de 1 segundo)</td></tr><tr><td>filas_estudio</td><td>12,507</td></tr><tr><td>filas_campana</td><td>150</td></tr><tr><td>filas_resumen</td><td>1,758</td></tr><tr><td>resultado</td><td><b>OK</b></td></tr><tr><td>mensaje</td><td>NULL (sin error)</td></tr></table></div><div><b>Reconciliación ejecutada</b><table style="font-size:.6em"><tr><th>Control</th><th>Dif. filas</th><th>Dif. monto</th></tr><tr><td>estudios (costo de realizados)</td><td><b>0</b></td><td><b>0.00</b></td></tr><tr><td>campañas (personas atendidas)</td><td><b>0</b></td><td><b>0.00</b></td></tr><tr><td>resumen mensual (ingresos)</td><td>—</td><td><b>0.00</b></td></tr></table><p style="font-size:.7em">Además, las consultas 1 y 8 devuelven <b>exactamente las mismas 88 filas</b> (probado con <code>EXCEPT</code> en ambos sentidos: 0 diferencias): la tabla resumen no pierde información.</p></div></div>`,
`Esto no es lo que dice un documento: son los valores que consultamos en la base. La tabla de bitácora del ETL tiene una corrida, que empezó y terminó el mismo segundo, con resultado OK y sin mensaje de error, y cargó doce mil quinientos siete estudios, ciento cincuenta campañas y mil setecientas cincuenta y ocho filas de resumen. Ejecutamos la reconciliación y los tres controles dan cero en filas y en montos. Además comprobamos que las consultas uno y ocho devuelven exactamente las mismas ochenta y ocho filas, usando EXCEPT en los dos sentidos, o sea que la tabla de resumen no pierde información.`],

[`<h2>Hallazgo: 31 estudios con edad «Sin dato»</h2><div class="cols"><div class="box o"><b>Qué pasó</b><p>En <code>fact_estudio</code> hay <b>31 estudios</b> con <code>grupo_etario_key = -1</code> («Sin dato»). Ningún paciente tiene la fecha de nacimiento vacía.</p><b>Por qué</b><p>La fecha de nacimiento sintética se generó restando días a la <i>fecha de carga</i>, pero los estudios empiezan en 2025. Algunos pacientes «nacieron» <b>después</b> del estudio: la edad sale <b>negativa</b> y no cae en ningún rango (0–14, 15–29…).</p></div><div class="box"><b>Qué demuestra</b><ul><li>La fila <code>-1</code> hizo su trabajo: <b>no se perdió ningún hecho</b> (12,507 de 12,507).</li><li>Es un efecto de los <b>datos sintéticos</b>, no de la lógica del ETL.</li><li>Se ve en la consulta 4 como «Sin dato».</li></ul><b>Distribución por grupo</b><br><span style="font-size:.78em">0-14: 2,375 · 15-29: 2,262 · 30-44: 2,376 · 45-59: 2,418 · 60+: 3,045 · Sin dato: 31</span></div></div>`,
`Un hallazgo que preferimos presentar nosotros. Hay treinta y un estudios cuyo grupo etario es sin dato, aunque ningún paciente tiene la fecha de nacimiento vacía. La causa está en los datos sintéticos: la fecha de nacimiento se generó restando días a la fecha de carga, pero los estudios empiezan en 2025, así que a algunos pacientes les toca un estudio anterior a su nacimiento; la edad sale negativa y no cae en ningún rango. Lo bueno es que muestra que la fila de desconocido funciona: no se pierde ningún hecho, los doce mil quinientos siete llegaron. Con datos reales esto no ocurriría.`],

[`<h2>ETL: cómo sabemos que es correcto</h2><div class="cols3"><div class="box"><b>Reconciliación</b><br>Compara filas y montos entre fuente y almacén.<br><span class="big">Diferencia = 0</span></div><div class="box b"><b>Bitácora <code>etl_log</code></b><br>Cada corrida: inicio, fin, filas, estado.</div><div class="box o"><b>Última carga</b><br>12,507 estudios<br>150 campañas<br>1,758 filas de resumen</div></div><div class="cols" style="margin-top:.6em"><div class="box p"><b>Decisión: recarga completa</b><br>Borra y vuelve a cargar. Con este volumen basta. <b>Producción:</b> carga incremental con marca de agua (última fecha cargada) en <code>etl_log</code>.</div><div class="box r"><b>Cambios en dimensiones: SCD tipo 1</b><br>Se sobrescribe; no hay historia. Para historia: tipo 2 (fila nueva con vigencia).</div></div>`,
`Para confiar en el ETL hacemos una reconciliación: comparamos filas y montos entre la fuente y el almacén y la diferencia es cero. Además cada corrida queda en etl_log. La última carga fue de 12,507 estudios, 150 campañas y 1,758 filas de resumen. Dos decisiones que declaramos: la carga es completa, borra y vuelve a cargar, y con este volumen basta; en producción haríamos incremental con una marca de agua. Y las dimensiones usan cambio tipo 1, sobrescribir, así que no guardamos historia de cambios; para eso habría que pasar a tipo 2.`],

[`<h2>Consultas y vistas</h2><p>8 consultas analíticas, cada una con su vista <code>v_*</code> (<code>SELECT * FROM v_estudios_mes_categoria;</code>)</p><table><tr><th>#</th><th>Pregunta</th><th>Técnica</th></tr><tr><td>1</td><td>Estudios e ingresos por mes y categoría</td><td>hecho + 2 dimensiones</td></tr><tr><td>2</td><td>Los 3 estudios más frecuentes por departamento</td><td><code>RANK</code></td></tr><tr><td>3</td><td>Ingresos por centro y trimestre con acumulado anual</td><td><code>SUM OVER</code></td></tr><tr><td>4</td><td>Perfil de pacientes por categoría, sexo y edad</td><td>agrupación</td></tr><tr><td>5</td><td>Personas atendidas y costo por persona por área</td><td>campañas</td></tr><tr><td>6</td><td>Estudios y campañas por departamento</td><td><b>dimensión conformada</b></td></tr><tr><td>7</td><td>Crecimiento mensual de estudios</td><td><code>LAG</code></td></tr><tr><td>8</td><td>Igual que la 1, sobre la tabla resumen</td><td>sumarización</td></tr></table><p class="mut">Rol <code>analista</code>: solo lectura.</p>`,
`Sobre la estrella escribimos ocho consultas analíticas y cada una tiene su vista. Usan agrupaciones y funciones de ventana: RANK para el top tres por departamento, SUM OVER para acumulados y LAG para el crecimiento mensual. La consulta seis cruza los dos hechos por departamento, que es posible justamente por la dimensión conformada. La consulta ocho responde lo mismo que la uno pero sobre la tabla resumen. Para consultar, existe un rol analista de solo lectura.`],

[`<h2>Consultas 1 y 8: la misma pregunta, dos caminos</h2><p style="font-size:.8em"><b>Pregunta:</b> ¿cuántos estudios realizados e ingresos hay por mes y categoría?</p><div class="cols"><div><b>Consulta 1 · sobre el hecho</b><pre style="font-size:.55em">SELECT t.anio, t.mes, te.categoria,
       COUNT(*) AS estudios,
       SUM(f.costo_q) AS ingresos_q
FROM fact_estudio f
JOIN dim_tiempo t ON t.tiempo_key = f.tiempo_key
JOIN dim_tipo_estudio te
  ON te.tipo_estudio_key = f.tipo_estudio_key
WHERE f.estado = 'REALIZADO'
GROUP BY t.anio, t.mes, te.categoria
ORDER BY t.anio, t.mes, ingresos_q DESC;</pre></div><div><b>Consulta 8 · sobre el resumen</b><pre style="font-size:.55em">SELECT m.anio, m.mes, te.categoria,
       SUM(m.total_estudios) AS estudios,
       SUM(m.ingresos_q) AS ingresos_q
FROM fact_estudio_mensual m
JOIN dim_tipo_estudio te
  ON te.tipo_estudio_key = m.tipo_estudio_key
GROUP BY m.anio, m.mes, te.categoria
ORDER BY m.anio, m.mes, ingresos_q DESC;</pre></div></div><ul style="font-size:.72em"><li>La 8 lee <b>1,758 filas ya agrupadas</b> (no 12,507), hace <b>1 unión</b> (no 2) y <b>no filtra por estado</b>: el resumen ya contiene solo los REALIZADOS.</li><li>El año y el mes ya vienen en la tabla, así que no necesita <code>dim_tiempo</code>.</li></ul>`,
`Para entender la mejora, comparemos las dos consultas lado a lado. Responden exactamente la misma pregunta: estudios e ingresos por mes y categoría. La uno parte del hecho, une con tiempo y con tipo de estudio, y filtra los realizados. La ocho parte de la tabla de resumen, que ya viene agrupada por año y mes, así que no necesita la dimensión de tiempo, y como el resumen ya incluye solo los realizados, tampoco filtra. Lee mil setecientas cincuenta y ocho filas en vez de doce mil quinientas y hace una unión en vez de dos. Esa es la explicación de por qué es unas siete veces más rápida.`],

[`<h2>Consultas 2 y 3: funciones de ventana</h2><div class="cols"><div><b>2 · Los 3 estudios más frecuentes por departamento</b><pre style="font-size:.52em">SELECT departamento, tipo_estudio, estudios, posicion
FROM (
  SELECT g.departamento, te.tipo_estudio, COUNT(*) AS estudios,
    RANK() OVER (PARTITION BY g.departamento
                 ORDER BY COUNT(*) DESC) AS posicion
  FROM fact_estudio f
  JOIN dim_geografia g ON g.geo_key = f.geo_key
  JOIN dim_tipo_estudio te
    ON te.tipo_estudio_key = f.tipo_estudio_key
  WHERE f.estado = 'REALIZADO'
  GROUP BY g.departamento, te.tipo_estudio
) r
WHERE posicion &lt;= 3;</pre><p style="font-size:.7em"><code>RANK() OVER (PARTITION BY …)</code> reinicia el ranking en cada departamento; la subconsulta es necesaria porque no se puede filtrar una ventana en el mismo nivel.</p></div><div><b>3 · Ingresos por centro y trimestre, con acumulado</b><pre style="font-size:.52em">SELECT e.nombre AS centro, t.anio, t.trimestre,
  SUM(f.costo_q) AS ingresos_q,
  SUM(SUM(f.costo_q)) OVER (
      PARTITION BY e.nombre, t.anio
      ORDER BY t.trimestre) AS acumulado_anio
FROM fact_estudio f
JOIN dim_entidad e ON e.entidad_key = f.entidad_key
JOIN dim_tiempo t ON t.tiempo_key = f.tiempo_key
WHERE f.estado = 'REALIZADO'
GROUP BY e.nombre, t.anio, t.trimestre;</pre><p style="font-size:.7em"><code>SUM() OVER (… ORDER BY trimestre)</code> da el <b>acumulado</b> del año: T1, T1+T2, T1+T2+T3…</p></div></div>`,
`Las consultas dos y tres usan funciones de ventana. La dos responde cuáles son los tres estudios más frecuentes de cada departamento. RANK con PARTITION BY departamento reinicia la numeración en cada departamento, y como no se puede filtrar el resultado de una ventana en el mismo nivel, la envolvemos en una subconsulta y filtramos las posiciones uno a tres. La tres calcula los ingresos de cada centro por trimestre y, con SUM OVER ordenado por trimestre, el acumulado del año: primer trimestre, primero más segundo, y así.`],

[`<h2>Consultas 4 y 5: perfil y campañas</h2><div class="cols"><div><b>4 · Perfil de pacientes</b><pre style="font-size:.52em">SELECT te.categoria, p.sexo,
       ge.etiqueta AS grupo_etario,
       COUNT(*) AS estudios
FROM fact_estudio f
JOIN dim_tipo_estudio te ON ...
JOIN dim_paciente p     ON ...
JOIN dim_grupo_etario ge ON ...
WHERE f.estado = 'REALIZADO'
GROUP BY te.categoria, p.sexo, ge.etiqueta;</pre><p style="font-size:.7em">Usa <b>tres dimensiones</b> que solo existen en el hecho de estudios: tipo, paciente y grupo etario. Responde «¿quién se hace qué?» sin ver ningún dato personal.</p></div><div><b>5 · Costo por persona atendida, por área</b><pre style="font-size:.52em">SELECT a.area, COUNT(*) AS campanas,
  SUM(c.personas_atendidas) AS personas,
  ROUND(SUM(c.presupuesto_q) /
    NULLIF(SUM(c.personas_atendidas), 0), 2)
    AS costo_por_persona_q
FROM fact_campana c
JOIN dim_area_campana a ON a.area_key = c.area_key
WHERE c.personas_atendidas &gt; 0
GROUP BY a.area
ORDER BY personas DESC;</pre><p style="font-size:.7em"><code>NULLIF(…, 0)</code> evita dividir entre cero. Solo cuenta campañas con atención registrada. Con datos de la app el presupuesto está vacío, así que el costo por persona solo es significativo con los datos sintéticos.</p></div></div>`,
`La consulta cuatro describe el perfil de los pacientes por categoría de estudio, sexo y grupo de edad. Es la que muestra el valor de las dimensiones propias del hecho de estudios, y lo hace sin ver ningún dato personal. La cinco calcula el costo por persona atendida en cada área de campaña. NULLIF evita la división entre cero y filtramos las campañas sin atención registrada. Una aclaración honesta: con los datos que vienen de la aplicación el presupuesto está vacío, así que esta métrica solo es significativa con los datos sintéticos.`],

[`<h2>Consultas 6 y 7: cruce de hechos y crecimiento</h2><div class="cols"><div><b>6 · Estudios vs. personas en campañas, por departamento</b> <span style='font-size:.7em'>(resumido)</span><pre style="font-size:.5em">SELECT g.departamento,
  COALESCE(e.estudios,0) AS estudios,
  COALESCE(c.personas,0) AS personas_en_campanas
FROM (SELECT DISTINCT departamento
      FROM dim_geografia WHERE geo_key &lt;&gt; -1) g
LEFT JOIN (-- estudios por departamento
   SELECT g1.departamento, COUNT(*) AS estudios
   FROM fact_estudio f JOIN dim_geografia g1 ...
   WHERE f.estado='REALIZADO' GROUP BY 1) e ...
LEFT JOIN (-- personas por departamento
   SELECT g2.departamento,
          SUM(fc.personas_atendidas) AS personas
   FROM fact_campana fc JOIN dim_geografia g2 ...
   GROUP BY 1) c ...
ORDER BY estudios DESC;</pre><p style="font-size:.68em"><b>Se agrega cada hecho por separado y luego se unen</b> por la dimensión conformada. Unir los dos hechos directamente multiplicaría filas y falsearía las sumas.</p></div><div><b>7 · Crecimiento mensual (LAG)</b><pre style="font-size:.5em">SELECT anio, mes, estudios,
  LAG(estudios) OVER (ORDER BY anio, mes)
        AS mes_anterior,
  ROUND(100 * (estudios - LAG(estudios)
    OVER (ORDER BY anio, mes))
    / LAG(estudios) OVER (ORDER BY anio, mes), 1)
        AS variacion_pct
FROM (SELECT anio, mes,
             SUM(total_estudios) AS estudios
      FROM fact_estudio_mensual
      GROUP BY anio, mes) m;</pre><p style="font-size:.68em"><code>LAG</code> trae el valor del mes anterior para calcular la <b>variación porcentual</b>. Usa la tabla de resumen: es más barata.</p></div></div>`,
`La consulta seis es la que justifica las dimensiones conformadas: cruza estudios y campañas por departamento. Fíjense en un detalle técnico importante: cada hecho se agrega por separado a nivel de departamento y recién entonces se unen los resultados. Unir directamente los dos hechos multiplicaría las filas y falsearía las sumas, porque son procesos con granos distintos. La consulta siete usa LAG para traer el valor del mes anterior y calcular la variación porcentual, y la hace sobre la tabla de resumen porque es más barata.`],

[`<h2>Resultados reales: consultas 1 y 8</h2><p style="font-size:.74em">Mismas <b>88 filas</b> (22 meses × 4 categorías, ene. 2025 a oct. 2026). Primeras filas:</p><table style="font-size:.66em"><tr><th>Año</th><th>Mes</th><th>Categoría</th><th>Estudios</th><th>Ingresos Q</th></tr><tr><td>2025</td><td>1</td><td>Imagenología</td><td>284</td><td>329,956.86</td></tr><tr><td>2025</td><td>1</td><td>Cardiología</td><td>121</td><td>55,786.45</td></tr><tr><td>2025</td><td>1</td><td>Laboratorio</td><td>117</td><td>12,875.52</td></tr><tr><td>2025</td><td>1</td><td>Neumología</td><td>41</td><td>11,782.06</td></tr><tr><td>2025</td><td>2</td><td>Imagenología</td><td>245</td><td>324,662.23</td></tr><tr><td colspan=5 style="text-align:center">… · último mes (oct. 2026): Imagenología 192 estudios · Q 206,632.26 …</td></tr></table><ul style="font-size:.72em"><li><b>Lectura:</b> Imagenología deja la mayor parte de los ingresos (tomografía y resonancia tienen los precios más altos).</li><li>Suma de las 88 filas = <b>11,510 estudios</b> y <b>Q 8,660,063.70</b>, igual que el total del hecho.</li><li>Octubre 2026 es menor porque los datos llegan solo hasta el <b>22 de octubre</b>.</li></ul>`,
`Aquí están los resultados reales de las consultas uno y ocho, que son idénticos. Son ochenta y ocho filas: veintidós meses por cuatro categorías. Por ejemplo, en enero de 2025 Imagenología tuvo doscientos ochenta y cuatro estudios y casi trescientos treinta mil quetzales de ingresos, mucho más que las otras categorías, porque la tomografía y la resonancia tienen precios altos. La suma de todas las filas coincide con el total del hecho: once mil quinientos diez estudios y ocho millones seiscientos sesenta mil quetzales. Octubre de 2026 es menor porque los datos llegan solo hasta el veintidós.`],

[`<h2>Resultados reales: consultas 2 y 3</h2><div class="cols"><div><b>2 · Top 3 por departamento (72 filas)</b><table style="font-size:.6em"><tr><th>Departamento</th><th>Tipo de estudio</th><th>Est.</th><th>Pos.</th></tr><tr><td>Guatemala</td><td>Rayos X de tórax</td><td>169</td><td>1</td></tr><tr><td>Guatemala</td><td>Ecocardiograma</td><td>150</td><td>2</td></tr><tr><td>Guatemala</td><td>Ultrasonido abdominal</td><td>149</td><td>3</td></tr><tr><td>Guatemala</td><td>Tomografía computarizada</td><td>149</td><td>3</td></tr><tr><td>Guatemala</td><td>Electrocardiograma</td><td>149</td><td>3</td></tr></table><p style="font-size:.68em"><b>Detalle:</b> <code>RANK</code> da la <b>misma posición a los empates</b>: tres tipos empatan con 149 en el puesto 3, por eso Guatemala muestra 5 filas y no 3.</p></div><div><b>3 · Centro de Imágenes Antigua</b><table style="font-size:.6em"><tr><th>Año</th><th>Trim.</th><th>Ingresos Q</th><th>Acumulado Q</th></tr><tr><td>2025</td><td>1</td><td>138,298.86</td><td>138,298.86</td></tr><tr><td>2025</td><td>2</td><td>159,330.60</td><td>297,629.46</td></tr><tr><td>2025</td><td>3</td><td>152,297.22</td><td>449,926.68</td></tr><tr><td>2025</td><td>4</td><td>132,681.70</td><td>582,608.38</td></tr><tr><td>2026</td><td>1</td><td>137,833.01</td><td>137,833.01</td></tr></table><p style="font-size:.68em">El acumulado <b>se reinicia cada año</b> (<code>PARTITION BY centro, año</code>): el T1 de 2026 vuelve a empezar.</p></div></div>`,
`La consulta dos muestra los tres estudios más frecuentes por departamento. Un detalle interesante: RANK da la misma posición a los empates. En Guatemala, tres tipos de estudio empatan con ciento cuarenta y nueve en el tercer lugar, así que aparecen cinco filas y no tres. Si quisiéramos exactamente tres, usaríamos ROW_NUMBER. La consulta tres muestra los ingresos por trimestre del Centro de Imágenes Antigua con el acumulado: en 2025 llega a casi seiscientos mil quetzales, y en 2026 el acumulado vuelve a empezar, porque la ventana se parte por centro y por año.`],

[`<h2>Resultados reales: consultas 4 y 5</h2><div class="cols"><div><b>4 · Cardiología, mujeres, por edad</b><table style="font-size:.64em"><tr><th>Grupo</th><th>Estudios</th></tr><tr><td>0-14</td><td>223</td></tr><tr><td>15-29</td><td>210</td></tr><tr><td>30-44</td><td>206</td></tr><tr><td>45-59</td><td>248</td></tr><tr><td>60+</td><td>286</td></tr><tr><td>Sin dato</td><td>2</td></tr></table><p style="font-size:.68em">El «Sin dato» es el hallazgo de las edades negativas. Los grupos se reparten parejo porque los datos son aleatorios.</p></div><div><b>5 · Costo por persona, por área</b><table style="font-size:.64em"><tr><th>Área</th><th>Camp.</th><th>Personas</th><th>Q/persona</th></tr><tr><td>Oncológico y otros</td><td>36</td><td>11,129</td><td>82.60</td></tr><tr><td>Planificación familiar</td><td>37</td><td>10,844</td><td>93.77</td></tr><tr><td>Respiratoria</td><td>39</td><td>9,524</td><td>123.15</td></tr><tr><td>Cardiovascular</td><td>38</td><td>8,997</td><td>124.44</td></tr></table><p style="font-size:.68em">150 campañas = 36 + 37 + 39 + 38. Personas: <b>40,494</b>. El área más barata por persona es Oncológico y otros; la más cara, Cardiovascular.</p></div></div>`,
`La cuatro es el perfil de pacientes; mostramos solo las mujeres de cardiología: se reparten parejo por grupo de edad porque los datos son aleatorios, y aparece el sin dato de dos estudios, que son parte de los treinta y un del hallazgo. La cinco da el costo por persona atendida en cada área: las campañas oncológicas salen en ochenta y dos quetzales por persona y las cardiovasculares en ciento veinticuatro. Las cuatro áreas suman las ciento cincuenta campañas y cuarenta mil cuatrocientas noventa y cuatro personas. Recordemos que con estos datos sintéticos el presupuesto es aleatorio, así que la comparación es una demostración de la consulta, no una conclusión.`],

[`<h2>Resultados reales: consultas 6 y 7</h2><div class="cols"><div><b>6 · Estudios vs. personas en campañas</b><table style="font-size:.62em"><tr><th>Departamento</th><th>Estudios</th><th>Personas</th></tr><tr><td>Guatemala</td><td>1,472</td><td>2,095</td></tr><tr><td>Escuintla</td><td>842</td><td>1,228</td></tr><tr><td>Chimaltenango</td><td>744</td><td>2,869</td></tr><tr><td>Quetzaltenango</td><td>710</td><td>2,055</td></tr><tr><td>Izabal</td><td>709</td><td>2,508</td></tr><tr><td>Alta Verapaz</td><td>687</td><td>337</td></tr><tr><td>Sacatepéquez</td><td>684</td><td>1,772</td></tr></table><p style="font-size:.66em"><b>Lectura:</b> Alta Verapaz tiene muchos estudios pero pocas personas en campañas (337): una brecha que el cruce hace visible.</p></div><div><b>7 · Crecimiento mensual</b><table style="font-size:.62em"><tr><th>Mes</th><th>Estudios</th><th>Anterior</th><th>Var. %</th></tr><tr><td>2025-01</td><td>563</td><td>NULL</td><td>NULL</td></tr><tr><td>2025-02</td><td>495</td><td>563</td><td>-12.1</td></tr><tr><td>2025-03</td><td>533</td><td>495</td><td>7.7</td></tr><tr><td>2025-04</td><td>499</td><td>533</td><td>-6.4</td></tr><tr><td>2026-09</td><td>493</td><td>518</td><td>-4.8</td></tr><tr><td>2026-10</td><td>391</td><td>493</td><td>-20.7</td></tr></table><p style="font-size:.66em">El primer mes no tiene anterior (<code>NULL</code>). El −20.7 % de octubre es por mes <b>incompleto</b> (datos hasta el 22).</p></div></div>`,
`La consulta seis cruza los dos procesos: estudios realizados contra personas atendidas en campañas, por departamento. Guatemala tiene mil cuatrocientos setenta y dos estudios; pero fíjense en Alta Verapaz: seiscientos ochenta y siete estudios y solo trescientas treinta y siete personas en campañas, una brecha que solo se ve al cruzar los dos hechos; esa es la utilidad de las dimensiones conformadas. En la siete, el primer mes no tiene mes anterior, así que aparece nulo, y octubre de 2026 baja veinte por ciento porque los datos llegan solo hasta el veintidós, no porque haya una caída real.`],

[`<h2><code>EXPLAIN</code> real: consulta 1 contra consulta 8</h2><div class="cols"><div><b>Consulta 1 (sobre el hecho)</b><table style="font-size:.56em"><tr><th>Tabla</th><th>Acceso</th><th>Índice</th><th>Filas</th></tr><tr><td><code>te</code> (tipo)</td><td>ALL (lee todo)</td><td>—</td><td>10</td></tr><tr><td><code>f</code> (hecho)</td><td>ref</td><td><code>tipo_estudio_key</code></td><td>≈1,354 por tipo</td></tr><tr><td><code>t</code> (tiempo)</td><td>eq_ref</td><td>PRIMARY</td><td>1</td></tr></table><p style="font-size:.66em">Parte de la dimensión chica (10 filas) y busca en el hecho por índice. Total ≈ <b>13,500 filas</b> del hecho examinadas, y <b>Using temporary</b> para agrupar.</p></div><div><b>Consulta 8 (sobre el resumen)</b><table style="font-size:.56em"><tr><th>Tabla</th><th>Acceso</th><th>Índice</th><th>Filas</th></tr><tr><td><code>m</code> (resumen)</td><td>ALL (lee todo)</td><td>—</td><td><b>1,758</b></td></tr><tr><td><code>te</code> (tipo)</td><td>eq_ref</td><td>PRIMARY</td><td>1</td></tr></table><p style="font-size:.66em">Recorre las 1,758 filas del resumen y une con una sola dimensión. También usa <b>Using temporary</b>.</p></div></div><div class="box" style="font-size:.7em;margin-top:.4em"><b>Conclusión:</b> la 8 examina ≈ 8 veces menos filas y hace una unión menos. Eso es lo que explica los ≈1.6 ms contra ≈11 ms medidos. (<code>filtered 33.33 %</code> en la 1: el filtro <code>estado = 'REALIZADO'</code> descarta filas que la 8 ya no trae.)</div>`,
`Esta es la salida real de EXPLAIN. La consulta uno parte de la dimensión de tipo de estudio, que tiene diez filas, y para cada tipo busca en el hecho usando el índice; en total examina unas trece mil quinientas filas del hecho y hace tres accesos. La consulta ocho recorre las mil setecientas cincuenta y ocho filas del resumen y une con una sola dimensión. Ambas usan una tabla temporal para agrupar. La diferencia en filas examinadas, de ocho a uno aproximadamente, y una unión menos, es lo que explica los tiempos medidos de unos once milisegundos contra uno punto seis.`],

[`<h2>Las 8 vistas del almacén</h2><table style="font-size:.64em"><tr><th>#</th><th>Vista</th><th>Responde</th></tr><tr><td>1</td><td><code>v_estudios_mes_categoria</code></td><td>Estudios e ingresos por mes y categoría (88 filas)</td></tr><tr><td>2</td><td><code>v_top3_estudios_departamento</code></td><td>3 estudios más frecuentes por departamento (72 filas)</td></tr><tr><td>3</td><td><code>v_ingresos_centro_trimestre</code></td><td>Ingresos por centro y trimestre, con acumulado anual</td></tr><tr><td>4</td><td><code>v_perfil_pacientes</code></td><td>Estudios por categoría, sexo y grupo de edad</td></tr><tr><td>5</td><td><code>v_campanas_por_area</code></td><td>Campañas, personas y costo por persona por área</td></tr><tr><td>6</td><td><code>v_estudios_vs_campanas_departamento</code></td><td>Cruce de ambos hechos por departamento</td></tr><tr><td>7</td><td><code>v_crecimiento_mensual</code></td><td>Estudios por mes con variación porcentual (LAG)</td></tr><tr><td>8</td><td><code>v_estudios_mes_categoria_resumen</code></td><td>La consulta 1 sobre la tabla de resumen</td></tr></table><ul style="font-size:.72em"><li>Se crean con <code>CREATE OR REPLACE VIEW</code> (<code>04b_dw_vistas.sql</code>), después del esquema y antes del ETL.</li><li>El rol <code>analista</code> las lee porque tiene <code>GRANT SELECT</code> sobre todo <code>sisg_dw</code>; <b>no puede escribir</b>.</li><li>Quien consulta solo necesita <code>SELECT * FROM v_…</code>, sin saber las uniones.</li></ul>`,
`Estas son las ocho vistas, una por consulta, con su nombre. Se crean con CREATE OR REPLACE VIEW después del esquema del almacén. El rol analista las puede leer porque tiene permiso de solo lectura sobre toda la base del almacén, y no puede modificar nada. La ventaja para quien consulta es que escribe un simple SELECT sobre la vista y no necesita conocer las uniones ni el diseño de la estrella.`],

[`<h2>Desempeño: tabla de sumarización</h2><div class="cols"><div class="box"><b>Consulta 1</b> · <code>fact_estudio</code><br>12,507 filas<br><span class="big">≈ 11 ms</span></div><div class="box o"><b>Consulta 8</b> · <code>fact_estudio_mensual</code><br>1,758 filas<br><span class="big">≈ 1.6 ms</span></div></div><p class="big" style="text-align:center">≈ 7 veces más rápida</p><ul><li>Resumen por <b>mes × centro × tipo de estudio</b></li><li>Se quitó la geografía a propósito: con ella casi no reducía (10,106 vs 12,219 filas)</li><li>Medición: promedio de 50 ejecuciones, repetido 3 veces, MySQL 8, datos sintéticos; comparado con <code>EXPLAIN</code></li></ul>`,
`La tabla de sumarización guarda estudios, ingresos y duración promedio por mes, centro y tipo de estudio. Tiene unas mil setecientas filas contra más de doce mil del hecho. La misma pregunta tarda unos once milisegundos sobre el hecho y uno punto seis sobre el resumen: unas siete veces más rápido. Medimos el promedio de cincuenta ejecuciones, tres veces, y lo comparamos con EXPLAIN. Quitamos la geografía a propósito porque al incluirla la tabla casi no se reducía. Aclaramos que son datos sintéticos, así que el tiempo exacto depende de la máquina; lo que importa es la proporción.`],

[`<h2>La aplicación en funcionamiento</h2><div class="cols"><div><ul><li><b>4 roles:</b> superadmin (plataforma) y, por entidad, administrador, operador y auditor</li><li>Cada entidad ve <b>solo lo suyo</b></li><li>Pacientes, estudios y campañas, con <b>carga masiva por CSV</b></li><li><b>Alertas</b> (p. ej. campañas sin costo)</li><li><b>Panel de impacto</b> y <b>referidos</b> entre organismo y centro</li><li>Exportación <b>FHIR</b> y enlace seguro para entregar resultados</li></ul></div><div class="box b"><b>Tecnología</b><br>Backend: NestJS + MySQL 8<br>Interfaz: TanStack Start + React + Tailwind<br><br><b>103 pruebas automáticas</b> de extremo a extremo (pasan)</div></div><p class="mut">Ejemplo de la demo: organización con 25 pacientes, 6 campañas y 660 personas atendidas.</p>`,
`Esta es la aplicación que genera los datos. Tiene cuatro roles, tres por entidad más el de plataforma, y cada entidad ve solo lo suyo. Permite registrar pacientes, estudios y campañas, cargarlos masivamente por CSV, y tiene alertas, por ejemplo de campañas sin costo, un panel de impacto y referidos entre un organismo y un centro. Exporta en formato FHIR, que es un estándar de salud, y permite entregar resultados con un enlace seguro. Tiene ciento tres pruebas automáticas de extremo a extremo que pasan. Si hay tiempo, aquí hacemos la demostración en vivo.`],
